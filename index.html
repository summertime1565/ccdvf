<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CCDVF 응용문제 트레이너</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="CCDVF 응용문제 106문항 랜덤 학습기">
</head>
<body>
<style>
:root{
  --ground:#F6F7FB; --surface:#FFFFFF; --sunk:#ECEFF7;
  --ink:#161A26; --ink-2:#414759; --muted:#697086; --line:#DBDFED; --line-2:#C2C8DE;
  --accent:#2B3F94; --accent-2:#3A52B8; --accent-soft:#E5E9F8; --on-accent:#FFFFFF;
  --ok:#136B40; --ok-soft:#E2F0E8; --ok-line:#9CC9B2;
  --no:#9E2F2A; --no-soft:#F7E7E5; --no-line:#DCACA8; --on-sem:#FFFFFF;
  --ring:0 0 0 3px rgba(43,63,148,.28);
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono","SF Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --ground:#0F1219; --surface:#171B26; --sunk:#1E2331;
  --ink:#E6E9F2; --ink-2:#ADB4C8; --muted:#7C8398; --line:#262C3C; --line-2:#363D52;
  --accent:#8CA3F6; --accent-2:#A5B7FA; --accent-soft:#191F33; --on-accent:#0A0E1C;
  --ok:#4FB37B; --ok-soft:#13251C; --ok-line:#2F5F46;
  --no:#E5837A; --no-soft:#2A1817; --no-line:#69403B; --on-sem:#08120F;
  --ring:0 0 0 3px rgba(140,163,246,.34);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1219; --surface:#171B26; --sunk:#1E2331;
  --ink:#E6E9F2; --ink-2:#ADB4C8; --muted:#7C8398; --line:#262C3C; --line-2:#363D52;
  --accent:#8CA3F6; --accent-2:#A5B7FA; --accent-soft:#191F33; --on-accent:#0A0E1C;
  --ok:#4FB37B; --ok-soft:#13251C; --ok-line:#2F5F46;
  --no:#E5837A; --no-soft:#2A1817; --no-line:#69403B; --on-sem:#08120F;
  --ring:0 0 0 3px rgba(140,163,246,.34);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
}
button{font:inherit;color:inherit}
code{font-family:var(--font-mono);font-size:.88em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:.08em .3em;overflow-wrap:anywhere}

h1,h2,h3,h4,p,ul,ol,li,figure{margin:0}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px}

/* ---------- shell ---------- */
.wrap{max-width:47rem;margin:0 auto;padding:0 clamp(14px,4vw,28px)}
.bar{
  position:sticky;top:0;z-index:20;background:var(--ground);
  border-bottom:1px solid var(--line);
}
@supports (backdrop-filter:blur(4px)){
  .bar{background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(10px)}
}
.bar-in{display:flex;align-items:center;gap:12px;height:52px}
.mark{
  font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);white-space:nowrap
}
.mark span{color:var(--accent)}
.bar-sp{flex:1}
.count{font-family:var(--font-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{color:var(--ink);font-weight:700}
.ghost{
  background:none;border:1px solid var(--line);border-radius:7px;padding:7px 12px;
  font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap
}
.ghost:hover{border-color:var(--line-2);background:var(--sunk)}
.rail{height:3px;background:var(--sunk)}
.rail i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s ease}

/* ---------- start ---------- */
.hero{padding:clamp(34px,9vw,64px) 0 8px}
.eyebrow{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:600
}
.hero h1{
  margin-top:14px;font-size:clamp(29px,7.6vw,44px);line-height:1.14;letter-spacing:-.02em;
  font-weight:750;text-wrap:balance
}
.hero p{margin-top:14px;color:var(--ink-2);max-width:34rem;font-size:16.5px}
.stats{display:flex;flex-wrap:wrap;gap:14px 26px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-mono);font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase}

.setup{display:flex;flex-direction:column;gap:26px;padding:30px 0 12px}
.field{display:flex;flex-direction:column;gap:10px}
.label{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600
}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  font-size:14.5px;cursor:pointer;color:var(--ink-2);min-height:44px
}
.pill:hover:not([disabled]){border-color:var(--line-2)}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.pill[disabled]{opacity:.42;cursor:not-allowed}
.pill em{font-style:normal;font-family:var(--font-mono);font-size:12px;opacity:.75;margin-left:5px}
.hint{font-size:13.5px;color:var(--muted)}
.cta{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);
  border-radius:10px;padding:16px;font-size:16.5px;font-weight:650;cursor:pointer;min-height:54px
}
.cta:hover{background:var(--accent-2);border-color:var(--accent-2)}
.cta.sec{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.cta.sec:hover{background:var(--sunk)}
.row{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.foot{padding:26px 0 40px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:26px}

/* ---------- question ---------- */
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:26px 0 0}
.chip{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:5px;padding:4px 8px;color:var(--muted);background:var(--surface)
}
.chip.dom{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 38%,var(--line));background:var(--accent-soft)}
.qtext{
  margin-top:18px;font-size:17px;font-weight:400;line-height:1.68;white-space:pre-wrap;
  max-width:64ch;letter-spacing:-.003em
}
.opts{display:grid;gap:9px;margin-top:22px}
.opt{
  display:grid;grid-template-columns:28px 1fr;gap:13px;align-items:start;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:14px 15px;cursor:pointer;font-size:15.5px;line-height:1.55;min-height:54px;
  transition:border-color .12s ease, background .12s ease
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.mk{
  display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--line-2);color:var(--muted);
  font-family:var(--font-mono);font-size:12.5px;font-weight:700
}
.opt:hover:not(:disabled) .mk{border-color:var(--accent);color:var(--accent)}
.opt .tx{padding-top:3px}
.opt[data-s="sel"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[data-s="sel"] .mk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt[data-s="ok"]{border-color:var(--ok-line);background:var(--ok-soft)}
.opt[data-s="ok"] .mk{background:var(--ok);border-color:var(--ok);color:var(--on-sem)}
.opt[data-s="no"]{border-color:var(--no-line);background:var(--no-soft)}
.opt[data-s="no"] .mk{background:var(--no);border-color:var(--no);color:var(--on-sem)}
.opt[data-s="dim"]{opacity:.62}

/* ---------- explanation ---------- */
.exp{margin-top:24px;display:flex;flex-direction:column;gap:20px;animation:rise .26s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.verdict{
  display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:700
}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.verdict i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--on-sem);font-style:normal;font-size:12px}
.verdict.ok i{background:var(--ok)} .verdict.no i{background:var(--no)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h4{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600
}
.sec p{font-size:15.5px;line-height:1.72;color:var(--ink-2);white-space:pre-wrap}
.memo{
  border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;
  padding:14px 16px;display:flex;flex-direction:column;gap:7px
}
.memo h4{color:var(--accent)}
.memo p{color:var(--ink);font-weight:600;font-size:15.5px;line-height:1.7;white-space:pre-wrap}

/* ---------- action bar ---------- */
.act{
  position:sticky;bottom:0;z-index:20;margin-top:28px;background:var(--ground);
  border-top:1px solid var(--line);
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));
}
@supports (backdrop-filter:blur(4px)){
  .act{background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px)}
}
.act-in{display:flex;align-items:center;gap:9px}
.act .cta{width:auto;flex:1;padding:14px 18px;min-height:50px;font-size:16px}
.kbd{display:none;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
@media (min-width:760px){.kbd{display:block}}
.kbd b{border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-weight:600;color:var(--ink-2)}

/* ---------- result ---------- */
.score{padding:34px 0 4px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 28px}
.big{font-family:var(--font-mono);font-size:clamp(52px,15vw,78px);line-height:.92;letter-spacing:-.04em;font-weight:700;font-variant-numeric:tabular-nums}
.big s{text-decoration:none;color:var(--muted);font-size:.42em;letter-spacing:0}
.meta{display:flex;flex-direction:column;gap:3px;padding-bottom:6px}
.meta b{font-family:var(--font-mono);font-size:16px;font-variant-numeric:tabular-nums}
.meta span{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.block{margin-top:34px;display:flex;flex-direction:column;gap:12px}
.block>h3{font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:center;gap:9px}
.block>h3 em{font-style:normal;font-family:var(--font-mono);font-size:12px;color:var(--muted);font-weight:500}
.doms{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--line)}
.domrow{display:grid;grid-template-columns:1fr auto;gap:5px 14px;background:var(--surface);padding:11px 14px}
.domrow .n{font-size:14px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.domrow .v{font-family:var(--font-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.domrow .b{grid-column:1/-1;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.domrow .b i{display:block;height:100%;background:var(--ok)}
.domrow.bad .b i{background:var(--no)}
details.rev{border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
details.rev+details.rev{margin-top:8px}
details.rev>summary{
  cursor:pointer;padding:13px 15px;display:grid;grid-template-columns:auto 1fr;gap:11px;
  align-items:start;font-size:14.5px;line-height:1.5;list-style:none
}
details.rev>summary::-webkit-details-marker{display:none}
details.rev>summary b{
  font-family:var(--font-mono);font-size:11px;color:var(--no);border:1px solid var(--no-line);
  background:var(--no-soft);border-radius:5px;padding:3px 7px;white-space:nowrap;font-weight:700;letter-spacing:.04em
}
details.rev>summary .s{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-2)
}
details.rev[open]>summary .s{color:var(--ink)}
.rev-body{
  padding:16px 15px 18px;display:flex;flex-direction:column;gap:18px;
  border-top:1px solid var(--line)
}
.rev-body .qtext{margin-top:0;font-size:15.5px}
.pick{display:flex;flex-direction:column;gap:8px}
.pick div{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:14.5px;line-height:1.55}
.pick b{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:3px;white-space:nowrap}
.pick .y b{color:var(--no)} .pick .c b{color:var(--ok)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="bar">
  <div class="wrap"><div class="bar-in" id="bar"></div></div>
  <div class="rail"><i id="rail"></i></div>
</div>
<div class="wrap"><main id="root"></main></div>

<script>
const RAW = [{"src":"응용문제1","no":"1","q":"Your Claude application extracts invoice fields as structured JSON and validates them, but it has been treating validation failures as terminal errors. Each validation failure causes the entire billing request to fail. The team wants to handle validation failures more gracefully. How would you handle the validation failures?","opts":["Treat validation failures as a recognized error path that triggers retry, repair, or fallback logic before failing the billing request.","Tell each billing user that invalid JSON is simply part of the process, and ask them to check every extracted invoice by hand before they trust the numbers.","Forward the malformed JSON records to the payment and ledger services unchanged, and let every receiving service decide on its own what to do with the broken data.","Turn schema validation off for now, and keep it switched off until a later release finds and fixes the real reason the extracted invoices fail."],"ol":["D","A","B","C"],"why":"검증 실패는 예외적인 종료 사유가 아니라 미리 예상해 둔 에러 경로로 다뤄야 합니다. 요청을 곧바로 실패시키기 전에 오류 내용을 다시 전달하는 재시도, 파서를 통한 자동 수정, 기본값이나 백업 경로 같은 대체 처리를 먼저 태워야 합니다. 이렇게 해야 청구 요청 전체가 한 번의 형식 오류로 무너지지 않습니다.","domain":"Error Handling / Output Validation","trap":"A (Manual verification): 사람이 손으로 확인하게 떠넘기는 것은 개발 차원의 복구 설계가 아닙니다.\nB (Downstream deferral): 깨진 데이터를 결제·원장 시스템으로 넘기면 오류가 하위 시스템 전체로 퍼집니다.\nC (Disable validation): 검증 자체를 끄는 것은 시스템의 안정성과 신뢰성을 포기하는 선택입니다.\n→ 판단 기준: 검증 실패를 시스템 내부에서 복구 가능한 에러 경로로 설계했는가.","memo":"검증에 실패했을 때는 곧바로 실패시키지 말고 재시도·수정·대체 경로로 복구한다."},{"src":"응용문제1","no":"2","q":"Your Claude translation service currently logs every API error at the same severity level. The team wants to separate errors that should page an on-call engineer from errors that should only be recorded for later review. How would you structure the error handling?","opts":["Categorize errors by severity based on impact and recoverability, then route each category to the appropriate channel for paging or logging.","Keep records only for errors that page someone and drop the rest, since an error that never pages is not worth storing in the logs at all.","Keep one shared severity for every error, because splitting errors into levels only creates extra work that rarely helps a service of this size.","Send a page to the on-call engineer for every single error, so the team can be sure that no failure in the service is ever missed."],"ol":["B","A","C","D"],"why":"에러는 서비스에 미치는 영향도와 복구 가능성을 기준으로 심각도를 나눈 뒤, 등급별로 서로 다른 채널로 보내야 합니다. 서비스 중단이나 지속적인 인증 실패, 5xx 오류처럼 즉시 개입이 필요한 건은 호출(page)로, 일시적인 429나 사용자 입력 오류처럼 재시도로 풀리는 건은 로그로 남깁니다. 분류 후 차등 대응이 핵심입니다.","domain":"Observability / Error Severity Routing","trap":"A (Selective log suppression): 알림 대상이 아니라고 로깅까지 버리면 추후 추적과 모니터링이 불가능해집니다.\nC (Uniform severity): 모든 에러를 같은 등급으로 두는 것은 문제 상황 자체를 그대로 두는 것입니다.\nD (Universal paging): 전건 호출은 경보 피로를 일으켜 정작 중요한 장애 알림을 놓치게 만듭니다.\n→ 판단 기준: 영향도와 복구 가능성으로 등급을 나눈 뒤 채널을 달리 라우팅했는가.","memo":"대응 수준을 나눠야 할 때는 영향도와 복구 가능성으로 등급을 분류해 알맞은 채널로 보낸다."},{"src":"응용문제1","no":"3","q":"Your Claude application runs long agentic research sessions where the agent makes many search tool calls, and the conversation history grows quickly. After about 30 tool calls, you notice the agent's answers become less focused and sometimes ignore constraints given at the start. How would you address this?","opts":["Apply context engineering techniques such as tool output pruning or compaction to keep the active task state visible while reducing the volume of older content.","Clear the session and begin again after every sixth search call, accepting that all progress and task state gathered so far disappears each time the agent starts over.","Delete every search tool from the session, letting the agent write one answer from memory alone, so that no tool results are ever stored in its context.","Choose a model with a far bigger context window and keep all search results stored word for word, however many the long session ends up collecting."],"ol":["C","A","B","D"],"why":"이력이 쌓여 집중도가 떨어질 때는 기능이나 상태를 버리는 대신 컨텍스트를 정리해야 합니다. 더 이상 쓰이지 않는 과거 검색 결과는 가지치기로 제거하고, 지난 진행 내용은 요약해 압축하되 현재 작업 상태와 처음 받은 제약 조건은 그대로 보이게 남깁니다. 상태 보존과 컨텍스트 축소를 동시에 만족시키는 것이 핵심입니다.","domain":"Agent Architecture / Context Management","trap":"A (Periodic state reset): 주기적으로 초기화하면 작업 상태까지 사라져 연속된 조사 작업을 이어갈 수 없습니다.\nB (Capability removal): 검색 툴을 없애면 에이전트 기반의 복합 작업 자체가 불가능해집니다.\nD (Capacity scaling only): 창 크기만 키우면 불필요한 정보가 계속 쌓여 집중도 문제는 그대로이고 비용과 지연만 늘어납니다.\n→ 판단 기준: 핵심 작업 상태는 보존하면서 오래된 내용의 양만 줄였는가.","memo":"쌓인 내용이 성능을 떨어뜨릴 때는 핵심 상태는 남기고 오래된 부분만 정리·압축한다."},{"src":"응용문제1","no":"4","q":"You have just launched a new Claude-powered translation assistant into production. The build phase is complete, and the system is now in daily use by the support organization. The next phase of work for this system is...","opts":["operating and maintaining the system, including monitoring, responding to issues, and planning evolution.","removing the system from service now, on the grounds that no work is left once an application has reached its real users.","holding one launch retrospective about how the build phase went, and pausing all other work on the system until that meeting is finished.","transferring full ownership to a different support group, so the engineers who built the assistant no longer take part in running it."],"ol":["A","B","C","D"],"why":"프로덕션 배포는 개발의 끝이 아니라 운영·유지보수 단계의 시작입니다. 응답 품질·레이턴시·토큰 사용량·에러율을 계속 모니터링하고, 문제가 생기면 프롬프트와 코드를 고치며, 사용자 피드백을 반영해 다음 개선을 계획해야 합니다. 이 지속적인 책임이 이어지는 것이 배포 이후의 정상적인 단계입니다.","domain":"Lifecycle / Post-Deployment Operations","trap":"B (Immediate retirement): 배포 직후 시스템을 폐기한다는 설명은 라이프사이클을 잘못 이해한 것입니다.\nC (Review-only step): 사후 검토만 하고 다른 작업을 멈추면 지속적인 운영 단계가 통째로 빠집니다.\nD (Complete team handoff): 개발팀을 완전히 배제한 이관은 협업 기반의 지속 개선과 맞지 않습니다.\n→ 판단 기준: 배포 후에도 모니터링·이슈 대응·진화 계획을 이어가는 선택인가.","memo":"배포가 완료됐을 때는 지속적인 운영·유지보수 단계로 이어간다."},{"src":"응용문제1","no":"5","q":"Your Claude agent's hooks currently run on every tool call, which makes the deployment agent noticeably slower even when a call carries no risk. The team wants to scope hooks more carefully. How would you scope the hooks?","opts":["Scope hooks to only the high-risk actions, such as destructive operations or sensitive data access, and remove hooks from low-risk actions to balance safety with performance.","Remove every hook from the agent for now, and rely on the team finishing the re-scoping work fast enough that the gap in checks stays short.","Delete the hooks and write the same rules into the system prompt instead, expecting the agent to follow that written text before each action.","Shut the agent down during busy hours, so the extra time spent on hook checks never reaches users when request volume is at its highest."],"ol":["B","A","C","D"],"why":"훅은 전부 켜거나 전부 끄는 장치가 아니라 위험도에 따라 범위를 좁혀 적용하는 장치입니다. 데이터 삭제 같은 파괴적 작업이나 민감 정보 접근에는 검증을 유지하고, 단순 조회처럼 위험이 낮은 작업에서는 훅을 제거해 응답 속도를 회복합니다. 안전성과 성능을 동시에 지키는 것이 핵심입니다.","domain":"Agent Safety / Hook Scoping","trap":"A (Blanket disabling): 모든 훅을 끄면 재조정 기간 내내 보안·안전 위험에 그대로 노출됩니다.\nC (Prompt-only enforcement): 시스템 프롬프트 지시는 강제력이 없어 훅을 대체할 수 없고 우회에 취약합니다.\nD (Availability sacrifice): 바쁜 시간대에 에이전트를 멈추는 것은 서비스 가용성을 포기하는 대처입니다.\n→ 판단 기준: 고위험 작업에만 검증 범위를 좁혀 안전성과 성능을 함께 지켰는가.","memo":"안전장치가 성능을 해칠 때는 고위험 작업에만 범위를 좁혀 적용한다."},{"src":"응용문제1","no":"6","q":"A teammate has submitted a pull request that adds a Claude-powered summarization feature to your reporting service. The code works, but the prompt and model selection are hard-coded inline, error handling is missing, and there are no tests for the integration. What would you request during code review?","opts":["Request changes that move prompt and model configuration to a configurable location, add error handling for Claude API failures, and add tests for the integration.","Merge the pull request unchanged, because the feature already returns a correct summary on a normal request, and leave the remaining gaps for a later commit.","Merge the pull request now and add the missing configuration, error handling, and tests yourself later, instead of asking the author to do that work.","Request only the configuration change and the tests before merging, and record the missing API error handling as an item for a future release."],"ol":["B","A","C","D"],"why":"외부 모델 API를 붙이는 코드는 병합 전에 세 가지를 함께 갖춰야 합니다. 프롬프트와 모델 설정은 하드코딩 대신 구성 파일이나 환경 변수로 분리하고, 레이트 리밋·타임아웃·5xx 같은 API 장애에 대비한 에러 처리를 넣고, 연동과 파싱이 정상 동작하는지 확인하는 테스트를 추가해야 합니다. 셋 중 하나라도 빠지면 프로덕션 장애로 이어집니다.","domain":"Code Review / API Integration Standards","trap":"A (Approve as-is): 정상 경로만 동작한다는 이유로 그대로 승인하면 결함이 그대로 프로덕션으로 넘어갑니다.\nC (Reviewer self-patching): 리뷰어가 대신 메우는 방식은 작성자의 책임과 리뷰 절차 자체를 무너뜨립니다.\nD (Partial deferral): 에러 처리를 다음 릴리스로 미루면 API 장애 시 서비스 전체가 멈출 수 있습니다.\n→ 판단 기준: 설정 분리·에러 처리·테스트를 모두 병합 조건으로 요구했는가.","memo":"외부 API 연동을 리뷰할 때는 설정 분리·에러 처리·테스트를 함께 요구한다."},{"src":"응용문제1","no":"7","q":"Your Claude application's prompt was written a year ago and has not been revised. The team has found through evals that the prompt produces degraded performance on one category of inputs whose volume has grown steadily. How would you respond?","opts":["Iterate on the prompt to address the underperforming category, validate the change with evals, and continue refining as needed.","Delete the current prompt and write a new one tuned only for the weak category, and accept any quality change on the inputs that already work well.","Leave the prompt as it is and show a notice in the user interface warning people that some kinds of input may not be handled well.","Build a second Claude application with its own prompt just for the weak category, so the existing prompt can stay exactly as it is today."],"ol":["D","A","B","C"],"why":"특정 입력 범주에서 품질이 떨어지면 그 범주를 처리하도록 프롬프트를 점진적으로 수정해야 합니다. 수정 후에는 반드시 평가 세트를 실행해 해당 범주가 개선됐는지, 기존에 잘 동작하던 일반 케이스에 리그레션이 없는지 확인하고, 필요하면 다시 다듬는 과정을 반복합니다. 개선과 검증의 반복이 핵심입니다.","domain":"Prompt Engineering / Eval-Driven Iteration","trap":"A (Wholesale replacement): 문제 범주만 보고 전면 교체하면 기존 일반 케이스의 성능이 크게 떨어질 수 있습니다.\nB (Surface-level workaround): UI 경고문으로 우회하는 것은 원인을 그대로 두는 임시방편입니다.\nC (System duplication): 범주 하나 때문에 애플리케이션을 분리하면 불필요한 시스템 복잡성만 늘어납니다.\n→ 판단 기준: 프롬프트를 개선하고 평가로 검증하며 반복하는 절차를 밟았는가.","memo":"일부 입력에서 품질이 떨어질 때는 개선 후 평가로 검증하며 반복한다."},{"src":"응용문제1","no":"8","q":"A Claude-powered scheduling assistant returns appointment data as JSON, but the output drifts away from the expected format after several conversation turns. The first few turns produce correctly formatted output, while later turns gradually lose structure. How would you address the drift?","opts":["Identify the failure mode as format drift, examine how the conversation context evolves over turns, and address the drift through context management or output validation.","Clear the whole session after each turn, then watch whether the format stays correct in the turns that follow.","Keep only the opening characters of each response, check that short piece against the required JSON shape, and record every mismatch in a log for review.","Move the assistant to a smaller Claude model and run the same conversations again to see whether the format still degrades in later turns."],"ol":["C","A","B","D"],"why":"턴이 쌓이면서 형식이 무너지는 것은 형식 드리프트라는 실패 모드입니다. 대화가 길어질수록 컨텍스트가 어떻게 변하고 스키마 지시가 희석되는지를 먼저 살핀 뒤, 매 턴 핵심 지시를 보존·재강조하거나 이력을 정리하는 컨텍스트 관리와, 출력을 검증해 재시도·복구하는 출력 검증으로 대응해야 합니다.","domain":"Error Handling / Output Format Drift","trap":"A (Context discarding): 매 턴 초기화하면 이전 문맥을 모두 잃어 멀티턴 서비스 자체가 불가능해집니다.\nB (Partial output validation): 앞부분 몇 글자만 잘라 검사하면 전체 JSON 스키마의 유효성을 판별할 수 없습니다.\nD (Model swap): 더 작은 모델로 바꿔도 컨텍스트 이탈은 그대로이고 지시 수행 능력만 떨어질 수 있습니다.\n→ 판단 기준: 원인을 형식 드리프트로 진단하고 컨텍스트 관리·출력 검증으로 대응했는가.","memo":"출력 형식이 점차 무너질 때는 원인을 진단해 컨텍스트 관리와 출력 검증으로 대응한다."},{"src":"응용문제1","no":"9","q":"The team is debating whether to integrate with the Claude API directly or through a third-party wrapper library that supports multiple LLM providers. The team has confirmed that all current and planned use cases run on Claude, no internal customer has asked for LLM portability, and the product roadmap does not mention multi-provider support over the next three years. The wrapper would add roughly 20 percent overhead in code complexity and introduce one additional dependency. Which integration approach would you recommend?","opts":["Direct integration with Claude through its SDK, because no multi-provider need exists and abstraction would add complexity that does not pay off.","A wrapper the team writes itself to hide several model vendors, giving the team full ownership of all the code that sits between the service and any provider.","The third-party wrapper anyway, because the option to change model vendors later is worth keeping in every service that the team builds.","Both integrations kept alive side by side, with part of the traffic routed through each one so the team can compare them while the service runs."],"ol":["D","A","B","C"],"why":"확인된 멀티 프로바이더 요구가 없고 로드맵에도 없다면 추상화 계층은 지금 필요하지 않은 비용입니다(YAGNI). 공식 SDK로 직접 연동하면 툴 사용이나 확장 사고 같은 최신 기능을 온전히 쓰면서 불필요한 복잡도와 의존성을 줄일 수 있습니다.","domain":"Architecture / Abstraction Trade-offs","trap":"A (In-house abstraction): 직접 만든 추상화도 개발 자원과 유지보수 비용을 그대로 발생시킵니다.\nB (Speculative flexibility): 막연한 미래의 유연성을 이유로 지금 필요 없는 계층을 넣는 선택입니다.\nC (Parallel maintenance): 두 경로를 함께 유지하면 개발과 테스트 복잡도가 두 배로 늘어납니다.\n→ 판단 기준: 입증된 요구가 없는 유연성에 복잡도를 지불하지 않았는가.","memo":"입증된 요구가 없을 때는 추상화를 더하지 않고 직접 연동한다."},{"src":"응용문제1","no":"10","q":"You are designing a Claude application that will process incoming job applications in two stages: a screening stage that classifies applications and a feedback stage that drafts replies to candidates. The team is debating whether to use a single Claude call that handles both stages or separate Claude calls for each stage. How would you structure the application?","opts":["Use separate Claude calls for screening and feedback, because each stage has distinct inputs, outputs, and success criteria that benefit from focused prompts.","Keep both stages inside one Claude call, because the total bill is lower whenever a system sends fewer model requests, whatever work each request carries.","Run several Claude calls at the same time that each write a full candidate reply, then add one more call that picks the best reply to send.","Use one Claude call for screening, and produce the candidate replies from a fixed set of coded rules, since coded rules give more predictable text."],"ol":["A","B","C","D"],"why":"역할이 뚜렷이 다른 단계는 각각 별도의 호출로 분리하는 것이 좋습니다. 분류 단계와 작성 단계는 입력값, 출력 형식, 성공 기준이 서로 달라 각 목적에 집중한 프롬프트를 쓸 때 정확도와 신뢰도가 올라갑니다. 또한 오류가 어느 단계에서 났는지 추적하기 쉬워 디버깅과 유지보수에도 유리합니다.","domain":"Architecture / Task Decomposition","trap":"B (Cost-only consolidation): 비용만 근거로 한 호출에 묶으면 지시 이탈과 환각이 늘어 품질이 떨어집니다.\nC (Parallel sampling): 여러 개를 병렬 생성해 고르는 방식은 불필요한 비용과 레이턴시를 만듭니다.\nD (Rule-based substitution): 답변 초안 작성은 룰 기반보다 모델이 훨씬 뛰어난 영역입니다.\n→ 판단 기준: 입력·출력·성공 기준이 다른 단계를 분리해 각각 특화했는가.","memo":"단계마다 입출력과 성공 기준이 다를 때는 호출을 분리해 각각 특화한다."},{"src":"응용문제1","no":"11","q":"A teammate has asked how to extend Claude Code with a custom Skill that the team can invoke during sessions. The Skill consists of a set of instructions and a helper script the team wants Claude to be able to run when the Skill is loaded. Where is the right place to define the Skill?","opts":["Define the Skill in a Skills directory recognized by Claude Code, where Claude can discover and load it during sessions for the team's repositories.","Write the Skill as an ordinary module inside the service's own codebase and invoke it from application code rather than from a Claude Code session.","Paste the whole instruction text and the helper script into the CLAUDE.md file of every repository, so the content sits in the context of each session.","Store the Skill in a private folder on each engineer's laptop, and have the engineer load the files by hand before any session that needs it."],"ol":["A","B","C","D"],"why":"Claude Code는 규약된 스킬 디렉터리에 정의된 스킬을 세션 중 자동으로 인식하고 로드합니다. 지시문과 보조 스크립트를 저장소 안의 그 위치에 함께 두면, 팀 전체가 같은 스킬을 별도의 수동 조작 없이 탐색해 사용할 수 있습니다.","domain":"Claude Code / Skill Definition Location","trap":"B (Application library module): 일반 라이브러리 모듈은 대화형 세션에서 스킬로 호출되지 않습니다.\nC (Inline context file): CLAUDE.md는 프로젝트 컨텍스트·지시용이며 스크립트를 포함한 스킬의 표준 배치 위치가 아닙니다.\nD (Manual local loading): 개인 폴더에 두고 매번 수동 로드하면 팀 차원의 공유와 표준화가 무너집니다.\n→ 판단 기준: 자동으로 탐색되고 저장소로 공유되는 규약된 위치에 두었는가.","memo":"확장 기능을 팀이 함께 써야 할 때는 규약된 위치에 두어 자동 탐색되게 한다."},{"src":"응용문제1","no":"12","q":"You are designing an agent that processes warranty claim forms. The work involves a small number of well-understood steps, but occasionally a claim arrives in an unexpected layout that requires the system to decide between rerouting, requesting clarification, or flagging for human review. The most appropriate architecture for this system is...","opts":["a workflow for the standard path with an agent invoked at the decision point for unexpected layouts.","one very long prompt that must read any claim form it receives and finish the entire task in a single model call, whatever the layout turns out to be.","an agent given full freedom over every claim, including the routine ones, running each case from the first step to the last on its own.","a coordinator that splits the routine steps among many small subagents, and creates one more subagent for each unusual layout the system meets."],"ol":["A","B","C","D"],"why":"대부분이 예측 가능한 정형 작업이라면 그 경로는 코드 기반 워크플로우로 고정해 신뢰성을 높이고 비용과 레이턴시를 최적화합니다. 예외가 나타나는 분기점에서만 에이전트를 호출해 재라우팅·추가 확인·사람 검토 중 무엇을 할지 판단하게 하는 하이브리드 구성이 가장 적합합니다.","domain":"Agent Architecture / Workflow vs Agent","trap":"B (Monolithic single prompt): 한 번의 모델 호출에 모든 판단을 몰아넣으면 예외 상황에서 환각과 지시 누락이 생기기 쉽습니다.\nC (Full autonomy): 정형 작업까지 완전 자율 에이전트에 맡기면 비용·속도·예측 가능성이 모두 나빠집니다.\nD (Subagent over-engineering): 단계마다 서브에이전트를 두는 구조는 복잡도와 레이턴시만 키우는 과잉 설계입니다.\n→ 판단 기준: 정형 경로는 워크플로우로 두고 예외 분기점에만 에이전트를 붙였는가.","memo":"대부분 정형이고 일부만 예외일 때는 워크플로우에 필요한 지점만 에이전트를 붙인다."},{"src":"응용문제1","no":"13","q":"Your Claude application processes 80-page clinical research reports and produces summaries with citation references back to the source. The team is debating whether to send each report whole or split into smaller pieces. The reports fit within Claude's context window. Initial testing shows that whole-document processing produces summaries with stronger cross-section reasoning but occasionally drifts on citation accuracy in later sections. Chunked processing produces stronger citation accuracy per chunk but loses cross-section reasoning. The team has not decided which property matters more. How would you guide the team's decision?","opts":["Identify which property matters more for the application's actual use case and let that decision drive the chunking approach, then validate the choice against representative reports.","Study the whole-document option alone: collect the cases where its citations are wrong, then decide whether its accuracy is high enough across a sample of real reports.","Compare the cost and the response time of the two options against the service's performance targets, and base the recommendation on those numbers.","Take the citation scores from the chunked option alone and judge whether summaries built that way remain acceptable without reasoning across sections."],"ol":["A","B","C","D"],"why":"두 전략의 장점이 상충할 때는 실제 유스케이스에서 어떤 속성이 더 중요한지를 먼저 확정해야 합니다. 우선순위가 정해지면 그 기준에 따라 청킹 여부를 고르고, 대표 문서 데이터셋으로 실제 품질을 검증합니다. 우선순위 결정 없이 한쪽 대안만 평가하는 것은 순서가 잘못된 접근입니다.","domain":"Design Trade-offs / Requirement Prioritization","trap":"B (Whole-path-only assessment): 통짜 처리 한쪽만 평가하면 어떤 속성이 중요한지 정하는 단계가 빠집니다.\nC (Criteria substitution): 비용·레이턴시로 판단 축을 바꾸면 이 문제의 핵심 갈등을 다루지 못합니다.\nD (Chunked-path-only assessment): 청킹 결과만 검토하는 것 역시 우선순위 없이 한쪽만 보는 접근입니다.\n→ 판단 기준: 유스케이스 우선순위를 먼저 정하고 대표 데이터로 검증했는가.","memo":"장단점이 상충할 때는 유스케이스 우선순위를 먼저 정하고 대표 데이터로 검증한다."},{"src":"응용문제1","no":"14","q":"Your Claude application runs multi-stage compliance review workflows where each stage's output is needed only briefly before the agent moves on. The cumulative tool output is filling the context window with content that is no longer relevant. How would you handle the accumulating tool output?","opts":["Apply tool output pruning to remove tool outputs that are no longer needed by later stages in the review workflow.","Cache the earlier stage outputs so the application pays less for tokens it already sent, and leave all of that older content inside the context window.","Move the workflow to a smaller Claude model that reads context faster, and accept weaker review answers as the cost of the lower bill.","Store every stage output in the context until the whole review ends, so the agent always holds a complete record of what each stage returned."],"ol":["D","A","B","C"],"why":"이후 단계에서 다시 쓰이지 않는 중간 툴 출력은 보존하거나 비용만 낮추는 대상이 아니라 컨텍스트에서 제거해야 할 노이즈입니다. 가지치기로 불필요한 출력을 덜어내면 컨텍스트 윈도우가 깨끗해져 품질 저하를 막고 비용과 지연도 함께 줄어듭니다. 원인 자체를 없애는 선택이 정답입니다.","domain":"Context Management / Tool Output Pruning","trap":"A (Cost-only caching): 캐싱은 반복 비용만 낮출 뿐, 불필요한 내용이 컨텍스트를 채워 생기는 품질 저하는 그대로 남습니다.\nB (Model downgrade): 모델을 낮추는 것은 컨텍스트 누적이라는 원인을 건드리지 못하고 답변 품질만 떨어뜨립니다.\nC (Unbounded retention): 모든 출력을 끝까지 보존하면 노이즈가 계속 늘어 모델의 지시 수행력과 집중도가 나빠집니다.\n→ 판단 기준: 더 이상 참조되지 않는 내용을 컨텍스트에서 실제로 걷어냈는가.","memo":"더 이상 쓰이지 않는 중간 결과가 쌓일 때는 그 내용을 컨텍스트에서 덜어낸다."},{"src":"응용문제1","no":"15","q":"A new Claude model release includes performance improvements for several reasoning tasks but has changed the format of its responses to system prompts with multi-section instructions. Your Claude contract-summarization service uses multi-section system prompts heavily. Initial evaluation on the service's actual workload shows the new model performs 10 percent better on reasoning tasks but produces malformed output on roughly 4 percent of requests because of the format change. The team is debating whether to upgrade. How would you decide?","opts":["Adapt the service's system prompt to the new model's format expectations and re-evaluate, then upgrade only if the adapted prompt eliminates the malformed output while preserving the reasoning improvements.","Ship the new model right away, since a ten percent gain in reasoning is worth more than the small share of summaries that come back broken.","Remain on the current model for good, so the team never has to deal with broken summaries or with the format changes that arrive in later releases.","Move to the new model and place a checker after each call that repairs or blocks broken summaries, counting that checker as the fix for the format change."],"ol":["B","A","C","D"],"why":"새 모델이 기대하는 형식이 달라져 출력이 깨진 것이므로 원인은 프롬프트 쪽에 있습니다. 시스템 프롬프트를 새 형식에 맞게 조정한 뒤 실제 워크로드로 다시 평가해서 추론 이득은 남고 깨진 출력은 사라졌는지 확인한 다음 전환해야 합니다. 근본 수정 후 재검증이라는 순서가 핵심입니다.","domain":"Model Migration / Prompt Adaptation","trap":"A (Accept known defects): 깨진 출력을 아는 채로 바로 올리는 것은 사용자 경험과 서비스 안정성을 그대로 훼손합니다.\nC (Permanent version freeze): 구버전에 영구히 머무르면 개선된 추론 성능과 이후 기능 향상을 전혀 받지 못합니다.\nD (Downstream-only mitigation): 프롬프트를 고치지 않고 뒤에서 막기만 하는 것은 근본 원인을 남겨 불필요한 오류 처리 비용을 계속 발생시킵니다.\n→ 판단 기준: 달라진 형식 요구에 맞춰 프롬프트를 먼저 고치고 재평가한 뒤 전환했는가.","memo":"새 버전으로 옮길 때는 달라진 요구에 맞춰 프롬프트를 고친 뒤 다시 평가하고 전환한다."},{"src":"응용문제1","no":"16","q":"Your team is choosing between Claude models for a real-time customer support triage feature. The team has identified three relevant tradeoff dimensions: quality, latency, and cost. The right model is the one that...","opts":["fits the task's quality, latency, and cost requirements together, recognizing that improving one dimension typically affects the others.","passes the speed requirement first, after which the team reviews quality and cost to confirm the choice is acceptable on the two remaining dimensions.","reaches the required quality at a workable response time, leaving the cost question for a separate review once the first two bars are set.","lands inside the cost target and the agreed speed budget, with quality measured on a sample of real support tickets after the choice is final."],"ol":["C","A","B","D"],"why":"품질·레이턴시·비용은 서로 맞물려 있어 한 축을 개선하면 다른 축이 나빠집니다. 따라서 하나를 먼저 통과시키고 나머지를 나중에 확인하는 단계적 방식이 아니라, 세 요구를 동시에 만족하는 균형점을 찾는 모델을 골라야 합니다. 상호 영향에 대한 인정이 판단의 핵심입니다.","domain":"Model Selection / Quality-Latency-Cost Tradeoff","trap":"A (Latency-first sequencing): 속도를 먼저 통과시키고 나머지를 뒤에 보는 순차 필터링은 축들이 서로 맞물린다는 점을 무시합니다.\nB (Deferred cost review): 비용을 나중에 따로 검토하면 품질과 속도를 위해 이미 내린 선택을 되돌리기 어렵습니다.\nD (Post-selection quality check): 선택을 끝낸 뒤 품질을 확인하는 것은 절충이 아니라 사후 점검이라 균형점을 찾지 못합니다.\n→ 판단 기준: 세 축을 순서대로 거르지 않고 상호 영향을 인정하며 동시에 충족했는가.","memo":"서로 맞물린 기준으로 골라야 할 때는 순서대로 거르지 말고 함께 충족하는 균형점을 찾는다."},{"src":"응용문제1","no":"17","q":"Your Claude agent for an internal IT helpdesk has too many tools, and many of them have overlapping functionality. The agent often picks an inappropriate tool when several could plausibly handle a ticket. How would you address the tool selection problem?","opts":["Restructure the tool set by consolidating overlapping tools, removing unused tools, and clarifying tool descriptions so each tool has a distinct purpose.","Delete the whole tool set and let the agent answer from its own general knowledge, even though every helpdesk workflow that depended on those tools stops working.","Write several sample tickets into each tool description and let the agent match a new ticket to the closest sample, using that matching as the way it picks a tool.","Create extra tools for every ticket variation the helpdesk sees, on the idea that a longer list gives the agent a closer match for each case."],"ol":["A","B","C","D"],"why":"후보가 서로 겹쳐서 잘못된 선택이 생기는 문제이므로 설명을 덧붙이거나 수를 늘리는 방식으로는 해결되지 않습니다. 기능이 중복되는 툴을 하나로 통합하고 쓰이지 않는 툴은 제거한 뒤, 각 툴이 명확히 구분되는 단일 목적을 갖도록 설명을 다시 써야 합니다. 구조 자체를 정리하는 것이 정답입니다.","domain":"Tool Design / Tool Set Consolidation","trap":"B (Total capability removal): 툴을 전부 없애면 외부 시스템 연동과 실제 처리 작업 자체가 불가능해집니다.\nC (Description-only patch): 설명에 예시만 덧붙이는 것은 툴이 서로 겹치는 구조적 모호함을 그대로 남깁니다.\nD (Option proliferation): 툴 수를 늘리면 후보가 더 많아져 잘못된 선택이 오히려 더 자주 일어납니다.\n→ 판단 기준: 모호함의 원인인 툴 구조를 통합·정리해 각각 뚜렷한 단일 목적을 갖게 했는가.","memo":"선택지가 겹쳐 혼동이 생길 때는 중복을 합치고 각각의 역할을 뚜렷하게 구분한다."},{"src":"응용문제1","no":"18","q":"You are reviewing an architectural diagram for a Claude-powered insurance claims system. The diagram shows a top-level component that interprets incoming claims and three subordinate components that handle policy lookup, damage assessment, and payout calculation. The top-level component is responsible for routing each claim, sequencing the subordinate components, and reconciling their outputs into a final claim decision. The diagram also shows that each subordinate component has its own tool list and own short conversation history that is not shared with the others. Which architectural pattern does the diagram most closely describe?","opts":["A manager and supervisor pattern with isolated context per subagent, where the top-level agent coordinates specialized subagents that each maintain their own conversation history and tool list.","A retrieval-augmented pattern, in which the coordinator searches indexed document stores owned by the lower components and uses the matching records to write every claim decision.","A manager and supervisor pattern built on one shared history, in which the coordinator and all lower components read and write the same growing transcript as the claim moves through.","A pipeline pattern, in which each component takes the claim in turn and hands the whole transcript, along with the claim, to the component that follows it."],"ol":["B","A","C","D"],"why":"상위 구성요소가 요청을 라우팅하고 순서를 정하며 결과를 종합한다는 점에서 조정자가 존재합니다. 여기에 하위 구성요소들이 각자 고유한 툴 목록과 공유되지 않는 개별 이력을 갖는다는 단서가 더해지면 컨텍스트가 격리된 매니저·수퍼바이저 패턴으로 판정합니다. 두 단서를 함께 읽는 것이 핵심입니다.","domain":"Agent Architecture / Multi-Agent Patterns","trap":"A (Retrieval-based pattern): 검색으로 근거를 모으는 구조가 아니라 조정자가 하위 단위를 지휘하는 구조이므로 맞지 않습니다.\nC (Shared context variant): 다이어그램은 이력이 공유되지 않는다고 명시하므로 공유 컨텍스트 변형과는 반대입니다.\nD (Sequential pipeline): 파이프라인은 조정자 없이 순서대로 넘기며 이력을 함께 전달하지만 여기에는 상위 조정자가 있습니다.\n→ 판단 기준: 상위 조정자가 있는가, 그리고 하위 단위의 도구와 이력이 격리되어 있는가.","memo":"조정자가 있고 하위 단위가 각자 도구와 이력을 따로 가질 때는 컨텍스트가 격리된 관리자 구조로 판단한다."},{"src":"응용문제1","no":"19","q":"Your enterprise has a contract with Google Cloud that requires Claude API calls to flow through Vertex AI rather than the direct Anthropic API. Your team is building a new Claude application and is unfamiliar with this constraint. How would you build the application?","opts":["Configure the application to invoke Claude through the Vertex AI-compatible API path while keeping the application's logic provider-agnostic.","Start on the direct Anthropic API today and plan a later release that moves the calls over to Vertex AI once the team knows that platform better.","Maintain two separate code paths for each call, one aimed at the direct Anthropic API and one at Vertex AI, and select the quicker path while the application runs.","Use the direct Anthropic API for the whole application and set aside the contract term that says Claude traffic must pass through Vertex AI."],"ol":["D","A","B","C"],"why":"계약이 호출 경로를 강제하므로 처음부터 Vertex AI 규격의 엔드포인트로 호출하도록 구성해야 합니다. 동시에 프롬프트 처리와 비즈니스 로직은 특정 제공자에 묶이지 않게 분리해 두어야 이후 이식성도 확보됩니다. 준수와 이식성을 함께 만족시키는 선택이 정답입니다.","domain":"Deployment / Provider Routing Constraints","trap":"A (Deferred migration): 나중에 옮기겠다는 계획은 그때까지 계약 위반 상태를 유지하고 재작업 비용만 키웁니다.\nB (Parallel dual implementation): 모든 호출을 두 벌로 유지하는 것은 복잡도와 관리 부담만 늘리는 과설계입니다.\nC (Requirement violation): 계약상 요구된 호출 경로를 무시하는 것은 거버넌스 위반이라 선택지가 될 수 없습니다.\n→ 판단 기준: 규정된 호출 경로를 처음부터 지키면서 핵심 로직은 제공자에 종속되지 않게 분리했는가.","memo":"호출 경로가 규정으로 정해져 있을 때는 처음부터 그 경로로 구성하고 로직은 종속되지 않게 분리한다."},{"src":"응용문제1","no":"20","q":"You are writing a system prompt for a Claude application that extracts shipment details and must return output in a specific JSON shape. The downstream warehouse system will reject any output that does not match the schema. Your prompt would need to...","opts":["include explicit constraints describing the required JSON schema and an instruction to produce only output matching that schema.","tell Claude to answer with JSON for some shipments and with plain sentences for others, so both kinds of output reach the warehouse system.","say nothing about the output shape and depend on a later cleanup step in the application to turn Claude's text into the required record.","let Claude pick whatever output shape looks best for each shipment request the application sends."],"ol":["D","A","B","C"],"why":"하위 시스템이 정해진 스키마만 받아들이므로 필요한 JSON 구조를 시스템 프롬프트 안에 명시적 제약으로 기술해야 합니다. 그리고 그 스키마에 맞는 출력만 내라고 지시해 서문이나 자유 텍스트가 섞이지 않도록 통제해야 합니다. 형식 강제를 프롬프트 단계에서 끝내는 것이 핵심입니다.","domain":"Structured Output / Schema Constraints","trap":"A (Mixed output formats): 형식을 섞어 내보내면 스키마만 받는 하위 시스템에서 곧바로 거부와 오류가 납니다.\nB (Post-processing reliance): 형식을 말하지 않고 후처리로만 맞추면 정보 손실과 잘못된 변환 위험이 커집니다.\nC (Model-chosen format): 형식 선택을 모델 재량에 맡기면 엄격한 스키마 요구를 일관되게 충족할 수 없습니다.\n→ 판단 기준: 요구 형식을 프롬프트에 명시적 제약으로 적고 그 형식만 내도록 강제했는가.","memo":"출력 형식이 엄격히 정해져 있을 때는 그 구조를 프롬프트에 명시하고 해당 형식만 내도록 강제한다."},{"src":"응용문제1","no":"21","q":"You are building a new Claude application for support-ticket categorization and have a small set of well-labeled examples that demonstrate the desired output format. You want to use these examples to guide Claude's behavior. How would you guide the application's behavior?","opts":["Use multi-shot prompting by including the labeled examples in the prompt so Claude can match the desired output format on each request.","Send every ticket with no examples at all and trust the model's general skill to return the same output format each time.","Fine-tune a private model on the small labeled set before launch, so the running application never has to place any example inside a prompt.","Save the examples in a shared document and open them at run time as reading material for the engineers on the team."],"ol":["A","B","C","D"],"why":"원하는 출력 형식을 보여주는 잘 정리된 예시가 있다면 그 예시를 요청마다 프롬프트에 함께 넣는 멀티샷 방식이 가장 직접적입니다. 모델은 입력과 출력 쌍을 보고 형식을 그대로 맞추게 되어 일관성이 크게 올라갑니다. 예시를 생성 시점에 사용했는지가 판단 기준입니다.","domain":"Prompt Engineering / Few-Shot Examples","trap":"B (Zero-shot reliance): 예시 없이 제로샷으로 두면 지정된 출력 형식을 일관되게 맞추기 어렵습니다.\nC (Custom model training): 소수 예시로 파인튜닝을 하는 것은 과설계이며 퓨샷 프롬프팅이 훨씬 효율적입니다.\nD (Offline reference storage): 사람만 참고하는 자료로 보관하면 모델의 생성 행동을 전혀 유도하지 못합니다.\n→ 판단 기준: 예시를 실제 생성 시점의 프롬프트 안에 포함해 형식을 따라 하게 했는가.","memo":"원하는 형태의 예시가 있을 때는 그 예시를 프롬프트에 직접 포함해 따라 하게 한다."},{"src":"응용문제1","no":"22","q":"You are setting up a Claude research assistant that will run a mix of long multi-turn conversations and one-off questions. You want to use caching techniques to reduce your costs where they apply. A teammate suggests caching the model's answers as well, so the assistant does not have to make duplicate Claude calls when similar questions arrive. You would apply prompt caching to...","opts":["the static portions of prompts that are repeated across requests, such as system prompts, instructions, or shared context.","no part of the traffic, since caching saves nothing once one deployment mixes long conversations with single questions.","the answers the model returns, keeping each response for reuse whenever a later question looks close enough to an earlier one.","just the question text typed by each user, because that part of the prompt changes more than anything else the assistant sends."],"ol":["A","B","C","D"],"why":"프롬프트 캐싱은 입력 중에서 요청마다 동일하게 반복되는 정적 영역에 적용됩니다. 시스템 프롬프트, 공통 지시문, 공유 문서나 예시처럼 변하지 않는 구간을 캐싱하면 입력 토큰 비용과 레이턴시를 크게 줄일 수 있습니다. 무엇이 대상이고 무엇이 아닌지를 구분하는 것이 핵심입니다.","domain":"Cost Optimization / Prompt Caching","trap":"B (Blanket inapplicability): 요청 형태가 섞여 있어도 반복되는 정적 구간이 있으면 캐싱 효과는 분명히 있습니다.\nC (Output caching): 모델이 생성한 출력은 프롬프트 캐싱의 대상이 아니며 이는 별개의 응답 재사용 문제입니다.\nD (Dynamic input caching): 매번 달라지는 사용자 입력은 캐시 적중이 없어 이득 대신 캐시 미스만 늘립니다.\n→ 판단 기준: 요청마다 똑같이 되풀이되는 입력의 정적 구간을 캐싱 대상으로 잡았는가.","memo":"반복 비용을 줄여야 할 때는 요청마다 똑같이 되풀이되는 정적 입력 구간을 캐싱한다."},{"src":"응용문제1","no":"23","q":"You are setting up a CI/CD pipeline for a new Claude-powered document search service. The pipeline needs to run automated checks on every pull request before code can be merged. The CI/CD checks would include...","opts":["automated tests of the Claude integration, linting, and any other standard quality gates the team applies to its other services.","only style and security scans inside the pipeline, leaving a named engineer to test the Claude integration by hand shortly before each release.","automated tests for the Claude integration and nothing more, since each developer can run style checks on their own machine before pushing code.","a complete release to the live production environment for every pull request, so that any possible problem appears before the code is merged."],"ol":["B","A","C","D"],"why":"병합 전 자동 검사에는 Claude 연동에 대한 자동화 테스트뿐 아니라 린팅과 보안 스캔처럼 팀이 다른 서비스에 이미 적용하는 표준 품질 게이트가 함께 들어가야 합니다. 일부를 수동이나 로컬로 미루면 검증이 새고, 반대로 매 PR마다 전체 배포하는 것은 과합니다. 자동화 범위를 빠짐없이 갖추는 것이 기준입니다.","domain":"CI/CD / Automated Quality Gates","trap":"A (Manual verification step): 연동 테스트를 사람이 손으로 돌리면 자동화 원칙에 어긋나고 검증 누락이 생깁니다.\nC (Local-only linting): 린팅을 개발자 로컬에만 맡기면 스타일이 파편화되고 병합 전 검증이 빠집니다.\nD (Full deployment per change): PR마다 실제 운영 환경에 전체 배포하는 것은 위험하고 비효율적인 과잉 대응입니다.\n→ 판단 기준: 새 연동 자동 테스트와 팀의 기존 표준 품질 게이트를 모두 파이프라인에 넣었는가.","memo":"병합 전 검증을 자동화할 때는 새 연동 테스트와 기존 표준 품질 검사를 모두 포함한다."},{"src":"응용문제1","no":"24","q":"You are building a Claude application that processes 40,000 product review submissions overnight to extract structured ratings. The work is non-interactive, runs once each night, and has a flexible completion window of several hours. Which Claude API would you use?","opts":["The batch API, which is designed for non-interactive workloads with flexible completion windows.","Send every review through the realtime Messages API at once with many parallel workers, so the whole nightly job finishes in the shortest possible time.","Open a streaming connection for each review and write the partial text into the ratings table piece by piece while the model is still producing it.","Call the realtime Messages API once per review and wait for each answer before starting the next one, so the stored ratings keep a fixed order."],"ol":["A","B","C","D"],"why":"이 작업은 사용자가 화면 앞에서 결과를 기다리는 대화형 요청이 아니고, 밤사이 몇 시간 안에만 끝나면 되는 대량 처리입니다. 이런 워크로드는 즉시 응답을 포기하는 대신 동시성·레이트 리밋 부담 없이 대량 요청을 처리하고 비용도 크게 낮출 수 있는 배치 방식이 정확히 들어맞습니다. 속도를 어떻게 높일지가 아니라 워크로드 성격에 맞는 API 형태를 고르는 것이 핵심입니다.","domain":"Claude API / Batch Processing","trap":"B (Realtime concurrency): 실시간 API를 병렬로 몰아치는 방식은 속도만 볼 뿐, 즉시 응답이 필요 없는 작업에 레이트 리밋 부담과 비용만 키웁니다.\nC (Streaming delivery): 스트리밍은 생성 과정을 사용자에게 실시간으로 보여줄 때 쓰는 방식이라 야간 일괄 추출 작업에는 불필요합니다.\nD (Sequential realtime): 한 건씩 순차 호출하면 순서만 지켜질 뿐 4만 건 처리에 지나치게 느리고 배치의 비용 이점도 얻지 못합니다.\n→ 판단 기준: 즉시 응답이 필요 없고 완료 기한에 여유가 있는 비대화형 대량 작업인가.","memo":"즉시 응답이 필요 없는 대량 비대화형 작업에는 배치 처리 방식을 사용한다."},{"src":"응용문제1","no":"25","q":"Your team is debating how to manage the system prompts used in your Claude support assistant. Some prompts are checked into the code repository, some live in a shared settings file, and some are built inline at request time. The result is inconsistent, and last week a prompt change reached production without code review. What steps would you take?","opts":["Establish a single source of truth for prompts, version-control them alongside code, and require code review for prompt changes.","Build every prompt inline at request time so anyone can change the wording quickly through a light path that sits outside the normal code review workflow.","Keep the prompts in a shared online document outside the repository, where any team member may edit the text freely as the assistant changes over time.","Create one shared prompt location, but leave peer review as a choice, so developers may push prompt edits straight to production whenever a change is urgent."],"ol":["C","A","B","D"],"why":"프롬프트는 모델의 동작과 출력을 좌우하는 자산이므로 일반 소스 코드와 같은 수준으로 다뤄야 합니다. 흩어진 위치를 하나로 모아 단일 진실 공급원을 만들고, 코드와 함께 버전 관리하며, 변경 시 코드 리뷰를 필수로 두어야 합니다. 이렇게 해야 파편화와 무검토 배포라는 두 문제가 동시에 해결됩니다.","domain":"Prompt Management / Versioning","trap":"A (Inline runtime construction): 런타임 인라인 구성에 리뷰까지 우회하면 파편화와 검증 부족이 오히려 심해집니다.\nB (Unversioned external store): 저장소 밖 문서로 빼면 변경 이력과 추적성이 사라져 어떤 문구가 언제 바뀌었는지 확인할 수 없습니다.\nD (Optional review): 리뷰를 선택 사항으로 남기면 검토 없이 프로덕션에 반영되는 기존 문제가 그대로 남습니다.\n→ 판단 기준: 단일화·버전 관리·필수 리뷰 세 가지를 모두 갖춰 파편화와 무검토 배포를 함께 막았는가.","memo":"산출물이 시스템 동작을 좌우할 때는 코드와 동일한 단일화·버전 관리·필수 리뷰 절차를 사용한다."},{"src":"응용문제1","no":"26","q":"Your Claude application is hitting context window limits when processing long legal contract documents. A new team member suggests raising the temperature parameter to fix the issue. How would you respond?","opts":["Explain that temperature controls sampling randomness and is unrelated to context capacity, then address the context issue through summarization or chunking.","Raise the temperature value as the new team member proposed, then watch the next several production runs to see whether the context limit errors stop appearing.","Delete the system prompt from every request so the freed space can hold more contract text, since the system prompt also takes up part of the context window.","Change temperature and max_tokens together and treat that pair of settings as the team's way to control context pressure while long contracts are processed."],"ol":["B","A","C","D"],"why":"temperature는 토큰 샘플링의 무작위성을 조절하는 값일 뿐 입력이 담기는 용량과는 아무 관련이 없습니다. 문제의 원인이 입력 길이 초과이므로 긴 계약서를 요약해 핵심만 넣거나 적절한 크기로 분할해 처리하는 방식으로 대응해야 합니다. 증상에 아무 설정값이나 돌리지 않고 원인과 수단을 정확히 맞추는 것이 핵심입니다.","domain":"Context Management / Parameter Semantics","trap":"A (Irrelevant parameter tuning): 원인과 무관한 값을 올려 두고 지켜보는 것은 문제 해결이 아니라 시간만 버리는 방식입니다.\nC (Remove system prompt): 시스템 프롬프트를 없애면 자리는 조금 생기지만 역할 정의와 지시 수행 능력을 잃습니다.\nD (Combined parameter tuning): max_tokens는 출력 길이 상한일 뿐이라 두 값을 같이 만져도 입력 용량 한계는 그대로입니다.\n→ 판단 기준: 설정값이 실제로 제어하는 대상과 문제의 원인을 정확히 연결했는가.","memo":"문제를 해결해야 할 때는 원인과 무관한 설정값 조정 대신 원인에 직접 대응하는 기법을 사용한다."},{"src":"응용문제1","no":"27","q":"You are building an agent that needs to call several internal microservices and a data warehouse in a structured, repeatable way. Your team has decided to use the Claude Agent SDK rather than build a custom loop. You are setting up the agent's tool definitions and execution loop. How would you set up the tools and execution loop?","opts":["Use the SDK's tool interface and let the SDK handle the loop, dispatch, and history.","Define the tools through the SDK and run its loop, but save all conversation turns in a separate table the team maintains outside the SDK.","Keep only the SDK tool format, and have the team code its own turn loop and its own message history layer from scratch.","Skip the SDK, send requests straight to the Messages API, and ask the model to write its tool calls as plain text that the team parses."],"ol":["C","A","B","D"],"why":"Agent SDK를 도입하는 이유 자체가 실행 루프, 툴 디스패치, 대화 이력 관리를 SDK가 대신 처리하도록 맡기기 위해서입니다. 개발자는 SDK가 정한 툴 인터페이스 규격에 맞춰 툴만 정의하고, 나머지 오케스트레이션 흐름은 SDK 내장 메커니즘에 위임해야 합니다. 이미 추상화된 부분을 다시 구현하지 않는 것이 핵심입니다.","domain":"Agent SDK / Orchestration Delegation","trap":"A (External history store): 이력만 밖으로 빼면 SDK가 관리하는 상태와 어긋나 동기화 부담과 버그가 생깁니다.\nB (Custom orchestration rebuild): 루프와 이력을 직접 짜면 SDK를 쓰는 의미가 사라지고 유지보수 비용만 늘어납니다.\nD (Plain-text tool calls): 평문으로 툴 호출을 주고받는 것은 구조화된 Tool Use 규격을 버리는 방식이라 파싱 오류에 취약합니다.\n→ 판단 기준: 프레임워크가 이미 제공하는 오케스트레이션을 중복 구현하지 않고 위임했는가.","memo":"프레임워크를 도입했을 때는 직접 구현 대신 프레임워크가 제공하는 내장 메커니즘을 사용한다."},{"src":"응용문제1","no":"28","q":"Your team is choosing how to give a Claude application access to an internal reporting system. You want to apply the appropriate option, whether built-in tool, custom tool, Skill, or MCP server, based on the use case. You would choose the option that...","opts":["matches the use case's scope, reuse needs, and integration context.","was released most recently out of built-in tools, custom tools, Skills, and MCP servers.","takes the least effort to build with the libraries and pipelines the team already runs.","the team already knows best, based on earlier projects that needed similar functionality."],"ol":["C","A","B","D"],"why":"각 구현 수단은 저마다 맞는 영역이 있으므로 작업 범위, 재사용 요구, 연동 맥락이라는 유스케이스 요구사항을 기준으로 골라야 합니다. 단일 앱 내부 로직이면 커스텀 툴, 반복 워크플로우 확장이면 Skill, 여러 클라이언트가 공유할 표준 연동이면 MCP 서버가 적합합니다. 선택의 근거가 개발자 편의가 아니라 요구사항이어야 한다는 점이 핵심입니다.","domain":"Extensibility / Capability Selection","trap":"A (Newest option bias): 최신이라는 이유만으로 고르면 요구사항과 맞지 않는 아키텍처가 남습니다.\nB (Ease of implementation): 구현이 쉬운 쪽을 택하는 것은 개발 편의일 뿐 재사용이나 연동 요구를 반영하지 못합니다.\nD (Team familiarity): 익숙함을 기준으로 삼으면 유스케이스가 달라져도 늘 같은 수단만 쓰게 됩니다.\n→ 판단 기준: 선택의 근거가 개발자 편의가 아니라 범위·재사용·연동 맥락이라는 요구사항인가.","memo":"구현 방식을 선택해야 할 때는 편의나 선호가 아니라 유스케이스 요구사항을 기준으로 사용한다."},{"src":"응용문제1","no":"29","q":"Your Claude application's API keys are stored in a cloud vault. The team is debating whether the same key should be used in the sandbox, QA, and production environments. How would you handle the keys across environments?","opts":["Use distinct keys for each environment so a compromise in one environment does not affect the others during normal operation across the application's lifecycle.","Share one key across sandbox, QA, and production because it is simpler, and accept that a leak in any one place would then reach all three at once.","Keep one shared key but replace it at random times, on the view that frequent replacement alone gives each environment enough separation.","Put the sandbox key in all three environments, on the view that production keys are too sensitive to deploy anywhere during regular operation."],"ol":["C","A","B","D"],"why":"환경마다 독립된 별도의 키를 발급해 두면 샌드박스나 QA에서 키가 유출되어도 그 영향이 운영 환경까지 번지지 않습니다. 격리는 로테이션 주기나 편의성이 아니라 자격 증명을 실제로 분리하는 것에서 만들어집니다. 사고의 폭발 반경을 환경 단위로 가두는 것이 핵심입니다.","domain":"Security / Credential Isolation","trap":"A (Shared key convenience): 편의를 위해 키 하나를 공유하면 한 곳의 유출이 곧 전 환경 유출이 됩니다.\nB (Rotation without separation): 키를 자주 바꿔도 하나를 공유하는 한 환경 간 격리 효과는 전혀 생기지 않습니다.\nD (Dev key everywhere): 개발용 키를 운영까지 쓰면 환경 독립성이 사라지고 노출 범위만 넓어집니다.\n→ 판단 기준: 환경마다 분리된 자격 증명으로 유출의 영향 범위를 가두었는가.","memo":"여러 환경을 운영해야 할 때는 환경마다 분리된 별도의 자격 증명을 사용한다."},{"src":"응용문제1","no":"30","q":"A new engineer has asked you to explain why your Claude agent's inventory tools include detailed descriptions in the tool definition, even when the tool name is already descriptive. The engineer suggests removing the descriptions to simplify the tool definitions. How would you respond?","opts":["Explain that the model uses the tool description to decide when to call the tool, and descriptions disambiguate cases where the tool name is not enough.","Accept the suggestion, since a clear tool name by itself lets the model pick the correct inventory tool for every request the agent receives.","Move the description text into a wiki page the team keeps updated, so the definitions stay short while the details are still written down somewhere.","Replace each description with a few sample calls inside the definition and treat those samples as a full replacement for the written explanation."],"ol":["D","A","B","C"],"why":"모델은 정의에 담겨 실제로 전달되는 description 텍스트를 근거로 언제 그 툴을 부를지와 인자를 어떻게 채울지를 판단합니다. 이름이 아무리 잘 붙어 있어도 비슷한 재고 툴이 여럿일 때의 모호함은 서술형 설명으로만 걷어낼 수 있습니다. 판단 근거가 모델에게 전달되는 정의 안에 남아 있어야 한다는 점이 핵심입니다.","domain":"Tool Use / Tool Definition Design","trap":"A (Name-only sufficiency): 이름만으로는 호출 시점과 파라미터 조건까지 정확히 전달되지 않습니다.\nB (External documentation): 위키로 옮기면 모델에게 가는 스키마에서 설명이 빠져 툴의 용도를 알 수 없게 됩니다.\nC (Examples as substitute): 예시 호출은 도움이 되지만 언제 써야 하는지를 설명하는 줄글을 완전히 대체하지 못합니다.\n→ 판단 기준: 모델의 판단 근거가 실제로 전달되는 툴 정의 안에 남아 있는가.","memo":"모델이 스스로 판단하게 하려면 판단 근거를 모델에게 실제로 전달되는 정의 안에 담아 사용한다."},{"src":"응용문제1","no":"31","q":"A security lead is reviewing the team's threat model for a Claude document assistant and has asked you to identify the categories of AI-specific threats that the model should cover. The security lead has already listed traditional web application threats and wants to know what additional categories apply to a Claude application. Which AI-specific threat categories would you add?","opts":["Prompt injection, data leakage from prompts or context, jailbreak attempts, and unsafe model output that bypasses application controls.","Only supply chain attacks on the Claude SDK package, treating that one library as the single new weak point a Claude application adds beyond the usual web threats.","Denial of service traffic floods and physical damage to data center hardware, on the view that these reach any Claude deployment in production more often than anything else.","Cross-site scripting and SQL injection, on the view that these familiar web risks carry the same weight for every application that calls Claude."],"ol":["D","A","B","C"],"why":"기존 웹 위협 목록에 더해야 할 것은 모델과 프롬프트 계층에서 새로 생기는 공격 표면입니다. 입력이나 외부 문서를 통한 프롬프트 주입, 시스템 프롬프트와 컨텍스트의 민감 정보 유출, 안전 장치를 무력화하려는 탈옥 시도, 통제를 우회해 하위 시스템으로 흘러가는 안전하지 않은 출력이 그 범주입니다. AI 도입으로 새로 생긴 위협만 골라내는 것이 핵심입니다.","domain":"Security / AI Threat Modeling","trap":"A (Single narrow vector): SDK 공급망 하나로 좁히면 프롬프트·모델 계층의 위험을 전혀 담지 못합니다.\nB (Infrastructure-layer threats): DoS와 물리 인프라 공격은 AI 특화가 아니라 일반 웹·클라우드 인프라 위협입니다.\nC (Traditional web threats): XSS와 SQL 인젝션은 이미 정리해 둔 기존 웹 위협 목록에 들어 있는 항목입니다.\n→ 판단 기준: 기존 목록의 재열거가 아니라 AI 도입으로 새로 생긴 고유 위협 범주를 골랐는가.","memo":"위협을 정리해야 할 때는 기존 목록의 재열거가 아니라 그 기술이 새로 만들어 낸 고유 위협 범주를 사용한다."},{"src":"응용문제1","no":"32","q":"Your team uses several plugins across two Claude Code projects, and a recent plugin update introduced a regression. The team had not been tracking plugin versions, so the team cannot easily identify which version was previously working. How would you address this?","opts":["Add explicit plugin version tracking to the project's configuration so the team can identify, pin, and upgrade plugin versions deliberately.","Leave the plugins as outside code with no version records, and wait for each plugin author to announce breaking changes as they arrive.","Drop every plugin and have the team write the same features directly into the application, treating removal as the way to end version problems.","Move all plugins to the newest release on a fixed schedule so versions never fall far behind, since large gaps make broken behavior more likely."],"ol":["A","B","C","D"],"why":"문제의 근본 원인은 플러그인 버전이 어디에도 기록되어 있지 않다는 점입니다. 설정 파일에 버전을 명시적으로 적고 안정 버전으로 고정해 두면 정상 동작하던 버전을 바로 찾아 되돌릴 수 있고, 업그레이드도 의도적으로 진행할 수 있습니다. 추적 불가라는 원인을 없애는 선택지가 정답입니다.","domain":"Dependency Management / Version Pinning","trap":"B (Untracked dependencies): 버전을 기록하지 않고 작성자 공지에만 기대는 것은 의존성 관리의 기본을 포기하는 방식입니다.\nC (Total avoidance): 플러그인을 전부 걷어내고 직접 만드는 것은 과도한 회피이며 개발 비용만 커집니다.\nD (Blind latest upgrade): 검증 없이 최신으로만 올리면 이번 같은 회귀 오류에 계속 노출됩니다.\n→ 판단 기준: 버전을 명시적으로 기록·고정해 이전 정상 버전을 식별하고 되돌릴 수 있게 했는가.","memo":"외부 구성요소에 의존할 때는 버전을 명시적으로 기록·고정하고 의도적인 업그레이드 절차를 사용한다."},{"src":"응용문제1","no":"33","q":"You are designing a Claude application that summarizes messages written by patients. Some of that text could include sensitive information such as insurance numbers or home addresses that the application should not send to Claude. How would you design the application?","opts":["Define the application boundary explicitly, identify what content can leave the boundary for Claude, and add filtering or redaction at the boundary.","Filter only the sensitive patterns that appear most often today, then widen the rule set later as production monitoring reveals other formats.","Write a line in the system prompt that lists the sensitive categories Claude must ignore while it reads the patient messages.","Store every patient message in a log before the request goes out, and read through those logs on a schedule to see whether sensitive details reached the model."],"ol":["D","A","B","C"],"why":"민감 정보는 외부 모델 API로 나가기 전에 막아야 하므로 애플리케이션 경계를 명확히 정의하는 일이 먼저입니다. 그 경계에서 어떤 내용이 밖으로 나갈 수 있는지 식별하고, 나가기 직전에 필터링이나 비식별화를 적용해야 합니다. 사후 점검이나 모델에 대한 지시가 아니라 전송 이전 차단이라는 점이 핵심입니다.","domain":"Security / Data Boundary Control","trap":"A (Partial pattern coverage): 자주 보이는 패턴만 먼저 막는 미봉책은 초기 유출을 그대로 허용합니다.\nB (Prompt-only instruction): 무시하라는 지시는 이미 데이터가 전송된 뒤의 이야기라 유출 자체를 막지 못합니다.\nC (Post-hoc logging review): 사후 로그 검토는 예방이 아니고, 오히려 로그에 민감 정보를 쌓는 허점을 만듭니다.\n→ 판단 기준: 민감 정보가 외부로 나가기 전 경계 지점에서 차단되도록 설계했는가.","memo":"민감한 데이터를 다뤄야 할 때는 외부로 나가기 전 경계 지점에서의 사전 차단을 사용한다."},{"src":"응용문제1","no":"34","q":"Your Claude application produces structured output that is consumed by a downstream inventory reporting service. The team wants to handle malformed or unexpected output gracefully so it does not crash downstream systems. The best choice for handling this issue would be to...","opts":["apply defensive parsing to handle unexpected fields, missing values, and type mismatches that the reporting service might otherwise crash on.","delete each response that fails the shape check and keep no record of it, so the reporting service is never given the bad data.","stop the whole process whenever an unexpected field arrives and wait for an engineer to fix the failed request by hand.","send the model output onward as it is and postpone all schema checks until a later release of the reporting service."],"ol":["A","B","C","D"],"why":"모델 응답은 언제든 예상 밖의 필드나 빠진 값, 다른 타입으로 들어올 수 있으므로 파싱 단계에서 이를 흡수하는 방어적 파싱을 구현해야 합니다. 기본값 설정과 타입 검증을 파싱 코드에 넣어 두면 응답에 일부 이상이 생겨도 재고 리포팅 서비스가 멈추지 않습니다. 이것이 '우아한 처리'라는 요구를 충족하는 유일한 방식입니다.","domain":"Error Handling / Output Parsing Robustness","trap":"B (Silent drop): 기록 없이 조용히 버리면 데이터가 유실되고 원인 추적도 불가능해집니다.\nC (Crash and manual recovery): 이상이 생길 때마다 중단시키고 사람 손을 기다리는 것은 운영 안정성을 해칩니다.\nD (Deferred enforcement): 스키마 검증을 나중 릴리스로 미루는 것은 결함을 프로덕션에 방치하는 선택입니다.\n→ 판단 기준: 예상 밖 출력을 파싱 단계에서 흡수해 하위 시스템이 죽지 않게 설계했는가.","memo":"예상 밖의 출력이 들어올 수 있을 때는 방어적 파싱으로 우아하게 처리한다."},{"src":"응용문제1","no":"35","q":"A travel booking company has deployed a multi-agent system in which a primary agent decomposes traveler requests and delegates subtasks to three specialized subagents: one for flight search, one for price comparison, and one for itinerary drafting. In production, the team observes that subagents are making redundant tool calls, occasionally exceeding token budgets, and sometimes producing outputs that contradict each other — all of which the primary agent passes along without verification. What is the most appropriate way to address these failures?","opts":["Strengthen the primary agent's management layer to enforce per-subagent tool budgets, validate outputs against a defined schema before passing them forward, and establish explicit handoff contracts between stages.","Configure every subagent to retry a failed tool call on its own before raising it, and write all calls and outputs to one shared trace the team can review later for duplicates and conflicts.","Let every subagent read what the other subagents produced, so conflicting results are settled directly between them instead of returning to the primary agent.","Merge the three subagents into one model call with a large context window that performs search, comparison, and drafting together."],"ol":["D","A","B","C"],"why":"중복 호출과 예산 초과, 모순 출력은 모두 런타임에 통제해야 하는 문제이므로 상위 관리 계층인 프라이머리 에이전트를 강화해야 합니다. 서브에이전트별 툴 예산을 강제하고 단계 간 인계 규격을 명시한 뒤, 다음 단계로 넘기기 전에 스키마 검증을 거치면 모순된 정보의 전파가 차단됩니다. 이것이 매니저 패턴 거버넌스의 핵심입니다.","domain":"Multi-Agent Architecture / Orchestrator Governance","trap":"A (Post-hoc audit and retry): 재시도와 사후 로그 검토는 실행 중 발생하는 중복·초과·모순을 실시간으로 막지 못합니다.\nB (Peer-to-peer bypass): 서브에이전트끼리 직접 참조하게 하면 매니저 거버넌스가 무너지고 컨텍스트 오염이 커집니다.\nC (Architecture collapse): 단일 호출로 합치는 것은 멀티 에이전트 모듈화의 이점을 통째로 버리는 접근입니다.\n→ 판단 기준: 상위 관리 계층이 예산·인계 규격·전달 전 검증을 런타임에 강제하는가.","memo":"여러 하위 실행 단위를 조율해야 할 때는 상위 관리 계층에서 예산과 인계 규격을 강제하고 넘기기 전에 검증한다."},{"src":"응용문제1","no":"36","q":"You are building a Claude tutoring application that needs to deliver model output to learners as it is generated, instead of waiting for the full response to complete. The Claude API mechanism you would use is...","opts":["streaming responses, which deliver tokens incrementally as the model generates them so learners see output progressively.","structured JSON output, which returns the answer only after the whole JSON shape is finished, so nothing reaches the learner before that point.","the batch API, which returns completed answers later and suits large jobs that no learner is waiting on.","prompt caching, which lowers the cost of repeated prompt prefixes and does not change when output text reaches the learner."],"ol":["A","B","C","D"],"why":"스트리밍은 모델이 토큰을 만들어 내는 즉시 서버 전송 이벤트로 클라이언트에 증분 전달합니다. 덕분에 학습자는 전체 응답이 끝나기를 기다리지 않고 답변이 쓰이는 과정을 그대로 보게 됩니다. 대화형 앱의 체감 대기 시간을 줄이는 표준 방식입니다.","domain":"Claude API / Streaming Responses","trap":"B (Complete-then-deliver): 구조화 JSON 출력은 응답이 완결된 뒤에 전달되므로 실시간 점진 표시와 맞지 않습니다.\nC (Async batch latency): 배치 API는 대량 비대화형 작업을 위한 지연 처리 방식입니다.\nD (Input cost optimization): 프롬프트 캐싱은 입력 비용을 줄이는 기능이지 출력 전달 방식을 바꾸지 않습니다.\n→ 판단 기준: 생성 중인 토큰을 완료 전에 증분으로 전달하는 메커니즘인가.","memo":"생성되는 즉시 결과를 사용자에게 보여줘야 할 때는 증분 전달 방식을 사용한다."},{"src":"응용문제1","no":"37","q":"You are designing a Claude application for a customer support desk that maintains user sessions across multi-turn conversations. The product team has asked how the application will handle session lifecycle: when sessions should expire, how state is reset, and how the application avoids carrying stale context into new conversations. How would you design session lifecycle?","opts":["Define explicit session expiration rules, state reset triggers, and rules for starting fresh sessions so stale context does not leak into new conversations.","Write clear expiration rules, then leave it to each customer to open a new conversation whenever they want clean context, because the application never resets state by itself.","Pick one short timeout value, apply that same value to every conversation, and add nothing further to the lifecycle design.","Attach reset triggers to certain application events and run them for all users at once, without any expiration rule belonging to an individual session."],"ol":["A","B","C","D"],"why":"세션 수명주기는 만료 규칙, 상태 리셋 트리거, 새 세션 시작 규칙 세 가지를 모두 명시적으로 정의해야 완성됩니다. 세 요소가 함께 있어야 이전 문의의 맥락이 다음 대화로 흘러들어 가는 일을 사전에 차단할 수 있습니다. 셋 중 하나라도 빠지면 오래된 컨텍스트가 남게 됩니다.","domain":"Agent Architecture / Session State Lifecycle","trap":"B (User-dependent reset): 리셋을 고객 판단에만 맡기면 이전 컨텍스트 오염을 미리 막을 수 없습니다.\nC (Single timeout only): 일률적인 타임아웃 하나로는 이벤트 기반 상태 리셋을 지원하지 못합니다.\nD (Global-only triggers): 전역 트리거만 두고 세션별 만료 규칙이 없으면 개별 사용자 세션 관리가 되지 않습니다.\n→ 판단 기준: 만료 규칙·리셋 트리거·새 세션 시작 규칙 세 가지가 모두 명시되어 있는가.","memo":"이전 상태가 다음 실행으로 새면 안 될 때는 만료·리셋·재시작 규칙을 명시적으로 정의한다."},{"src":"응용문제1","no":"38","q":"A teammate has asked how the Claude SDK handles transient API errors in a nightly data enrichment job, such as a short connection failure or a brief rate-limit response. They want to know whether the job code needs to handle every transient error or whether the SDK provides any default behavior. How would you describe the SDK's default behavior?","opts":["The SDK provides default retry behavior for many transient errors, and the job code can configure or extend that behavior as needed.","The SDK retries connection failures on its own, but it hands every rate-limit response straight to the job code, which then has to build its own retry logic for those cases.","The SDK writes each transient error to a default log and continues without retrying, so the job code must notice failed calls and decide how to react.","The SDK retries transient errors a set number of times, and the job code cannot change that number or the wait between attempts."],"ol":["D","A","B","C"],"why":"Claude SDK는 일시적 네트워크 오류, 5xx 서버 오류, 429 레이트 리밋 응답에 대해 지수 백오프 기반의 기본 재시도를 이미 내장하고 있습니다. 동시에 그 재시도 횟수와 동작은 maxRetries 같은 옵션으로 애플리케이션이 조정하거나 확장할 수 있습니다. 기본 제공과 설정 가능성이라는 두 조건을 모두 만족하는 설명이 정답입니다.","domain":"Claude SDK / Transient Error Retries","trap":"A (Partial retry coverage): SDK는 네트워크 오류뿐 아니라 429 레이트 리밋에도 기본 재시도를 제공합니다.\nB (Log without retry): SDK는 재시도 없이 로그만 남기고 넘어가지 않습니다.\nC (Fixed non-configurable): 재시도 횟수와 백오프는 옵션으로 변경할 수 있으므로 고정 불변이라는 설명은 틀립니다.\n→ 판단 기준: 기본 재시도를 제공하면서 그 동작을 설정·확장할 수 있다는 두 조건을 모두 담았는가.","memo":"일시적 오류를 다뤄야 할 때는 SDK의 기본 재시도를 활용하되 필요에 맞게 설정을 조정한다."},{"src":"응용문제1","no":"39","q":"You are configuring Claude Code for a new mobile app repository. The team needs to set permissions, default model selections, and environment-specific behavior at the project level so the configuration is consistent across all developers working on the repository. The Claude Code mechanism you would use is...","opts":["the settings.json file, scoped at the project level so the configuration applies consistently across developers and persists with the repository.","a block of system prompt text that every developer pastes into Claude Code by hand at the start of each session on the repository.","a shared wiki page holding the agreed configuration values, which teammates read and edit manually as the repository changes.","environment variables that each developer defines on their own laptop before using Claude Code on the repository."],"ol":["A","B","C","D"],"why":"Claude Code는 프로젝트 루트의 settings.json으로 권한, 기본 모델, 환경별 동작을 프로젝트 범위에서 정의합니다. 이 파일을 저장소에 함께 두면 모든 팀원에게 별도 수작업 없이 동일한 설정이 자동으로 적용됩니다. 설정이 형상 관리 대상이 되므로 변경 이력도 함께 남습니다.","domain":"Claude Code / Project-Scoped Settings","trap":"B (Per-session prompt): 세션마다 사람이 붙여 넣는 방식은 누락되기 쉽고 권한 강제력도 없습니다.\nC (Manual documentation): 문서로 값을 공유하는 수동 관리는 설정 누락과 환경 불일치를 만듭니다.\nD (Local machine environment): 개발자 로컬 환경 변수에 의존하면 팀 전체 표준화와 형상 관리가 불가능합니다.\n→ 판단 기준: 저장소와 함께 관리되어 모든 개발자에게 자동으로 적용되는 수단인가.","memo":"팀 전체에 동일한 설정을 강제해야 할 때는 저장소에 함께 관리되는 프로젝트 범위 설정 파일을 사용한다."},{"src":"응용문제1","no":"40","q":"You are setting up a Claude application that requires API keys for several third-party payment and mapping services. What is the best way to store the keys?","opts":["Store the keys in a secrets manager or environment-specific configuration that is not checked into source code, and load them at runtime.","Create one key and reuse it for every third-party service, which makes it easy for anyone on the team to find during development.","Send the keys over chat messages to each developer, and ask them to paste the values into their local setup when they begin work.","Write the keys directly into the application's config file and commit that file to the team's repository with the rest of the code."],"ol":["C","A","B","D"],"why":"API 키는 소스 저장소에 절대 포함되면 안 되며, 시크릿 매니저나 버전 관리에서 제외된 환경별 설정에 보관해야 합니다. 애플리케이션은 실행 시점에 그 값을 안전하게 불러오도록 구성합니다. 이렇게 해야 키 유출 경로를 최소화하고 환경별로 다른 키를 안전하게 쓸 수 있습니다.","domain":"Security / Secrets Management","trap":"A (Shared single credential): 모든 서비스에 단일 키를 공유하면 최소 권한 원칙에 어긋나고 피해 범위가 커집니다.\nB (Plaintext manual distribution): 평문으로 키를 전달하고 손으로 붙여 넣게 하는 방식은 유출 위험이 큽니다.\nD (Committed to repository): 설정 파일에 키를 넣어 커밋하는 것은 대표적인 보안 사고 원인입니다.\n→ 판단 기준: 키가 소스 코드 밖에 보관되고 실행 시점에 로드되는가.","memo":"비밀 값을 다뤄야 할 때는 소스에 두지 말고 외부 시크릿 저장소에서 실행 시점에 불러온다."},{"src":"응용문제1","no":"41","q":"You are deciding between deploying a Claude-powered agent on Anthropic's hosted infrastructure or self-hosting under a \"bring your own cloud\" model in your own Google Cloud project. The agent processes patient records subject to your hospital group's data residency policies, but the team wants to ship quickly and avoid managing infrastructure. Which deployment model would you recommend?","opts":["Self-hosting under BYOC to satisfy the data residency requirement, while working with the infrastructure team to reduce the operational overhead of managing the deployment.","Deploy on Anthropic-hosted infrastructure now, and in parallel ask the hospital group to rewrite its data residency policy so hosted AI systems become acceptable.","Start with BYOC self-hosting for a first pilot, and later decide whether to move the agent onto Anthropic-hosted infrastructure once its data handling is clearer.","Deploy on Anthropic-hosted infrastructure so the release date holds, and record the data residency requirement as a compliance item to review after launch."],"ol":["C","A","B","D"],"why":"데이터 상주성 규정은 타협 대상이 아니므로 환자 데이터가 자사 클라우드를 벗어나지 않는 BYOC 셀프 호스팅을 선택해야 합니다. 빠른 출시라는 요구는 규정을 우회해서가 아니라 인프라 팀과 협업해 운영 부담을 줄이는 방식으로 해결합니다. 규정 준수와 속도를 동시에 만족시키는 유일한 선택지입니다.","domain":"Deployment / Data Residency Compliance","trap":"A (Bend the policy): 규정을 바꿔 달라고 요청하면서 먼저 배포하는 것은 준수 의무를 뒤집는 접근입니다.\nB (Migrate away from compliance): 파일럿 이후 규정 위반 방향으로 이전하는 계획은 상주성 정책과 역행합니다.\nD (Defer compliance review): 출시 일정을 위해 규정 검토를 사후로 미루는 것은 위반 상태로 운영하는 것입니다.\n→ 판단 기준: 데이터가 규정이 요구하는 경계를 벗어나지 않는 배포 방식을 먼저 택했는가.","memo":"규정 요구와 속도 요구가 충돌할 때는 규정을 만족하는 방식을 택하고 속도는 운영 부담 완화로 해결한다."},{"src":"응용문제1","no":"42","q":"You are designing a Claude application that will require structured JSON output for a downstream shipment tracking pipeline. The output schema is well-defined, and the pipeline will reject malformed JSON. Your application design would...","opts":["define a clear schema, structure the prompt to request output in that schema, and validate Claude's output against the schema before passing it downstream.","skip structured output and keep every response as plain text, since plain text bends more easily around unusual shipment cases than a fixed schema.","create the schema and ask the model in the prompt to follow it, then leave every correctness check to the shipment tracking pipeline that receives the result.","describe the wanted shape in ordinary sentences inside the prompt, and have the pipeline read whichever structure the model happens to return."],"ol":["D","A","B","C"],"why":"기대하는 출력 규격을 명확히 정의하고 프롬프트에 그 스키마를 명시해 모델이 규격대로 응답하도록 유도해야 합니다. 그리고 응답이 아무리 정확해 보여도 배송 추적 파이프라인으로 넘기기 전에 애플리케이션 단에서 스키마 검증을 거쳐야 합니다. 정의·요청·전달 전 검증 세 단계가 모두 갖춰져야 정답입니다.","domain":"Structured Output / Schema Validation","trap":"A (Free-form output): JSON을 요구하는 파이프라인에 비정형 텍스트를 쓰는 것은 요구사항에 정면으로 어긋납니다.\nB (Downstream validation deferral): 검증 책임을 하위 시스템에 미루면 손상된 JSON이 그대로 전달되어 오류가 납니다.\nC (Informal schema description): 자연어로만 형식을 설명하면 스키마 불일치 오류가 반복해서 발생합니다.\n→ 판단 기준: 전달 직전에 애플리케이션이 직접 스키마 검증을 수행하는가.","memo":"정해진 형식의 출력이 필요할 때는 규격을 명시해 요청하고 전달 전에 직접 검증한다."},{"src":"응용문제1","no":"43","q":"You are running Claude Code as part of an automated nightly release pipeline. The pipeline needs Claude Code to execute a set of well-defined tasks without prompting for confirmation, and the output needs to be captured for downstream processing. How would you configure the pipeline?","opts":["Run Claude Code in headless mode with the required permissions configured in settings.json and capture its output for downstream processing.","Turn off every confirmation prompt for Claude Code in all environments, including developer laptops, so the nightly pipeline is never held up by a question.","Keep Claude Code in interactive mode and assign an on-call engineer to approve each confirmation prompt while the nightly pipeline runs its tasks.","Move the pipeline to another tool that never asks for confirmation, so no permission setup is needed for the nightly release at all."],"ol":["D","A","B","C"],"why":"자동화 파이프라인에서는 대화형 프롬프트를 우회하기 위해 Claude Code를 헤드리스 모드로 실행합니다. 승인 요청으로 실행이 멈추지 않도록 필요한 권한만 settings.json에 미리 한정해 정의해 두어야 합니다. 이렇게 하면 출력도 그대로 캡처해 후속 단계로 넘길 수 있습니다.","domain":"Claude Code / Headless CI Automation","trap":"A (Global permission bypass): 모든 환경에서 승인을 끄면 개발자 로컬까지 위험에 노출됩니다.\nB (Manual approval in CI): 사람이 매번 승인하는 방식은 자동화 파이프라인의 목적 자체를 무력화합니다.\nC (Unnecessary tool replacement): 권한 설정만 하면 되는 상황에서 도구를 교체하는 것은 불필요한 해결책입니다.\n→ 판단 기준: 비대화형 모드로 실행하면서 필요한 권한만 설정 파일에 미리 한정했는가.","memo":"사람 개입 없이 자동 실행해야 할 때는 비대화형 모드로 돌리고 권한은 설정 파일에 미리 한정해 둔다."},{"src":"응용문제1","no":"44","q":"A new engineer on your platform team has asked you to explain when a Skill would be the right choice over an MCP server. The engineer is unsure how the two differ in practice when both can be shared across projects. How would you explain the distinction?","opts":["A Skill bundles prompts, scripts, and data into a package the model loads as a unit, while an MCP server exposes resources, tools, and prompts through a standard client interface.","Choose a Skill whenever a cap
