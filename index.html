프롬프트로 그 규격에 맞춰 응답하도록 요청한 뒤, 하위로 넘기기 전에 애플리케이션 단에서 스키마 검증까지 수행하는 3단계가 모두 갖춰져야 합니다. 검증을 생략하거나 하위 파이프라인에 떠넘기면 깨진 JSON이 그대로 흘러갑니다. 부품 카탈로그라는 상황만 바뀌었을 뿐 판단 기준은 원본과 같습니다.","domain":"Structured Output / Schema Validation","trap":"B (Downstream validation deferral): 검증 책임을 카탈로그 파이프라인으로 미루면 깨진 JSON이 하위 오류로 이어집니다.\nC (Free-form output): 구조화 JSON이 필요한 상황에서 비정형 텍스트를 쓰는 것은 요구사항에 역행합니다.\nD (Informal schema description): 자연어로만 형식을 설명하고 알아서 파싱하게 두면 스키마 불일치 오류가 반복됩니다.\n→ 판단 기준: 스키마 정의와 프롬프트 요청에 더해 전달 전 자체 검증까지 수행하는가.","memo":"정해진 형식의 출력이 필요할 때는 규격을 명시해 요청하고 전달 전에 직접 검증한다."},{"src":"응용문제2","no":"43","q":"A telecom operator runs a nightly automation job that asks Claude Code to carry out a fixed list of maintenance tasks on its network configuration repository. Nobody watches the job while it runs, so it must never stop for an approval, and the results have to be saved for a later reporting step. How would you configure the pipeline?","opts":["Run Claude Code in headless mode with the required permissions configured in settings.json and capture its output for the reporting step.","Turn off Claude Code's approval prompts for every environment the operator uses, so no prompt can hold up the nightly job.","Run Claude Code in interactive mode and have an on-call engineer approve each prompt by hand while the nightly job works through its tasks.","Move the job to another tool that never asks for approval, so no permission setup is needed at all."],"ol":["C","A","B","D"],"why":"사람이 지켜보지 않는 자동화에서는 대화형 프롬프트를 피하기 위해 Claude Code를 헤드리스 모드로 실행합니다. 필요한 권한은 settings.json에 미리 한정해 정의해 두어야 승인 요청으로 작업이 멈추지 않고, 출력은 후속 리포팅 단계로 넘기면 됩니다. 통신사 야간 작업이라는 상황만 달라졌을 뿐 판단 기준은 원본과 같습니다.","domain":"Claude Code / Headless CI Automation","trap":"A (Global permission bypass): 모든 환경에서 승인 프롬프트를 끄는 것은 로컬 개발 환경까지 위험에 노출시킵니다.\nB (Manual approval in CI): 야간 자동화에서 사람이 매번 승인하는 것은 자동화의 목적 자체를 없앱니다.\nD (Unnecessary tool replacement): 권한 설정만 하면 되는 일로 도구를 교체하는 것은 불합리한 해결책입니다.\n→ 판단 기준: 비대화형 헤드리스 모드로 실행하되 권한은 설정 파일에 미리 한정해 두는가.","memo":"사람 개입 없이 자동 실행해야 할 때는 비대화형 모드로 돌리고 권한은 설정 파일에 미리 한정해 둔다."},{"src":"응용문제2","no":"44","q":"A quality engineer at a manufacturing plant wants to share a defect-report capability with the other plants in the group and asks whether it should be built as a Skill or as an MCP server. The engineer believes the two are simply different names for one mechanism. How would you explain the distinction?","opts":["A Skill bundles prompts, scripts, and data into a package the model loads as a unit, while an MCP server exposes resources, tools, and prompts through a standard client interface.","A Skill is the better choice for sharing across plants because it starts with less loading overhead than an MCP server when many sites run inspections at the same time.","A Skill and an MCP server are two labels for one extension point, so the group can pick either one whenever a capability has to be shared between plants.","A Skill belongs to an earlier generation of tooling and an MCP server replaced it, so every new shared capability the group builds should be an MCP server."],"ol":["A","B","C","D"],"why":"두 확장 메커니즘은 성능이나 출시 시점이 아니라 구조적 정의로 구분됩니다. Skill은 프롬프트·스크립트·데이터를 하나의 패키지로 묶어 모델이 단일 단위로 로드하는 형태이고, MCP 서버는 표준 클라이언트 인터페이스를 통해 리소스·툴·프롬프트를 노출하는 클라이언트-서버 구조입니다. 제조 공장 사례로 상황만 바뀌었을 뿐, 아키텍처적 차이를 정확히 설명할 수 있는지를 묻는 기준은 원본과 같습니다.","domain":"Extensibility / Skills vs MCP Servers","trap":"B (Performance-based framing): 로드 효율이나 성능 비교로 설명하는 것은 두 메커니즘의 구동 방식 차이를 설명하지 못합니다.\nC (Interchangeable equivalence): 완전히 교체 가능한 동의어가 아니며 각각 구조와 적합한 유스케이스가 구분됩니다.\nD (Legacy versus successor): 신구 기술의 대체 관계가 아니라 목적에 따라 함께 쓰이는 서로 다른 아키텍처 도구입니다.\n→ 판단 기준: 성능이나 출시 순서가 아니라 '패키지 단위 로드'와 '표준 인터페이스를 통한 노출'이라는 구조적 정의로 구분하는가.","memo":"두 확장 방식 중 무엇을 고를지 판단해야 할 때는 성능이나 신구 여부가 아니라 각각의 구조적 정의와 동작 방식의 차이를 기준으로 삼는다."},{"src":"응용문제2","no":"45","q":"A logistics operations manager notices that asking Claude to summarize the same shipment delay report twice returns wording that is not identical, and concludes that the tracking application is broken. How would you address the manager's concern?","opts":["Explain that LLMs are non-deterministic by default due to sampling, and describe how the application handles this through validation, retries, or temperature adjustment.","Tell the manager that the differences come from slow links between the warehouse systems, and that a faster connection will return the same summary text on every run.","Tell the manager that the differing wording is a defect in the tracking application, open a work ticket, and promise the team will remove it in the next release.","Tell the manager that the wording shifts because Anthropic keeps updating Claude, and that locking the application to one fixed model version will remove the variation completely."],"ol":["D","A","B","C"],"why":"같은 입력에 대한 출력 변동은 토큰 샘플링에서 오는 LLM의 기본 특성이며 제거 대상 버그가 아닙니다. 검증, 재시도, temperature 조정 같은 애플리케이션 계층의 통제로 관리한다고 설명하는 것이 정답입니다. 물류 배송 지연 보고 사례로 상황만 바뀌었고, '본질적 특성 대 버그'를 구분하는 판단 기준은 원본과 같습니다.","domain":"LLM Fundamentals / Non-determinism","trap":"A (Infrastructure misattribution): 네트워크 속도나 지연 시간은 출력 변동성의 원인이 아닙니다.\nB (Bug misclassification): 확률적 생성 특성을 코드 결함으로 분류하고 티켓을 여는 것은 잘못된 진단입니다.\nC (Version pinning fix): 모델 버전을 고정해도 샘플링에 의한 변동은 완전히 사라지지 않습니다.\n→ 판단 기준: 변동을 제거해야 할 결함으로 보는가, 아니면 모델의 기본 특성으로 인정하고 애플리케이션 통제로 관리하는가.","memo":"모델의 본질적 특성으로 인한 현상을 다뤄야 할 때는 그것을 제거하려 하지 말고 애플리케이션 계층의 통제 장치로 관리한다."},{"src":"응용문제2","no":"46","q":"You are designing an agent for an academic journal's manuscript screening workflow. Each manuscript passes through reference extraction, methodology evaluation, and an accept-or-reject decision. The three subtasks have separate success criteria, and some manuscripts must return from methodology evaluation to reference extraction before a decision can be made. Which agent pattern would you apply?","opts":["A graph-based pattern that lets the agent move between subtasks based on the state of each manuscript, with each subtask evaluated against its own criteria.","A single tool-use loop in which one agent holds every tool for reference extraction, methodology evaluation, and the decision, and works through them in one continuous run.","A linear chain that sends each manuscript through reference extraction, then methodology evaluation, then the decision step, with no route back to an earlier subtask.","A streaming pattern that sends partial decisions to the editor while the agent works, and keeps improving the text until a final decision appears at the end."],"ol":["B","A","C","D"],"why":"단계 간 복귀 경로와 조건부 분기가 필요하고 각 단계마다 독립적인 성공 기준이 있으므로 상태에 따라 노드 사이를 이동하는 그래프 기반 패턴이 맞습니다. 논문 심사 워크플로우로 사례만 바뀌었을 뿐, '반복 + 분기 + 노드별 검증'이 요구되면 그래프 구조를 고른다는 판단 기준은 원본과 동일합니다.","domain":"Agent Architecture / Workflow Patterns","trap":"A (Single undifferentiated loop): 모든 툴을 단일 에이전트에 몰아넣으면 단계별 책임 분리와 상태 제어가 어렵습니다.\nC (Fixed linear sequence): 선형 체인은 이전 단계로 되돌아가는 복귀 경로를 지원하지 못합니다.\nD (Output delivery mechanism): 스트리밍은 출력 전달 방식일 뿐 반복적 태스크 오케스트레이션 패턴이 아닙니다.\n→ 판단 기준: 고정된 순서로 흘려보내는가, 아니면 상태에 따라 서브태스크 사이를 오가며 각 단계를 개별 기준으로 검증하는가.","memo":"단계 간 되돌아가는 반복과 조건부 분기가 필요할 때는 고정된 순서가 아니라 상태에 따라 이동하는 그래프 구조를 사용한다."},{"src":"응용문제2","no":"47","q":"You are building a multi-step Claude workflow for a city government's civil complaint desk, where the redaction step and the routing step must reason without reading everything the earlier steps discussed. The team wants each step to see only its own material. The context engineering technique you would use is...","opts":["context isolation through subagents or multi-step agentic workflows that scope each step's context to only what the step needs.","one shared prompt applied to every step of the complaint workflow, with the same wording used no matter which part of the case that step is handling.","placing the complete record of the earlier steps into every step, even when a step does not need that record for its own reasoning.","adding as much related case material as possible at each step, so every step can read the entire complaint history while it reasons."],"ol":["C","A","B","D"],"why":"각 단계가 자신에게 필요한 정보만 보도록 컨텍스트 스코프를 제한하는 컨텍스트 격리가 정답입니다. 서브에이전트나 다단계 워크플로우로 범위를 나누면 불필요한 이전 이력에서 오는 노이즈와 편향을 막을 수 있습니다. 민원 처리 데스크로 상황만 바뀌었고 판단 기준은 원본과 같습니다.","domain":"Context Engineering / Context Isolation","trap":"A (Single global prompt): 모든 단계에 동일한 전역 프롬프트를 적용하면 단계별 컨텍스트 통제가 불가능합니다.\nB (Full history injection): 필요 여부와 무관하게 전체 이력을 매 단계에 넣는 것은 격리의 목적과 정반대입니다.\nD (Maximal context augmentation): 가능한 모든 자료를 매 단계에 덧붙이는 것 역시 격리가 아니라 컨텍스트 확장입니다.\n→ 판단 기준: 모든 단계가 같은 맥락을 공유하게 하는가, 아니면 각 단계에 필요한 최소 범위만 격리해 전달하는가.","memo":"각 단계가 서로 다른 정보만 봐야 할 때는 모든 맥락을 공유하지 말고 단계별로 필요한 범위만 격리해서 전달한다."},{"src":"응용문제2","no":"48","q":"A bank is about to release updated prompt versions in the configuration of its credit risk screening platform. Several connected systems, including loan origination, fraud alerting, and regulatory reporting, consume the platform's output. The change passed the test environment, but no one has checked how it affects each connected system. What would you do before releasing the change?","opts":["Assess the configuration impact on each downstream system before rolling out, and coordinate with downstream system owners as needed.","Record the new prompt versions in the platform release notes and ship the change, since a clean test environment run should already cover every connected system.","Send the owners of the connected systems a message that a change is coming, book the release for next week, and run no formal review of the effect.","Release the change only to the systems that took part in the test environment run, and postpone every other connected system to a later release cycle."],"ol":["B","A","C","D"],"why":"여러 하위 시스템이 의존하는 변경은 배포 전에 각 시스템에 대한 영향도 평가를 수행하고 소유자와 조율해야 합니다. 테스트 환경 통과나 일정 통보만으로는 하위 호환성이 검증되지 않습니다. 은행 신용 리스크 심사 플랫폼으로 상황만 바뀌었고 판단 기준은 원본과 같습니다.","domain":"Change Management / Downstream Impact Assessment","trap":"A (Staging as sufficient evidence): 테스트 환경 통과를 하위 시스템 영향도 검증으로 간주하고 배포를 강행하는 접근입니다.\nC (Notification without assessment): 영향도 평가 없이 통보만 하고 배포하면 하위 시스템 장애 위험이 그대로 남습니다.\nD (Partial scope deferral): 일부 시스템에만 제한 배포하고 나머지를 미루는 것은 영향도 분석을 대체하지 못합니다.\n→ 판단 기준: 배포 전에 각 하위 시스템에 대한 영향도 평가와 소유자 조율을 수행하는가.","memo":"여러 곳이 의존하는 변경을 적용해야 할 때는 통보나 부분 배포로 대체하지 말고 사전 영향도 평가와 이해관계자 조율을 먼저 수행한다."},{"src":"응용문제2","no":"49","q":"An online retailer needs to label millions of product reviews each day with one of a few simple tags. Each labeling decision is easy, the response time budget is tight, and the cost of a single request matters at this volume. Which model would you choose?","opts":["A smaller, faster Claude model, because the task is straightforward and the workload prioritizes latency and per-request cost at scale.","A mid-tier Claude model as the standard pick, since a middle option offers a reasonable mix of quality and price for almost every review the retailer receives.","The largest Claude model on offer, so each review tag is as accurate as it can be, even though every request costs more and returns more slowly.","Several Claude models placed one after another, so each review passes through more than one model and the application merges the results into one tag."],"ol":["C","A","B","D"],"why":"작업이 단순하고 지연 시간과 건당 비용이 중요한 대량 워크로드에서는 더 작고 빠른 모델을 고르는 목적 적합 모델 선택이 정답입니다. 리뷰 태깅 사례로 상황만 바뀌었을 뿐, 요구 수준에 맞는 가장 가벼운 모델을 고른다는 판단 기준은 원본과 같습니다.","domain":"Model Selection / Cost-Latency Tradeoff","trap":"A (Default mid-tier choice): 단순 작업에 중간급 모델을 기본값으로 두는 것은 대규모 처리에서 오버스펙입니다.\nB (Maximum capacity overkill): 최상위 모델은 지연과 비용이 커서 대량의 단순 분류에 부적합합니다.\nD (Serial model chaining): 여러 모델을 직렬로 거치면 지연과 비용이 배로 늘어 타이트한 응답 조건에 맞지 않습니다.\n→ 판단 기준: 작업 난이도와 지연·비용 제약에 맞춰 가장 가벼운 모델을 고르는가, 아니면 무조건 높은 등급을 택하는가.","memo":"작업이 단순하고 속도와 비용이 중요할 때는 성능이 가장 높은 선택지가 아니라 요구 수준에 맞는 가장 가벼운 선택지를 사용한다."},{"src":"응용문제2","no":"50","q":"A contract review assistant at a law firm performed well in testing, but it now sometimes reports clauses that do not appear in the uploaded contract. The engineering team already decided the model is hallucinating and asked you to look into it. What would you do first?","opts":["Examine production traces to identify whether the issue is hallucination by the model, context loss, prompt injection, or another failure mode before recommending a fix.","Set up a retrieval layer over the clause library so answers stay tied to the source contract, and do this before reviewing any record of real runs.","Add a line to the system prompt telling the model never to report a clause it cannot find, since a prompt edit is the quickest answer to invented content.","Move the assistant onto a larger model because larger models are said to invent less, and treat that change as the fix for the reported behavior."],"ol":["B","A","C","D"],"why":"증상만 보고 원인을 단정한 상태이므로, 수정 조치를 적용하기 전에 프로덕션 트레이스를 분석해 환각인지 컨텍스트 손실인지 프롬프트 주입인지 근본 원인을 먼저 식별해야 합니다. 법률 계약서 검토 사례로 상황만 바뀌었고 판단 기준은 원본과 같습니다.","domain":"Observability / Root Cause Diagnosis","trap":"A (Premature architectural fix): 원인 조사 없이 검색 기반 구조부터 도입하면 불필요한 아키텍처 공수가 발생합니다.\nC (Prompt-only instruction): 원인이 컨텍스트 손실이나 프롬프트 주입이면 시스템 프롬프트 문구 추가로 해결되지 않습니다.\nD (Model swap guess): 모델 교체는 원인 파악 없는 임시방편이며 비용과 지연만 늘립니다.\n→ 판단 기준: 곧바로 수정 조치를 적용하는가, 아니면 실제 실행 기록을 분석해 근본 원인을 먼저 식별하는가.","memo":"원인이 확정되지 않은 문제를 다뤄야 할 때는 곧바로 수정하지 말고 실제 실행 기록을 분석해 근본 원인을 먼저 식별한다."},{"src":"응용문제2","no":"51","q":"A utility company uses tool calling so Claude can look up outage records and open field work orders. The flow sometimes breaks because the model returns a tool_use block containing arguments that the schema does not define, and the application code does not deal with this case. How would you address this?","opts":["Validate the tool_use block's arguments against the tool schema before dispatching the tool and handle invalid arguments as a recognized error path.","Write the invalid tool_use blocks to the log, still run the tool with them, and let the tool's own error reporting return the failure to the application.","Send the same request again and again until the model finally returns a tool_use block whose arguments match the schema.","Remove tool calling from the workflow and ask the model to write out in plain text what it would have done with the outage record."],"ol":["B","A","C","D"],"why":"툴을 실행하기 전에 tool_use 인자를 스키마와 대조해 검증하고, 유효하지 않으면 정식 오류 경로로 처리해 모델이 스스로 교정하도록 하는 것이 정답입니다. 전력 설비 장애 처리 사례로 상황만 바뀌었을 뿐, 사전 검증과 오류 경로 설계라는 판단 기준은 원본과 같습니다.","domain":"Tool Use / Pre-dispatch Schema Validation","trap":"A (Post-dispatch error handling): 잘못된 인자를 그대로 실행에 넘기면 실행 오류와 부작용이 발생합니다.\nC (Blind retry loop): 동일 요청을 무조건 재시도하면 무한 루프와 토큰 낭비로 이어집니다.\nD (Capability abandonment): 툴 호출 자체를 포기하는 것은 문제의 본질을 회피하는 선택입니다.\n→ 판단 기준: 실행 전에 스키마와 대조해 검증하고 위반 시 정해진 오류 경로로 처리하는가.","memo":"모델이 만든 입력으로 실제 동작을 실행해야 할 때는 실행 전에 규격과 대조해 검증하고 위반 시 정해진 오류 경로로 처리한다."},{"src":"응용문제2","no":"52","q":"A genomics research lab is deciding between STDIO-based communication and HTTP-based communication for an MCP server. The server will be started by a Claude Code session running on the researcher's own workstation. Which communication pattern would you use?","opts":["STDIO because STDIO is well-suited to local process communication and avoids unnecessary network setup.","HTTP polling against the MCP server, used in place of the transports that the MCP specification defines.","STDIO and HTTP kept running at the same time as a backup measure, so the workstation carries two transports for one server.","HTTP, on the view that HTTP is the better transport in every situation the lab could meet, whatever machine the server runs on."],"ol":["A","B","C","D"],"why":"클라이언트와 서버가 같은 머신에서 로컬 프로세스로 동작하므로 네트워크 포트 바인딩과 인증 설정이 필요 없는 STDIO가 맞습니다. 유전체 연구실 워크스테이션으로 상황만 바뀌었을 뿐, 배치 환경에 맞는 표준 전송 방식을 고른다는 판단 기준은 원본과 같습니다.","domain":"MCP / Transport Selection","trap":"B (Non-standard transport): HTTP 폴링은 MCP 표준 전송 패턴이 아닙니다.\nC (Redundant dual transport): 동일 로컬 세션에서 두 전송을 동시에 돌리는 것은 불필요한 복잡성만 만듭니다.\nD (Context-blind preference): 모든 환경에서 HTTP가 낫다는 주장은 로컬 실행 조건을 무시한 것입니다.\n→ 판단 기준: 실행 주체가 로컬인지 원격인지에 맞는 표준 전송 방식을 고르는가.","memo":"통신 방식을 골라야 할 때는 무조건 하나를 선호하지 말고 실행 주체가 로컬인지 원격인지에 맞는 표준 전송 방식을 사용한다."},{"src":"응용문제2","no":"53","q":"A hospital intake assistant summarizes patient intake forms well for ordinary cases but handles unusual ones poorly. The team has collected a set of unusual intake forms together with the summary that each one should produce. What is the best way to use these examples?","opts":["Add the labeled edge-case examples to the prompt as few-shot examples so the model can learn the pattern.","Place a notice on the intake screen asking staff not to enter the unusual cases, so the difficult forms never reach the assistant at all.","Store the examples in a search index so the application can look them up while the model is writing each summary.","Train a custom model on the small set of labeled forms and put that model into production in place of the current Claude integration."],"ol":["D","A","B","C"],"why":"입력과 원하는 출력이 쌍으로 확보되어 있으므로, 이를 프롬프트에 퓨샷 예제로 직접 넣어 in-context learning으로 패턴을 익히게 하는 것이 정답입니다. 병원 인테이크 요약 사례로 상황만 바뀌었을 뿐, 별도 학습이나 검색 계층 대신 예제를 직접 제시한다는 판단 기준은 원본과 같습니다.","domain":"Prompt Engineering / Few-Shot Examples","trap":"A (Input avoidance workaround): 사용자가 에지 케이스를 입력하지 못하게 막는 것은 근본 해결책이 아닙니다.\nB (Retrieval indirection): 예제를 검색 계층에 넣는 것은 프롬프트 직접 주입보다 패턴 학습 효과가 떨어집니다.\nC (Custom model training): 소량 예제를 위한 커스텀 모델 학습은 비용과 시간이 큰 오버엔지니어링입니다.\n→ 판단 기준: 이미 확보한 정답 예제를 프롬프트에 퓨샷으로 직접 제시하는가, 아니면 학습·검색 같은 우회 수단을 택하는가.","memo":"원하는 입출력 예제를 이미 확보했을 때는 별도 학습이나 검색 계층을 두지 말고 프롬프트에 예제로 직접 제시한다."}];
const ALL = RAW.map((q, i) => ({ ...q, i, id: q.src + "#" + q.no }));
const LETTERS = ["A", "B", "C", "D"];
const SK = "ccdvf.stats.v2", SESK = "ccdvf.session.v2";

/* ---------- storage ---------- */
const store = {
  get(k, f) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? f : v; } catch (e) { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let stats = store.get(SK, {});
const stat = id => stats[id] || { r: 0, w: 0, last: null };
const wrongIds = () => ALL.filter(q => stat(q.id).last === "x").map(q => q.i);

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* 본문의 `백틱` 표기를 인라인 코드로 렌더 (원본 데이터의 백틱은 모두 짝이 맞음) */
const fmt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
const clock = ms => { const t = Math.round(ms / 1000); return Math.floor(t / 60) + "분 " + String(t % 60).padStart(2, "0") + "초"; };
const toTop = () => window.scrollTo(0, 0);
/* 함정 해설의 원본 보기 라벨(A~D)을 이번 회차에 표시된 라벨로 바꾸고, 보기 순서대로 다시 정렬 */
const LABELLED = /^([A-D])(\s*[(（])/;
function relabel(text, q, it) {
  const map = {};
  it.ord.forEach(function (oi, pos) { map[q.ol[oi]] = LETTERS[pos]; });
  const keyed = [], rest = [];
  text.split("\n").forEach(function (line) {
    const m = LABELLED.exec(line);
    if (m && map[m[1]] && !rest.length) {
      const L = map[m[1]];
      keyed.push([L, L + m[2] + line.slice(m[0].length)]);
    } else {
      rest.push(line);
    }
  });
  keyed.sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
  return keyed.map(e => e[1]).concat(rest).join("\n");
}

/* ---------- state ---------- */
let setup = { scope: "all", count: "all", mode: "instant" };
let S = null;
let view = "home";

const SCOPES = {
  all:   { name: "전체 통합",  pool: () => ALL.map(q => q.i) },
  s1:    { name: "응용문제 1", pool: () => ALL.filter(q => q.src === "응용문제1").map(q => q.i) },
  s2:    { name: "응용문제 2", pool: () => ALL.filter(q => q.src === "응용문제2").map(q => q.i) },
  wrong: { name: "오답 노트",  pool: wrongIds }
};

function buildSession(pool, mode, scope) {
  const ids = shuffle(pool.slice());
  const n = setup.count === "all" ? ids.length : Math.min(+setup.count, ids.length);
  const items = ids.slice(0, n).map(i => ({ i: i, ord: shuffle([0, 1, 2, 3]) }));
  return { items: items, pick: items.map(() => null), cur: 0, mode: mode, scope: scope, t0: Date.now(), el: 0, done: false };
}
const saveSession = () => { if (S && !S.done) store.set(SESK, Object.assign({}, S, { el: S.el + (Date.now() - S.t0), t0: Date.now() })); };
const curItem = () => S.items[S.cur];
const qOf = it => ALL[it.i];
const isRight = k => S.pick[k] === 0;
const doneCount = () => S.pick.filter(p => p !== null).length;
const rightCount = () => S.pick.filter(p => p === 0).length;

function record(k) {
  const q = qOf(S.items[k]), ok = isRight(k), s = stat(q.id);
  stats[q.id] = { r: s.r + (ok ? 1 : 0), w: s.w + (ok ? 0 : 1), last: ok ? "o" : "x" };
  store.set(SK, stats);
}

/* ================= views ================= */
const root = document.getElementById("root");
const bar = document.getElementById("bar");
const rail = document.getElementById("rail");

function render() {
  if (view === "home") viewHome();
  else if (view === "quiz") viewQuiz();
  else viewResult();
}

/* ---------- home ---------- */
function viewHome() {
  const seen = ALL.filter(q => stat(q.id).last).length;
  const bad = wrongIds().length;
  let r = 0, w = 0;
  ALL.forEach(q => { r += stat(q.id).r; w += stat(q.id).w; });
  const acc = r + w ? Math.round((r / (r + w)) * 100) + "%" : "–";

  const saved = store.get(SESK, null);
  const resumable = saved && saved.items && !saved.done && saved.pick.some(p => p !== null) && saved.pick.some(p => p === null);

  bar.innerHTML = '<div class="mark">CCDVF <span>/</span> 응용문제</div><div class="bar-sp"></div>' +
    '<div class="count">' + ALL.length + " 문항</div>";
  rail.style.width = "0%";

  const pool = SCOPES[setup.scope].pool().length;
  const picked = setup.count === "all" ? pool : Math.min(+setup.count, pool);

  root.innerHTML =
    '<section class="hero">' +
      '<div class="eyebrow">Claude API · SDK · 에이전트 설계 모의고사</div>' +
      "<h1>응용문제 " + ALL.length + "개, 매번 새로운 순서로.</h1>" +
      "<p>응용문제 1·2 시트를 하나로 합쳐 문항 순서와 보기 순서를 풀 때마다 다시 섞습니다. 정답의 위치를 외우는 대신 근거로 고르는 연습을 하세요.</p>" +
      '<div class="stats">' +
        '<div class="stat"><b>' + ALL.length + "</b><span>총 문항</span></div>" +
        '<div class="stat"><b>' + seen + "</b><span>풀어본 문항</span></div>" +
        '<div class="stat"><b>' + acc + "</b><span>누적 정답률</span></div>" +
        '<div class="stat"><b>' + bad + "</b><span>오답 노트</span></div>" +
      "</div>" +
    "</section>" +

    '<section class="setup">' +
      '<div class="field"><div class="label">출제 범위</div><div class="pills" data-g="scope">' +
        Object.keys(SCOPES).map(function (k) {
          const n = SCOPES[k].pool().length;
          return '<button class="pill" data-v="' + k + '" aria-pressed="' + (setup.scope === k) + '"' +
            (n === 0 ? " disabled" : "") + ">" + SCOPES[k].name + "<em>" + n + "</em></button>";
        }).join("") +
      "</div></div>" +

      '<div class="field"><div class="label">문항 수</div><div class="pills" data-g="count">' +
        ["all", "20", "40", "60"].map(function (c) {
          const dis = c !== "all" && +c >= pool;
          return '<button class="pill" data-v="' + c + '" aria-pressed="' + (setup.count === c) + '"' +
            (dis ? " disabled" : "") + ">" + (c === "all" ? "전체" : c + "문항") + "</button>";
        }).join("") +
      "</div></div>" +

      '<div class="field"><div class="label">채점 방식</div><div class="pills" data-g="mode">' +
        '<button class="pill" data-v="instant" aria-pressed="' + (setup.mode === "instant") + '">바로 해설</button>' +
        '<button class="pill" data-v="exam" aria-pressed="' + (setup.mode === "exam") + '">시험 모드</button>' +
      "</div><div class=\"hint\">" +
        (setup.mode === "instant"
          ? "보기를 고르면 그 자리에서 정답·해설·함정을 보여줍니다."
          : "끝까지 풀고 마지막에 한 번에 채점합니다. 제출 전까지 답을 바꿀 수 있습니다.") +
      "</div></div>" +

      '<div class="row">' +
        '<button class="cta" id="start">' + SCOPES[setup.scope].name + " " + picked + "문항 시작</button>" +
        (resumable ? '<button class="cta sec" id="resume">이어서 풀기 · ' +
          saved.pick.filter(p => p !== null).length + "/" + saved.items.length + "문항</button>" : "") +
      "</div>" +
    "</section>" +

    '<footer class="foot">기록은 이 브라우저에만 저장됩니다.' +
      (seen ? ' · <button class="ghost" id="reset" style="margin-left:2px">학습 기록 지우기</button>' : "") +
    "</footer>";

  root.querySelectorAll(".pills .pill").forEach(function (b) {
    b.addEventListener("click", function () {
      const g = b.closest(".pills").dataset.g;
      setup[g] = b.dataset.v;
      if (g === "scope") {
        const p = SCOPES[setup.scope].pool().length;
        if (setup.count !== "all" && +setup.count >= p) setup.count = "all";
      }
      viewHome();
    });
  });
  root.querySelector("#start").addEventListener("click", function () {
    const pool = SCOPES[setup.scope].pool();
    if (!pool.length) return;
    S = buildSession(pool, setup.mode, setup.scope);
    saveSession(); view = "quiz"; render(); toTop();
  });
  const rs = root.querySelector("#resume");
  if (rs) rs.addEventListener("click", function () {
    S = store.get(SESK, null);
    if (!S) return;
    S.t0 = Date.now();
    setup.mode = S.mode;
    if (S.scope) setup.scope = S.scope;
    const nx = S.pick.findIndex(p => p === null);
    S.cur = nx < 0 ? S.items.length - 1 : nx;
    view = "quiz"; render(); toTop();
  });
  const rt = root.querySelector("#reset");
  if (rt) rt.addEventListener("click", function () {
    if (!confirm("누적 정답률과 오답 노트를 모두 지웁니다. 계속할까요?")) return;
    stats = {}; store.del(SK); store.del(SESK); viewHome();
  });
}

/* ---------- quiz ---------- */
function viewQuiz() {
  const k = S.cur, it = curItem(), q = qOf(it), pick = S.pick[k];
  const reveal = S.mode === "instant" && pick !== null;
  const total = S.items.length;
  const last = k === total - 1;

  bar.innerHTML = '<button class="ghost" id="home">나가기</button><div class="bar-sp"></div>' +
    '<div class="count"><b>' + (k + 1) + "</b> / " + total +
    (S.mode === "instant" && doneCount() ? " · 정답 " + rightCount() + "/" + doneCount() : "") + "</div>";
  rail.style.width = ((k + (pick !== null ? 1 : 0)) / total) * 100 + "%";

  root.innerHTML =
    '<div class="qhead"><span class="chip dom">' + esc(q.domain) + "</span>" +
      '<span class="chip">' + esc(q.src) + " #" + esc(q.no) + "</span></div>" +
    '<h2 class="qtext">' + fmt(q.q) + "</h2>" +
    '<div class="opts">' +
      it.ord.map(function (oi, pos) {
        let s = "";
        if (reveal) s = oi === 0 ? "ok" : (oi === pick ? "no" : "dim");
        else if (pick === oi) s = "sel";
        const glyph = reveal && oi === 0 ? "✓" : (reveal && oi === pick ? "✕" : LETTERS[pos]);
        return '<button class="opt" data-oi="' + oi + '"' + (s ? ' data-s="' + s + '"' : "") +
          (reveal ? " disabled" : "") + '><span class="mk">' + glyph + "</span>" +
          '<span class="tx">' + fmt(q.opts[oi]) + "</span></button>";
      }).join("") +
    "</div>" +
    (reveal ? explain(q, pick, it) : "") +
    '<div class="act"><div class="act-in" id="acts"></div></div>';

  const acts = root.querySelector("#acts");
  if (S.mode === "instant") {
    acts.innerHTML = reveal
      ? '<button class="cta" id="next">' + (last ? "채점 결과 보기" : "다음 문항") + "</button>" +
        '<div class="kbd"><b>N</b> 다음</div>'
      : '<div class="kbd">선택 <b>A</b><b>B</b><b>C</b><b>D</b> 또는 <b>1</b>–<b>4</b></div><div class="bar-sp"></div>' +
        (k > 0 ? '<button class="ghost" id="prev">이전 문항</button>' : "");
  } else {
    acts.innerHTML = (k > 0 ? '<button class="ghost" id="prev">이전</button>' : "") +
      '<button class="cta" id="next">' + (last ? "제출하고 채점" : pick === null ? "건너뛰기" : "다음 문항") + "</button>";
  }

  bar.querySelector("#home").addEventListener("click", function () {
    saveSession(); view = "home"; render(); toTop();
  });
  root.querySelectorAll(".opt").forEach(function (b) {
    b.addEventListener("click", function () { choose(+b.dataset.oi); });
  });
  const nx = root.querySelector("#next");
  if (nx) nx.addEventListener("click", next);
  const pv = root.querySelector("#prev");
  if (pv) pv.addEventListener("click", function () { S.cur--; render(); toTop(); });
}

function explain(q, pick, it) {
  const ok = pick === 0;
  return '<div class="exp">' +
    '<div class="verdict ' + (ok ? "ok" : "no") + '"><i>' + (ok ? "✓" : "✕") + "</i>" +
      (ok ? "정답" : "오답 · 정답은 " + LETTERS[it.ord.indexOf(0)]) + "</div>" +
    '<div class="sec"><h4>정답 해설</h4><p>' + fmt(q.why) + "</p></div>" +
    '<div class="sec"><h4>헷갈리기 쉬운 함정</h4><p>' + fmt(relabel(q.trap, q, it)) + "</p></div>" +
    '<div class="memo"><h4>암기 문장</h4><p>' + fmt(q.memo) + "</p></div>" +
  "</div>";
}

function choose(oi) {
  const k = S.cur;
  if (S.mode === "instant") {
    if (S.pick[k] !== null) return;
    S.pick[k] = oi;
    record(k);
  } else {
    S.pick[k] = oi;
  }
  saveSession();
  render();
  if (S.mode === "instant") {
    const e = root.querySelector(".exp");
    if (e) e.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start" });
  }
}

function next() {
  if (S.cur < S.items.length - 1) { S.cur++; saveSession(); render(); toTop(); return; }
  if (S.mode === "exam") {
    const blank = S.pick.filter(p => p === null).length;
    if (blank && !confirm(blank + "문항이 비어 있습니다. 그대로 제출할까요?")) return;
    S.pick.forEach(function (p, k) { if (p !== null) record(k); });
  }
  S.done = true;
  S.el = S.el + (Date.now() - S.t0);
  store.del(SESK);
  view = "result"; render(); toTop();
}

/* ---------- result ---------- */
function viewResult() {
  const total = S.items.length, right = rightCount();
  const pct = Math.round((right / total) * 100);
  const wrong = S.items.map(function (it, k) { return { it: it, k: k }; }).filter(x => S.pick[x.k] !== 0);

  const dmap = {};
  S.items.forEach(function (it, k) {
    const d = qOf(it).domain;
    if (!dmap[d]) dmap[d] = { r: 0, n: 0 };
    dmap[d].n++;
    if (S.pick[k] === 0) dmap[d].r++;
  });
  const doms = Object.keys(dmap).map(d => [d, dmap[d]])
    .sort((a, b) => (a[1].r / a[1].n) - (b[1].r / b[1].n) || b[1].n - a[1].n);

  bar.innerHTML = '<div class="mark">CCDVF <span>/</span> 채점</div><div class="bar-sp"></div>' +
    '<button class="ghost" id="home">홈으로</button>';
  rail.style.width = "100%";

  root.innerHTML =
    '<section class="score">' +
      '<div class="big">' + pct + "<s>%</s></div>" +
      '<div class="meta"><b>' + right + " / " + total + "</b><span>정답</span></div>" +
      '<div class="meta"><b>' + clock(S.el) + "</b><span>소요 시간</span></div>" +
      '<div class="meta"><b>' + (SCOPES[S.scope] ? SCOPES[S.scope].name : "선택 범위") + "</b><span>" +
        (S.mode === "instant" ? "바로 해설" : "시험 모드") + "</span></div>" +
    "</section>" +

    '<section class="block"><h3>도메인별 결과 <em>정답률 낮은 순</em></h3><div class="doms">' +
      doms.map(function (e) {
        const p = Math.round((e[1].r / e[1].n) * 100);
        return '<div class="domrow' + (p < 100 ? " bad" : "") + '"><div class="n">' + esc(e[0]) + "</div>" +
          '<div class="v">' + e[1].r + "/" + e[1].n + " · " + p + "%</div>" +
          '<div class="b"><i style="width:' + p + '%"></i></div></div>';
      }).join("") +
    "</div></section>" +

    (wrong.length
      ? '<section class="block"><h3>다시 볼 문항 <em>' + wrong.length + "개 · 펼치면 해설</em></h3><div>" +
        wrong.map(function (x) {
          const q = qOf(x.it), p = S.pick[x.k];
          return '<details class="rev"><summary><b>' + (p === null ? "무응답" : "오답") + "</b>" +
            '<span class="s">' + fmt(q.q.split("\n")[0]) + "</span></summary>" +
            '<div class="rev-body">' +
              '<div class="chip dom" style="align-self:flex-start">' + esc(q.domain) + "</div>" +
              '<p class="qtext">' + fmt(q.q) + "</p>" +
              '<div class="pick">' +
                (p === null ? "" : '<div class="y"><b>내 선택</b><span>' + fmt(q.opts[p]) + "</span></div>") +
                '<div class="c"><b>정답</b><span>' + fmt(q.opts[0]) + "</span></div>" +
              "</div>" +
              '<div class="sec"><h4>정답 해설</h4><p>' + fmt(q.why) + "</p></div>" +
              '<div class="sec"><h4>헷갈리기 쉬운 함정</h4><p>' + fmt(relabel(q.trap, q, x.it)) + "</p></div>" +
              '<div class="memo"><h4>암기 문장</h4><p>' + fmt(q.memo) + "</p></div>" +
            "</div></details>";
        }).join("") + "</div></section>"
      : '<section class="block"><h3>틀린 문항이 없습니다. 범위를 넓혀 다시 도전해 보세요.</h3></section>') +

    '<div class="act"><div class="act-in">' +
      (wrong.length ? '<button class="cta" id="again">오답만 다시 풀기</button>' : "") +
      '<button class="cta' + (wrong.length ? " sec" : "") + '" id="reshuffle">새로 섞어 다시</button>' +
    "</div></div>";

  bar.querySelector("#home").addEventListener("click", function () { view = "home"; render(); toTop(); });
  const ag = root.querySelector("#again");
  if (ag) ag.addEventListener("click", function () {
    const pool = wrong.map(x => x.it.i);
    setup.count = "all";
    S = buildSession(pool, S.mode, S.scope);
    saveSession(); view = "quiz"; render(); toTop();
  });
  root.querySelector("#reshuffle").addEventListener("click", function () {
    const pool = S.items.map(it => it.i);
    setup.count = "all";
    S = buildSession(pool, S.mode, S.scope);
    saveSession(); view = "quiz"; render(); toTop();
  });
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", function (e) {
  if (view !== "quiz" || e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key.toLowerCase();
  let pos = "abcd".indexOf(key);
  if (pos < 0) pos = "1234".indexOf(key);
  if (pos >= 0) {
    const b = root.querySelectorAll(".opt")[pos];
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
    return;
  }
  if (key === "n" || key === "enter") {
    const b = root.querySelector("#next");
    if (b) { e.preventDefault(); b.click(); }
  } else if (key === "p") {
    const b = root.querySelector("#prev");
    if (b) { e.preventDefault(); b.click(); }
  }
});
window.addEventListener("beforeunload", saveSession);
document.addEventListener("visibilitychange", function () { if (document.hidden) saveSession(); });

render();
</script>

</body>
</html>
