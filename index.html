budgets, validate outputs against a defined schema before passing them forward, and establish explicit handoff contracts between stages.", "Have each subagent retry its own failed tool call before raising an error, and write every call and output to one shared trace the team can review later for repeats and conflicts.", "Allow each subagent to read what the others produced, so disagreements are settled directly between them instead of going back through the primary agent.", "Merge the three subagents into one model call with a large context window that performs retrieval, grading, and writing in a single pass."], "ol": ["C", "A", "B", "D"], "why": "중복 호출, 예산 초과, 모순 출력은 모두 실행 중에 통제해야 하는 문제이므로 상위 관리 계층인 프라이머리 에이전트를 강화해야 합니다. 서브에이전트별 툴 예산을 강제하고 단계 간 인계 규격을 명시한 뒤, 다음 단계로 넘기기 전에 스키마 검증을 거치면 모순된 정보의 전파가 차단됩니다. 문헌 검토라는 상황만 바뀌었을 뿐 매니저 패턴 거버넌스라는 판단 기준은 같습니다.", "trap": "A (Post-hoc audit and retry): 재시도와 사후 로그 검토는 실행 중 벌어지는 중복·초과·모순을 실시간으로 막지 못합니다. B (Peer-to-peer bypass): 서브에이전트끼리 직접 참조하게 하면 매니저 거버넌스가 무너지고 컨텍스트 오염과 복잡도가 커집니다. D (Architecture collapse): 단일 호출로 합치는 것은 멀티 에이전트 모듈화의 이점을 통째로 버리는 접근입니다. → 판단 기준: 상위 관리 계층이 예산·인계 규격·전달 전 검증을 런타임에 강제하는가.", "memo": "여러 하위 실행 단위를 조율해야 할 때는 상위 관리 계층에서 예산과 인계 규격을 강제하고 넘기기 전에 검증한다.", "uid": "B35", "ko": "한 제약사가 임상 문헌 검토용 다중 에이전트 시스템을 운영한다. 주 에이전트가 연구 질문을 분해해 논문 수집·근거 등급·요약 작성 세 전문 서브에이전트에 위임한다. 프로덕션에서 서브에이전트들이 같은 도구 호출을 반복하고, 때때로 토큰 한도를 넘기며, 서로 어긋나는 요약을 반환하는데, 주 에이전트가 아무 검증 없이 그대로 전달한다. 이 실패들을 다루는 가장 적절한 방법은 무엇인가?"}, {"n": 36, "src": "응용문제2", "a": 2, "tag": "Claude API / Streaming Responses", "stem": "A city agency is building a Claude helpdesk that answers residents' questions about housing benefits in a chat window. The product owner wants the answer text to appear on screen while it is still being written, rather than arriving in one block once the response is complete. The Claude API mechanism you would use is...", "opts": ["streaming responses, which deliver tokens incrementally as the model generates them so residents see output progressively.", "structured JSON output, which sends the reply only once the model has settled the full JSON shape, so nothing appears while the answer is still forming.", "the batch API, which collects requests and returns whole answers after a wait, and is meant for offline work rather than a live chat window.", "prompt caching, which cuts the price of repeated input prefixes but leaves the timing of the reply on screen unchanged."], "ol": ["B", "A", "C", "D"], "why": "스트리밍은 모델이 토큰을 만들어 내는 즉시 서버 전송 이벤트로 클라이언트에 증분 전달합니다. 그래서 주민은 응답이 끝나기를 기다리지 않고 답변이 채워지는 과정을 그대로 보게 됩니다. 공공 민원 창구라는 상황만 달라졌을 뿐, 완료 전 증분 전달이라는 판단 기준은 원본과 같습니다.", "trap": "A (Complete-then-deliver): 구조화 JSON 출력은 전체 응답이 완결된 뒤 전달되므로 실시간 점진 표시와 맞지 않습니다. C (Async batch latency): 배치 API는 대량 비대화형 작업을 위한 지연 처리 방식입니다. D (Input cost optimization): 프롬프트 캐싱은 입력 비용을 줄이는 기능이지 출력 전달 시점을 바꾸지 않습니다. → 판단 기준: 생성 중인 토큰을 완료 전에 증분으로 전달하는 메커니즘인가.", "memo": "생성되는 즉시 결과를 사용자에게 보여줘야 할 때는 증분 전달 방식을 사용한다.", "uid": "B36", "ko": "한 시 기관이 주민의 주거 급여 문의에 채팅으로 답하는 Claude 헬프데스크를 만들고 있다. 제품 책임자는 응답이 완성된 뒤 한 덩어리로 도착하는 대신, 작성되는 동안 화면에 글자가 나타나길 원한다. 어떤 Claude API 메커니즘을 쓰겠는가?"}, {"n": 37, "src": "응용문제2", "a": 1, "tag": "Agent Architecture / Session State Lifecycle", "stem": "A private bank is building a Claude assistant that advisors use across multi-turn conversations with clients. Compliance asks how the assistant will manage session lifecycle: when a session should end, how stored state is cleared, and how details from one client's conversation are kept out of the next one. How would you design session lifecycle?", "opts": ["Define explicit session expiration rules, state reset triggers, and rules for starting fresh sessions so stale context does not leak into new client conversations.", "Set expiration rules for sessions, then depend on each advisor to open a new conversation whenever clean context is wanted, since the assistant runs no reset by itself.", "Apply one short timeout to every conversation and treat that timeout alone as the complete session lifecycle design for the assistant.", "Tie state resets to certain application events but run them globally for all sessions at once, without any expiration rule for an individual session."], "ol": ["D", "A", "B", "C"], "why": "만료 규칙, 상태 리셋 트리거, 새 세션 시작 규칙 세 가지를 모두 명시적으로 정의해야 이전 대화의 잔여 맥락이 다음 대화로 새지 않습니다. 하나라도 빠지면 오래된 컨텍스트가 남아 다른 고객 상담을 오염시킬 수 있습니다. 금융 자문이라는 상황만 바뀌었을 뿐 판단 기준은 원본과 동일합니다.", "trap": "A (User-dependent reset): 리셋을 상담사 판단에만 맡기면 이전 맥락 오염을 사전에 막을 수 없습니다. B (Single timeout only): 일률적인 타임아웃 하나만으로는 이벤트나 조건에 따른 상태 리셋을 지원하지 못합니다. C (Global-only triggers): 전역 트리거만 두고 세션별 만료 규칙이 없으면 개별 세션 관리가 되지 않습니다. → 판단 기준: 만료 규칙·리셋 트리거·새 세션 시작 규칙 세 가지를 모두 명시적으로 정의했는가.", "memo": "이전 상태가 다음 실행으로 새면 안 될 때는 만료·리셋·재시작 규칙을 명시적으로 정의한다.", "uid": "B37", "ko": "한 프라이빗 뱅크가 자문역이 고객과 다중 턴 대화에 사용하는 Claude 어시스턴트를 만들고 있다. 컴플라이언스 부서가 세션 수명 주기 관리 방식을 묻는다 — 세션은 언제 끝나고, 저장된 상태는 어떻게 지워지며, 한 고객의 대화 내용이 다음 고객에게 넘어가지 않게 어떻게 막는가. 세션 수명 주기를 어떻게 설계하겠는가?"}, {"n": 38, "src": "응용문제2", "a": 2, "tag": "Claude SDK / Transient Error Retries", "stem": "An engineer who maintains a freight shipment tracking service asks what the Claude SDK does when a call meets a short network drop or a brief rate-limit response. She wants to know whether her service must catch every transient error itself, or whether the SDK already does something on its own. How would you describe the SDK's default behavior?", "opts": ["The SDK provides default retry behavior for many transient errors, and the application code can configure or extend that behavior as needed.", "The SDK retries network errors on its own but returns rate-limit responses straight to the service, which then has to write its own retry logic for those calls.", "The SDK writes transient errors to a default error stream and moves on without any retry, so the service must detect failed calls and decide what to do.", "The SDK retries transient errors a fixed number of times, and the service cannot change that retry count."], "ol": ["B", "A", "C", "D"], "why": "SDK는 네트워크 오류, 5xx, 429 레이트 리밋 같은 일시적 오류에 대해 지수 백오프 기반의 기본 재시도를 이미 제공합니다. 동시에 재시도 횟수 등은 고정이 아니라 애플리케이션이 설정하거나 확장할 수 있습니다. 물류 추적이라는 상황만 달라졌을 뿐, 기본 제공과 설정 가능성 두 조건을 모두 만족해야 정답이라는 기준은 같습니다.", "trap": "A (Partial retry coverage): SDK는 네트워크 오류뿐 아니라 429 레이트 리밋 응답에도 기본 재시도를 제공합니다. C (Log without retry): SDK는 재시도 없이 로그만 남기고 넘어가지 않습니다. D (Fixed non-configurable): 재시도 횟수와 백오프 동작은 maxRetries 같은 옵션으로 변경할 수 있으므로 고정이라는 설명은 틀립니다. → 판단 기준: 기본 재시도가 제공되면서 동시에 설정·확장이 가능하다고 설명하는가.", "memo": "일시적 오류를 다뤄야 할 때는 SDK의 기본 재시도를 활용하되 필요에 맞게 설정을 조정한다.", "uid": "B38", "ko": "화물 추적 서비스를 관리하는 엔지니어가, 호출이 짧은 네트워크 끊김이나 일시적 레이트 리밋을 만났을 때 Claude SDK가 무엇을 하는지 묻는다. 자기 서비스가 모든 일시적 오류를 직접 잡아야 하는지, 아니면 SDK가 이미 무언가 해주는지 알고 싶어 한다. SDK의 기본 동작을 어떻게 설명하겠는가?"}, {"n": 39, "src": "응용문제2", "a": 3, "tag": "Claude Code / Project-Scoped Settings", "stem": "A hospital IT group is adopting Claude Code for the repository behind its clinical scheduling system. Permissions, the default model choice, and environment-specific behavior must come out the same for every engineer who checks the repository out, without anyone setting things up by hand. The Claude Code mechanism you would use is...", "opts": ["the settings.json file, scoped at the project level so the configuration applies consistently across engineers and persists with the repository.", "a system prompt that each engineer pastes at the start of every Claude Code session while working on the scheduling system.", "a shared wiki page that lists the configuration values for team members to read and update by hand as the project changes.", "environment variables that each engineer sets on their own laptop before using Claude Code in the repository."], "ol": ["C", "A", "B", "D"], "why": "프로젝트 루트의 settings.json은 저장소와 함께 버전 관리되므로 체크아웃하는 모든 엔지니어에게 동일한 권한과 모델 정책이 자동으로 적용됩니다. 개인이 매번 손으로 맞추지 않아도 팀 전체 설정이 일관되게 유지됩니다. 병원 IT라는 상황만 바뀌었을 뿐 판단 기준은 원본과 같습니다.", "trap": "A (Per-session prompt): 세션마다 개인이 프롬프트로 붙여 넣는 방식은 누락되기 쉽고 권한 강제력이 없습니다. B (Manual documentation): 문서로 수동 관리하면 설정 누락과 환경 불일치가 발생합니다. D (Local machine environment): 개인 로컬 환경 변수에만 의존하면 팀 표준화와 형상 관리가 불가능합니다. → 판단 기준: 저장소와 함께 관리되어 모든 개발자에게 자동 적용되는 프로젝트 범위 설정 파일인가.", "memo": "팀 전체에 동일한 설정을 강제해야 할 때는 저장소에 함께 관리되는 프로젝트 범위 설정 파일을 사용한다.", "uid": "B39", "ko": "한 병원 IT 그룹이 임상 일정 시스템 저장소에 Claude Code를 도입한다. 권한, 기본 모델 선택, 환경별 동작이 저장소를 체크아웃하는 모든 엔지니어에게 동일하게 적용되어야 하고, 아무도 수동 설정을 하지 않아야 한다. 어떤 Claude Code 메커니즘을 쓰겠는가?"}, {"n": 40, "src": "응용문제2", "a": 7, "tag": "Security / Secrets Management", "stem": "An energy utility is launching a Claude service that calls several external systems, including a weather feed, a metering platform, and a billing gateway, each with its own API key. What is the best way to store the keys?", "opts": ["Store the keys in a secrets manager or environment-specific configuration that is not checked into source code, and load them at runtime.", "Issue one key that works for the weather feed, the metering platform, and the billing gateway, so any engineer on the team can locate it quickly while building the service.", "Send the keys over chat to engineers when they ask, and have each person paste them into a local file before starting work on the service.", "Write the keys into the service's configuration file and commit that file to the utility's repository together with the rest of the code."], "ol": ["B", "A", "C", "D"], "why": "API 키는 소스 저장소에 절대 포함하지 말고 시크릿 매니저나 버전 관리에서 제외된 환경별 설정에 보관해야 합니다. 애플리케이션은 실행 시점에 그 값을 안전하게 불러오면 됩니다. 에너지 유틸리티라는 상황만 달라졌을 뿐, 소스 밖 보관과 런타임 로드라는 판단 기준은 원본과 같습니다.", "trap": "A (Shared single credential): 모든 외부 시스템에 하나의 키를 공유하면 최소 권한 원칙에 어긋나고 유출 피해가 커집니다. C (Plaintext manual distribution): 키를 평문으로 전달하고 사람이 붙여 넣게 하는 방식은 유출 위험이 큽니다. D (Committed to repository): 설정 파일에 키를 넣고 저장소에 커밋하는 것은 가장 전형적인 보안 사고 원인입니다. → 판단 기준: 키를 소스에 두지 않고 시크릿 저장소나 환경별 설정에 두어 런타임에 로드하는가.", "memo": "비밀 값을 다뤄야 할 때는 소스에 두지 말고 외부 시크릿 저장소에서 실행 시점에 불러온다.", "uid": "B40", "ko": "한 전력 회사가 기상 피드·계량 플랫폼·청구 게이트웨이 등 각각 자체 API 키를 가진 여러 외부 시스템을 호출하는 Claude 서비스를 출시한다. 키를 저장하는 가장 좋은 방법은 무엇인가?"}, {"n": 41, "src": "응용문제2", "a": 2, "tag": "Deployment / Data Residency Compliance", "stem": "A genomics institute plans to deploy a Claude agent that works with patient sequencing data. National rules require that this data stay inside the institute's own cloud tenancy, yet the research team wants to launch soon and would rather not run infrastructure of its own. Which deployment model would you recommend?", "opts": ["Self-hosting under BYOC to satisfy the data residency requirement, while working with the infrastructure team to reduce the operational overhead of managing the deployment.", "Launching on Anthropic-hosted infrastructure while the institute prepares a request to amend the residency rule so hosted AI services become allowed.", "Launching on Anthropic-hosted infrastructure to hit the planned release date, and recording the residency rule as an item for a compliance review after launch.", "Running under BYOC for a first pilot, then deciding whether to move to Anthropic-hosted infrastructure once the agent's data handling is better understood."], "ol": ["B", "A", "C", "D"], "why": "데이터 상주성 규정은 타협 대상이 아니므로 데이터가 자사 클라우드를 벗어나지 않는 셀프 호스팅(BYOC)을 선택해야 합니다. 빠른 출시 요구는 규정을 미루는 방식이 아니라 인프라 팀과 협업해 운영 부담을 줄여 해결합니다. 유전체 연구라는 상황만 바뀌었을 뿐 판단 기준은 원본과 동일합니다.", "trap": "A (Bend the policy): 규정 자체를 바꿔 달라고 요청하면서 먼저 배포하는 것은 컴플라이언스 위반을 감수하는 선택입니다. C (Defer compliance review): 출시 일정 때문에 상주성 검토를 사후로 미루는 것은 규정 준수를 뒤로 미루는 것입니다. D (Migrate away from compliance): 파일럿만 BYOC로 하고 나중에 호스팅으로 옮기는 것은 규정 준수 방향과 역행합니다. → 판단 기준: 규정을 만족하는 배포 방식을 택하고 속도 문제는 운영 부담 완화로 푸는가.", "memo": "규정 요구와 속도 요구가 충돌할 때는 규정을 만족하는 방식을 택하고 속도는 운영 부담 완화로 해결한다.", "uid": "B41", "ko": "한 유전체 연구소가 환자 시퀀싱 데이터를 다루는 Claude 에이전트를 배포하려 한다. 국가 규정상 이 데이터는 연구소 자체 클라우드 테넌시 안에 머물러야 하지만, 연구팀은 빨리 출시하고 싶고 인프라를 직접 운영하고 싶어 하지 않는다. 어떤 배포 모델을 권하겠는가?"}, {"n": 42, "src": "응용문제2", "a": 2, "tag": "Structured Output / Schema Validation", "stem": "An auto parts marketplace uses Claude to convert supplier spec sheets into JSON records for its product catalog. The record format is already agreed on, and the catalog pipeline rejects any record whose JSON does not match that format. Your application design would...", "opts": ["define a clear schema, structure the prompt to request output in that schema, and validate Claude's output against the schema before passing it to the catalog pipeline.", "state the record format in the prompt so Claude returns it, then rely on the catalog pipeline to run whatever checking is required on the result.", "use plain text answers instead of a fixed record format, because free text can describe any supplier sheet and needs no strict shape.", "describe the wanted format in ordinary English inside the prompt and let the catalog pipeline parse whatever shape comes back."], "ol": ["A", "B", "C", "D"], "why": "기대하는 스키마를 명확히 정의하고 프롬프트로 그 규격에 맞춰 응답하도록 요청한 뒤, 하위로 넘기기 전에 애플리케이션 단에서 스키마 검증까지 수행하는 3단계가 모두 갖춰져야 합니다. 검증을 생략하거나 하위 파이프라인에 떠넘기면 깨진 JSON이 그대로 흘러갑니다. 부품 카탈로그라는 상황만 바뀌었을 뿐 판단 기준은 원본과 같습니다.", "trap": "B (Downstream validation deferral): 검증 책임을 카탈로그 파이프라인으로 미루면 깨진 JSON이 하위 오류로 이어집니다. C (Free-form output): 구조화 JSON이 필요한 상황에서 비정형 텍스트를 쓰는 것은 요구사항에 역행합니다. D (Informal schema description): 자연어로만 형식을 설명하고 알아서 파싱하게 두면 스키마 불일치 오류가 반복됩니다. → 판단 기준: 스키마 정의와 프롬프트 요청에 더해 전달 전 자체 검증까지 수행하는가.", "memo": "정해진 형식의 출력이 필요할 때는 규격을 명시해 요청하고 전달 전에 직접 검증한다.", "uid": "B42", "ko": "한 자동차 부품 마켓플레이스가 Claude로 공급사 사양서를 제품 카탈로그용 JSON 기록으로 변환한다. 기록 형식은 이미 합의되어 있고, 카탈로그 파이프라인은 그 형식에 맞지 않는 JSON 기록을 전부 거부한다. 애플리케이션 설계를 어떻게 하겠는가?"}, {"n": 43, "src": "응용문제2", "a": 3, "tag": "Claude Code / Headless CI Automation", "stem": "A telecom operator runs a nightly automation job that asks Claude Code to carry out a fixed list of maintenance tasks on its network configuration repository. Nobody watches the job while it runs, so it must never stop for an approval, and the results have to be saved for a later reporting step. How would you configure the pipeline?", "opts": ["Run Claude Code in headless mode with the required permissions configured in settings.json and capture its output for the reporting step.", "Turn off Claude Code's approval prompts for every environment the operator uses, so no prompt can hold up the nightly job.", "Run Claude Code in interactive mode and have an on-call engineer approve each prompt by hand while the nightly job works through its tasks.", "Move the job to another tool that never asks for approval, so no permission setup is needed at all."], "ol": ["C", "A", "B", "D"], "why": "사람이 지켜보지 않는 자동화에서는 대화형 프롬프트를 피하기 위해 Claude Code를 헤드리스 모드로 실행합니다. 필요한 권한은 settings.json에 미리 한정해 정의해 두어야 승인 요청으로 작업이 멈추지 않고, 출력은 후속 리포팅 단계로 넘기면 됩니다. 통신사 야간 작업이라는 상황만 달라졌을 뿐 판단 기준은 원본과 같습니다.", "trap": "A (Global permission bypass): 모든 환경에서 승인 프롬프트를 끄는 것은 로컬 개발 환경까지 위험에 노출시킵니다. B (Manual approval in CI): 야간 자동화에서 사람이 매번 승인하는 것은 자동화의 목적 자체를 없앱니다. D (Unnecessary tool replacement): 권한 설정만 하면 되는 일로 도구를 교체하는 것은 불합리한 해결책입니다. → 판단 기준: 비대화형 헤드리스 모드로 실행하되 권한은 설정 파일에 미리 한정해 두는가.", "memo": "사람 개입 없이 자동 실행해야 할 때는 비대화형 모드로 돌리고 권한은 설정 파일에 미리 한정해 둔다.", "uid": "B43", "ko": "한 통신사가 매일 밤 Claude Code에 네트워크 구성 저장소의 정해진 유지보수 작업 목록을 수행시키는 자동화 작업을 돌린다. 실행 중 아무도 지켜보지 않으므로 승인 대기로 멈춰서는 안 되고, 결과는 이후 리포팅 단계를 위해 저장되어야 한다. 파이프라인을 어떻게 구성하겠는가?"}, {"n": 44, "src": "응용문제2", "a": 8, "tag": "Extensibility / Skills vs MCP Servers", "stem": "A quality engineer at a manufacturing plant wants to share a defect-report capability with the other plants in the group and asks whether it should be built as a Skill or as an MCP server. The engineer believes the two are simply different names for one mechanism. How would you explain the distinction?", "opts": ["A Skill bundles prompts, scripts, and data into a package the model loads as a unit, while an MCP server exposes resources, tools, and prompts through a standard client interface.", "A Skill is the better choice for sharing across plants because it starts with less loading overhead than an MCP server when many sites run inspections at the same time.", "A Skill and an MCP server are two labels for one extension point, so the group can pick either one whenever a capability has to be shared between plants.", "A Skill belongs to an earlier generation of tooling and an MCP server replaced it, so every new shared capability the group builds should be an MCP server."], "ol": ["A", "B", "C", "D"], "why": "두 확장 메커니즘은 성능이나 출시 시점이 아니라 구조적 정의로 구분됩니다. Skill은 프롬프트·스크립트·데이터를 하나의 패키지로 묶어 모델이 단일 단위로 로드하는 형태이고, MCP 서버는 표준 클라이언트 인터페이스를 통해 리소스·툴·프롬프트를 노출하는 클라이언트-서버 구조입니다. 제조 공장 사례로 상황만 바뀌었을 뿐, 아키텍처적 차이를 정확히 설명할 수 있는지를 묻는 기준은 원본과 같습니다.", "trap": "B (Performance-based framing): 로드 효율이나 성능 비교로 설명하는 것은 두 메커니즘의 구동 방식 차이를 설명하지 못합니다. C (Interchangeable equivalence): 완전히 교체 가능한 동의어가 아니며 각각 구조와 적합한 유스케이스가 구분됩니다. D (Legacy versus successor): 신구 기술의 대체 관계가 아니라 목적에 따라 함께 쓰이는 서로 다른 아키텍처 도구입니다. → 판단 기준: 성능이나 출시 순서가 아니라 '패키지 단위 로드'와 '표준 인터페이스를 통한 노출'이라는 구조적 정의로 구분하는가.", "memo": "두 확장 방식 중 무엇을 고를지 판단해야 할 때는 성능이나 신구 여부가 아니라 각각의 구조적 정의와 동작 방식의 차이를 기준으로 삼는다.", "uid": "B44", "ko": "한 제조 공장의 품질 엔지니어가 불량 보고 기능을 그룹 내 다른 공장들과 공유하려 하는데, 이를 Skill로 만들지 MCP 서버로 만들지 묻는다. 그 엔지니어는 둘이 그냥 같은 메커니즘의 다른 이름이라고 생각한다. 차이를 어떻게 설명하겠는가?"}, {"n": 45, "src": "응용문제2", "a": 5, "tag": "LLM Fundamentals / Non-determinism", "stem": "A logistics operations manager notices that asking Claude to summarize the same shipment delay report twice returns wording that is not identical, and concludes that the tracking application is broken. How would you address the manager's concern?", "opts": ["Explain that LLMs are non-deterministic by default due to sampling, and describe how the application handles this through validation, retries, or temperature adjustment.", "Tell the manager that the differences come from slow links between the warehouse systems, and that a faster connection will return the same summary text on every run.", "Tell the manager that the differing wording is a defect in the tracking application, open a work ticket, and promise the team will remove it in the next release.", "Tell the manager that the wording shifts because Anthropic keeps updating Claude, and that locking the application to one fixed model version will remove the variation completely."], "ol": ["D", "A", "B", "C"], "why": "같은 입력에 대한 출력 변동은 토큰 샘플링에서 오는 LLM의 기본 특성이며 제거 대상 버그가 아닙니다. 검증, 재시도, temperature 조정 같은 애플리케이션 계층의 통제로 관리한다고 설명하는 것이 정답입니다. 물류 배송 지연 보고 사례로 상황만 바뀌었고, '본질적 특성 대 버그'를 구분하는 판단 기준은 원본과 같습니다.", "trap": "A (Infrastructure misattribution): 네트워크 속도나 지연 시간은 출력 변동성의 원인이 아닙니다. B (Bug misclassification): 확률적 생성 특성을 코드 결함으로 분류하고 티켓을 여는 것은 잘못된 진단입니다. C (Version pinning fix): 모델 버전을 고정해도 샘플링에 의한 변동은 완전히 사라지지 않습니다. → 판단 기준: 변동을 제거해야 할 결함으로 보는가, 아니면 모델의 기본 특성으로 인정하고 애플리케이션 통제로 관리하는가.", "memo": "모델의 본질적 특성으로 인한 현상을 다뤄야 할 때는 그것을 제거하려 하지 말고 애플리케이션 계층의 통제 장치로 관리한다.", "uid": "B45", "ko": "한 물류 운영 관리자가 같은 배송 지연 보고서를 Claude에 두 번 요약시켰더니 표현이 똑같지 않다는 것을 발견하고, 추적 애플리케이션이 고장 났다고 결론 내렸다. 이 우려에 어떻게 대응하겠는가?"}, {"n": 46, "src": "응용문제2", "a": 1, "tag": "Agent Architecture / Workflow Patterns", "stem": "You are designing an agent for an academic journal's manuscript screening workflow. Each manuscript passes through reference extraction, methodology evaluation, and an accept-or-reject decision. The three subtasks have separate success criteria, and some manuscripts must return from methodology evaluation to reference extraction before a decision can be made. Which agent pattern would you apply?", "opts": ["A graph-based pattern that lets the agent move between subtasks based on the state of each manuscript, with each subtask evaluated against its own criteria.", "A single tool-use loop in which one agent holds every tool for reference extraction, methodology evaluation, and the decision, and works through them in one continuous run.", "A linear chain that sends each manuscript through reference extraction, then methodology evaluation, then the decision step, with no route back to an earlier subtask.", "A streaming pattern that sends partial decisions to the editor while the agent works, and keeps improving the text until a final decision appears at the end."], "ol": ["B", "A", "C", "D"], "why": "단계 간 복귀 경로와 조건부 분기가 필요하고 각 단계마다 독립적인 성공 기준이 있으므로 상태에 따라 노드 사이를 이동하는 그래프 기반 패턴이 맞습니다. 논문 심사 워크플로우로 사례만 바뀌었을 뿐, '반복 + 분기 + 노드별 검증'이 요구되면 그래프 구조를 고른다는 판단 기준은 원본과 동일합니다.", "trap": "A (Single undifferentiated loop): 모든 툴을 단일 에이전트에 몰아넣으면 단계별 책임 분리와 상태 제어가 어렵습니다. C (Fixed linear sequence): 선형 체인은 이전 단계로 되돌아가는 복귀 경로를 지원하지 못합니다. D (Output delivery mechanism): 스트리밍은 출력 전달 방식일 뿐 반복적 태스크 오케스트레이션 패턴이 아닙니다. → 판단 기준: 고정된 순서로 흘려보내는가, 아니면 상태에 따라 서브태스크 사이를 오가며 각 단계를 개별 기준으로 검증하는가.", "memo": "단계 간 되돌아가는 반복과 조건부 분기가 필요할 때는 고정된 순서가 아니라 상태에 따라 이동하는 그래프 구조를 사용한다.", "uid": "B46", "ko": "한 학술지의 원고 심사 워크플로우용 에이전트를 설계하고 있다. 각 원고는 참고문헌 추출 → 방법론 평가 → 게재 여부 결정을 거친다. 세 하위 작업은 성공 기준이 각각 다르고, 일부 원고는 결정에 이르기 전에 방법론 평가에서 참고문헌 추출로 되돌아가야 한다. 어떤 에이전트 패턴을 적용하겠는가?"}, {"n": 47, "src": "응용문제2", "a": 6, "tag": "Context Engineering / Context Isolation", "stem": "You are building a multi-step Claude workflow for a city government's civil complaint desk, where the redaction step and the routing step must reason without reading everything the earlier steps discussed. The team wants each step to see only its own material. The context engineering technique you would use is...", "opts": ["context isolation through subagents or multi-step agentic workflows that scope each step's context to only what the step needs.", "one shared prompt applied to every step of the complaint workflow, with the same wording used no matter which part of the case that step is handling.", "placing the complete record of the earlier steps into every step, even when a step does not need that record for its own reasoning.", "adding as much related case material as possible at each step, so every step can read the entire complaint history while it reasons."], "ol": ["C", "A", "B", "D"], "why": "각 단계가 자신에게 필요한 정보만 보도록 컨텍스트 스코프를 제한하는 컨텍스트 격리가 정답입니다. 서브에이전트나 다단계 워크플로우로 범위를 나누면 불필요한 이전 이력에서 오는 노이즈와 편향을 막을 수 있습니다. 민원 처리 데스크로 상황만 바뀌었고 판단 기준은 원본과 같습니다.", "trap": "A (Single global prompt): 모든 단계에 동일한 전역 프롬프트를 적용하면 단계별 컨텍스트 통제가 불가능합니다. B (Full history injection): 필요 여부와 무관하게 전체 이력을 매 단계에 넣는 것은 격리의 목적과 정반대입니다. D (Maximal context augmentation): 가능한 모든 자료를 매 단계에 덧붙이는 것 역시 격리가 아니라 컨텍스트 확장입니다. → 판단 기준: 모든 단계가 같은 맥락을 공유하게 하는가, 아니면 각 단계에 필요한 최소 범위만 격리해 전달하는가.", "memo": "각 단계가 서로 다른 정보만 봐야 할 때는 모든 맥락을 공유하지 말고 단계별로 필요한 범위만 격리해서 전달한다.", "uid": "B47", "ko": "한 시청 민원 창구를 위한 다단계 Claude 워크플로우를 만들고 있다. 개인정보 마스킹 단계와 라우팅 단계는 앞 단계들이 다룬 내용 전부를 읽지 않은 채 추론해야 한다. 팀은 각 단계가 자기 자료만 보게 하려 한다. 어떤 컨텍스트 엔지니어링 기법을 쓰겠는가?"}, {"n": 48, "src": "응용문제2", "a": 2, "tag": "Change Management / Downstream Impact Assessment", "stem": "A bank is about to release updated prompt versions in the configuration of its credit risk screening platform. Several connected systems, including loan origination, fraud alerting, and regulatory reporting, consume the platform's output. The change passed the test environment, but no one has checked how it affects each connected system. What would you do before releasing the change?", "opts": ["Assess the configuration impact on each downstream system before rolling out, and coordinate with downstream system owners as needed.", "Record the new prompt versions in the platform release notes and ship the change, since a clean test environment run should already cover every connected system.", "Send the owners of the connected systems a message that a change is coming, book the release for next week, and run no formal review of the effect.", "Release the change only to the systems that took part in the test environment run, and postpone every other connected system to a later release cycle."], "ol": ["B", "A", "C", "D"], "why": "여러 하위 시스템이 의존하는 변경은 배포 전에 각 시스템에 대한 영향도 평가를 수행하고 소유자와 조율해야 합니다. 테스트 환경 통과나 일정 통보만으로는 하위 호환성이 검증되지 않습니다. 은행 신용 리스크 심사 플랫폼으로 상황만 바뀌었고 판단 기준은 원본과 같습니다.", "trap": "A (Staging as sufficient evidence): 테스트 환경 통과를 하위 시스템 영향도 검증으로 간주하고 배포를 강행하는 접근입니다. C (Notification without assessment): 영향도 평가 없이 통보만 하고 배포하면 하위 시스템 장애 위험이 그대로 남습니다. D (Partial scope deferral): 일부 시스템에만 제한 배포하고 나머지를 미루는 것은 영향도 분석을 대체하지 못합니다. → 판단 기준: 배포 전에 각 하위 시스템에 대한 영향도 평가와 소유자 조율을 수행하는가.", "memo": "여러 곳이 의존하는 변경을 적용해야 할 때는 통보나 부분 배포로 대체하지 말고 사전 영향도 평가와 이해관계자 조율을 먼저 수행한다.", "uid": "B48", "ko": "한 은행이 신용 리스크 선별 플랫폼의 구성에서 프롬프트 버전 갱신을 배포하려 한다. 대출 실행·사기 경보·규제 보고 등 여러 연결 시스템이 이 플랫폼의 출력을 소비한다. 변경은 테스트 환경을 통과했지만, 각 연결 시스템에 어떤 영향을 주는지는 아무도 확인하지 않았다. 배포 전에 무엇을 하겠는가?"}, {"n": 49, "src": "응용문제2", "a": 5, "tag": "Model Selection / Cost-Latency Tradeoff", "stem": "An online retailer needs to label millions of product reviews each day with one of a few simple tags. Each labeling decision is easy, the response time budget is tight, and the cost of a single request matters at this volume. Which model would you choose?", "opts": ["A smaller, faster Claude model, because the task is straightforward and the workload prioritizes latency and per-request cost at scale.", "A mid-tier Claude model as the standard pick, since a middle option offers a reasonable mix of quality and price for almost every review the retailer receives.", "The largest Claude model on offer, so each review tag is as accurate as it can be, even though every request costs more and returns more slowly.", "Several Claude models placed one after another, so each review passes through more than one model and the application merges the results into one tag."], "ol": ["C", "A", "B", "D"], "why": "작업이 단순하고 지연 시간과 건당 비용이 중요한 대량 워크로드에서는 더 작고 빠른 모델을 고르는 목적 적합 모델 선택이 정답입니다. 리뷰 태깅 사례로 상황만 바뀌었을 뿐, 요구 수준에 맞는 가장 가벼운 모델을 고른다는 판단 기준은 원본과 같습니다.", "trap": "A (Default mid-tier choice): 단순 작업에 중간급 모델을 기본값으로 두는 것은 대규모 처리에서 오버스펙입니다. B (Maximum capacity overkill): 최상위 모델은 지연과 비용이 커서 대량의 단순 분류에 부적합합니다. D (Serial model chaining): 여러 모델을 직렬로 거치면 지연과 비용이 배로 늘어 타이트한 응답 조건에 맞지 않습니다. → 판단 기준: 작업 난이도와 지연·비용 제약에 맞춰 가장 가벼운 모델을 고르는가, 아니면 무조건 높은 등급을 택하는가.", "memo": "작업이 단순하고 속도와 비용이 중요할 때는 성능이 가장 높은 선택지가 아니라 요구 수준에 맞는 가장 가벼운 선택지를 사용한다.", "uid": "B49", "ko": "한 온라인 소매업체가 매일 수백만 건의 제품 리뷰에 몇 가지 단순 태그 중 하나를 붙여야 한다. 각 태깅 판단은 쉽고, 응답 시간 예산이 빡빡하며, 이 물량에서는 요청 하나의 비용이 중요하다. 어떤 모델을 고르겠는가?"}, {"n": 50, "src": "응용문제2", "a": 4, "tag": "Observability / Root Cause Diagnosis", "stem": "A contract review assistant at a law firm performed well in testing, but it now sometimes reports clauses that do not appear in the uploaded contract. The engineering team already decided the model is hallucinating and asked you to look into it. What would you do first?", "opts": ["Examine production traces to identify whether the issue is hallucination by the model, context loss, prompt injection, or another failure mode before recommending a fix.", "Set up a retrieval layer over the clause library so answers stay tied to the source contract, and do this before reviewing any record of real runs.", "Add a line to the system prompt telling the model never to report a clause it cannot find, since a prompt edit is the quickest answer to invented content.", "Move the assistant onto a larger model because larger models are said to invent less, and treat that change as the fix for the reported behavior."], "ol": ["B", "A", "C", "D"], "why": "증상만 보고 원인을 단정한 상태이므로, 수정 조치를 적용하기 전에 프로덕션 트레이스를 분석해 환각인지 컨텍스트 손실인지 프롬프트 주입인지 근본 원인을 먼저 식별해야 합니다. 법률 계약서 검토 사례로 상황만 바뀌었고 판단 기준은 원본과 같습니다.", "trap": "A (Premature architectural fix): 원인 조사 없이 검색 기반 구조부터 도입하면 불필요한 아키텍처 공수가 발생합니다. C (Prompt-only instruction): 원인이 컨텍스트 손실이나 프롬프트 주입이면 시스템 프롬프트 문구 추가로 해결되지 않습니다. D (Model swap guess): 모델 교체는 원인 파악 없는 임시방편이며 비용과 지연만 늘립니다. → 판단 기준: 곧바로 수정 조치를 적용하는가, 아니면 실제 실행 기록을 분석해 근본 원인을 먼저 식별하는가.", "memo": "원인이 확정되지 않은 문제를 다뤄야 할 때는 곧바로 수정하지 말고 실제 실행 기록을 분석해 근본 원인을 먼저 식별한다.", "uid": "B50", "ko": "한 법무법인의 계약 검토 어시스턴트가 테스트에서는 잘 작동했는데, 지금은 업로드된 계약서에 없는 조항을 가끔 보고한다. 엔지니어링 팀은 이미 모델이 환각을 일으킨다고 결론 내리고 당신에게 조사를 요청했다. 가장 먼저 무엇을 하겠는가?"}, {"n": 51, "src": "응용문제2", "a": 8, "tag": "Tool Use / Pre-dispatch Schema Validation", "stem": "A utility company uses tool calling so Claude can look up outage records and open field work orders. The flow sometimes breaks because the model returns a tool_use block containing arguments that the schema does not define, and the application code does not deal with this case. How would you address this?", "opts": ["Validate the tool_use block's arguments against the tool schema before dispatching the tool and handle invalid arguments as a recognized error path.", "Write the invalid tool_use blocks to the log, still run the tool with them, and let the tool's own error reporting return the failure to the application.", "Send the same request again and again until the model finally returns a tool_use block whose arguments match the schema.", "Remove tool calling from the workflow and ask the model to write out in plain text what it would have done with the outage record."], "ol": ["B", "A", "C", "D"], "why": "툴을 실행하기 전에 tool_use 인자를 스키마와 대조해 검증하고, 유효하지 않으면 정식 오류 경로로 처리해 모델이 스스로 교정하도록 하는 것이 정답입니다. 전력 설비 장애 처리 사례로 상황만 바뀌었을 뿐, 사전 검증과 오류 경로 설계라는 판단 기준은 원본과 같습니다.", "trap": "A (Post-dispatch error handling): 잘못된 인자를 그대로 실행에 넘기면 실행 오류와 부작용이 발생합니다. C (Blind retry loop): 동일 요청을 무조건 재시도하면 무한 루프와 토큰 낭비로 이어집니다. D (Capability abandonment): 툴 호출 자체를 포기하는 것은 문제의 본질을 회피하는 선택입니다. → 판단 기준: 실행 전에 스키마와 대조해 검증하고 위반 시 정해진 오류 경로로 처리하는가.", "memo": "모델이 만든 입력으로 실제 동작을 실행해야 할 때는 실행 전에 규격과 대조해 검증하고 위반 시 정해진 오류 경로로 처리한다.", "uid": "B51", "ko": "한 공익사업체가 Claude가 정전 기록을 조회하고 현장 작업 지시를 개설할 수 있도록 도구 호출을 쓴다. 모델이 스키마에 정의되지 않은 인자가 담긴 tool_use 블록을 반환하는 경우가 있는데 애플리케이션 코드가 이를 처리하지 않아 흐름이 가끔 깨진다. 어떻게 해결하겠는가?"}, {"n": 52, "src": "응용문제2", "a": 8, "tag": "MCP / Transport Selection", "stem": "A genomics research lab is deciding between STDIO-based communication and HTTP-based communication for an MCP server. The server will be started by a Claude Code session running on the researcher's own workstation. Which communication pattern would you use?", "opts": ["STDIO because STDIO is well-suited to local process communication and avoids unnecessary network setup.", "HTTP polling against the MCP server, used in place of the transports that the MCP specification defines.", "STDIO and HTTP kept running at the same time as a backup measure, so the workstation carries two transports for one server.", "HTTP, on the view that HTTP is the better transport in every situation the lab could meet, whatever machine the server runs on."], "ol": ["A", "B", "C", "D"], "why": "클라이언트와 서버가 같은 머신에서 로컬 프로세스로 동작하므로 네트워크 포트 바인딩과 인증 설정이 필요 없는 STDIO가 맞습니다. 유전체 연구실 워크스테이션으로 상황만 바뀌었을 뿐, 배치 환경에 맞는 표준 전송 방식을 고른다는 판단 기준은 원본과 같습니다.", "trap": "B (Non-standard transport): HTTP 폴링은 MCP 표준 전송 패턴이 아닙니다. C (Redundant dual transport): 동일 로컬 세션에서 두 전송을 동시에 돌리는 것은 불필요한 복잡성만 만듭니다. D (Context-blind preference): 모든 환경에서 HTTP가 낫다는 주장은 로컬 실행 조건을 무시한 것입니다. → 판단 기준: 실행 주체가 로컬인지 원격인지에 맞는 표준 전송 방식을 고르는가.", "memo": "통신 방식을 골라야 할 때는 무조건 하나를 선호하지 말고 실행 주체가 로컬인지 원격인지에 맞는 표준 전송 방식을 사용한다.", "uid": "B52", "ko": "한 유전체 연구실이 MCP 서버에 STDIO 기반 통신과 HTTP 기반 통신 중 무엇을 쓸지 결정 중이다. 이 서버는 연구자 본인의 워크스테이션에서 실행되는 Claude Code 세션이 기동한다. 어떤 통신 방식을 쓰겠는가?"}, {"n": 53, "src": "응용문제2", "a": 6, "tag": "Prompt Engineering / Few-Shot Examples", "stem": "A hospital intake assistant summarizes patient intake forms well for ordinary cases but handles unusual ones poorly. The team has collected a set of unusual intake forms together with the summary that each one should produce. What is the best way to use these examples?", "opts": ["Add the labeled edge-case examples to the prompt as few-shot examples so the model can learn the pattern.", "Place a notice on the intake screen asking staff not to enter the unusual cases, so the difficult forms never reach the assistant at all.", "Store the examples in a search index so the application can look them up while the model is writing each summary.", "Train a custom model on the small set of labeled forms and put that model into production in place of the current Claude integration."], "ol": ["D", "A", "B", "C"], "why": "입력과 원하는 출력이 쌍으로 확보되어 있으므로, 이를 프롬프트에 퓨샷 예제로 직접 넣어 in-context learning으로 패턴을 익히게 하는 것이 정답입니다. 병원 인테이크 요약 사례로 상황만 바뀌었을 뿐, 별도 학습이나 검색 계층 대신 예제를 직접 제시한다는 판단 기준은 원본과 같습니다.", "trap": "A (Input avoidance workaround): 사용자가 에지 케이스를 입력하지 못하게 막는 것은 근본 해결책이 아닙니다. B (Retrieval indirection): 예제를 검색 계층에 넣는 것은 프롬프트 직접 주입보다 패턴 학습 효과가 떨어집니다. C (Custom model training): 소량 예제를 위한 커스텀 모델 학습은 비용과 시간이 큰 오버엔지니어링입니다. → 판단 기준: 이미 확보한 정답 예제를 프롬프트에 퓨샷으로 직접 제시하는가, 아니면 학습·검색 같은 우회 수단을 택하는가.", "memo": "원하는 입출력 예제를 이미 확보했을 때는 별도 학습이나 검색 계층을 두지 말고 프롬프트에 예제로 직접 제시한다.", "uid": "B53", "ko": "한 병원 접수 어시스턴트가 일반적인 경우에는 환자 접수 양식을 잘 요약하지만 특이한 경우는 잘 처리하지 못한다. 팀은 특이한 접수 양식들과 각각이 만들어야 할 요약을 모아두었다. 이 예시들을 쓰는 가장 좋은 방법은 무엇인가?"}];

/* ===== 영역 2: 애플리케이션 및 통합 33.1% — 최대 영역 ===== */
{id:"c22",a:2,type:"개념",en:"Messages API",ko:"기본 호출 방식",note:"stateless — 매 요청에 전체 대화 이력을 실어야 이전 턴을 안다."},
{id:"c23",a:2,type:"개념",en:"stateless",ko:"상태를 기억하지 않음",note:"서버가 이전 요청을 저장하지 않는다. 세션 유지는 클라이언트 책임."},
{id:"c24",a:2,type:"개념",en:"streaming",ko:"스트리밍",note:"답을 조각조각 실시간으로 받는다. 사용자가 기다리는 UI에 쓴다."},
{id:"c25",a:2,type:"개념",en:"Batch API",ko:"묶음 처리",note:"50% 절감 · 최대 24시간 · SLA 없음. 단일 요청 내 다단계 도구 호출 불가."},
{id:"c26",a:2,type:"개념",en:"blocking workflow",ko:"차단형 — 사람이 기다림",note:"실시간 API를 쓴다. 배치는 부적합."},
{id:"c27",a:2,type:"개념",en:"vision",ko:"이미지 입력",note:"이미지를 함께 보내 분석하게 한다."},
{id:"c28",a:2,type:"개념",en:"JSON",ko:"데이터 표기 형식",note:'{"키": "값"} 구조. 시스템 간 데이터 교환의 표준.'},
{id:"c29",a:2,type:"개념",en:"JSON schema",ko:"JSON의 형식 규칙서",note:"어떤 필드가 필수인지, 타입이 무엇인지 정의. tool_use와 함께 쓰면 구조를 강제한다."},
{id:"c30",a:2,type:"개념",en:"asynchronous programming",ko:"비동기 프로그래밍",note:"결과를 기다리지 않고 다음 일을 진행. 느린 API 호출을 여러 개 동시에 돌릴 때 쓴다."},
{id:"c31",a:2,type:"개념",en:"version control (Git)",ko:"버전 관리",note:"변경 이력을 저장·공유. 저장소에 커밋된 것만 팀이 받는다."},
{id:"c32",a:2,type:"개념",en:"SDLC",ko:"소프트웨어 개발 수명 주기",note:"요구사항 → 설계 → 구현 → 테스트 → 배포 → 운영. 어디에 Claude를 끼울지 묻는다."},
{id:"c33",a:2,type:"개념",en:"code review",ko:"코드 리뷰",note:"병합 전 사람이 검토. 자동 리뷰는 오탐 최소화가 핵심 과제."},
{id:"c34",a:2,type:"개념",en:"refactoring",ko:"리팩터링",note:"동작은 그대로 두고 구조만 개선. 대규모는 계획 먼저."},
{id:"c35",a:2,type:"개념",en:"functional vs infrastructure requirements",ko:"기능 요구 vs 인프라 요구",note:"무엇을 하는가 vs 얼마나 빠르고 안정적인가. 비즈니스 요구에서 둘 다 도출한다."},
{id:"c36",a:2,type:"개념",en:"content boundaries",ko:"콘텐츠 경계",note:"모델에 무엇을 넣고 무엇을 넣지 않을지의 선. 보안·프라이버시와 직결."},
{id:"c37",a:2,type:"개념",en:"session management",ko:"세션 관리",note:"대화 상태를 어디에 어떻게 보관할지. stateless API의 짝."},
{id:"c38",a:2,type:"개념",en:"schema design",ko:"스키마 설계",note:"필수·선택 필드, enum, nullable. 없는 정보는 nullable로 두어야 지어내지 않는다."},
{id:"c39",a:2,type:"개념",en:"plugin management",ko:"플러그인 관리",note:"확장 기능의 설치·버전·의존성 관리."},
{id:"c40",a:2,type:"개념",en:"configuration management",ko:"구성 관리",note:"CLAUDE.md · settings.json · 모델 버전 고정 · 프롬프트 버전 관리 · 플러그인 의존성."},
{id:"c41",a:2,type:"개념",en:"prompt versioning",ko:"프롬프트 버전 관리",note:"프롬프트도 코드처럼 버전을 매기고 평가와 함께 관리한다."},
{id:"c42",a:2,type:"개념",en:"dependency pinning",ko:"의존성 버전 고정",note:"latest를 쓰면 어느 날 갑자기 동작이 바뀐다. 고정하고 의도적으로 올린다."},
{id:"c43",a:2,type:"개념",en:"data residency",ko:"데이터 소재지 규제",note:"데이터가 특정 국가·리전을 벗어나면 안 되는 요구. 배포·벤더 선택을 제약한다."},
{id:"c44",a:2,type:"개념",en:"third-party vendor (Bedrock/Vertex)",ko:"타사 벤더 경유 호출",note:"클라우드 사업자를 통해 Claude를 호출. 리전·컴플라이언스 요구를 맞출 때 쓴다."},
{id:"c45",a:2,type:"개념",en:"downstream impact assessment",ko:"하류 영향 평가",note:"출력 형식을 바꾸면 그걸 받아 쓰는 시스템이 깨진다. 바꾸기 전에 소비자를 확인한다."},

/* ===== 영역 7: 보안 및 안전 8.1% — 전부 신규 ===== */
{id:"c46",a:7,type:"개념",en:"prompt injection",ko:"프롬프트 주입 공격",note:"외부 입력에 숨긴 지시로 에이전트를 조종하는 공격. 신뢰 경계를 나누고 입력을 데이터로만 취급한다."},
{id:"c47",a:7,type:"개념",en:"credential isolation",ko:"자격 증명 격리",note:"토큰·키를 코드나 프롬프트에 넣지 않는다. 환경 변수·시크릿 매니저로 분리."},
{id:"c48",a:7,type:"개념",en:"secrets management",ko:"비밀값 관리",note:"저장소에 커밋 금지. ${ENV_VAR} 확장이나 전용 저장소를 쓴다."},
{id:"c49",a:7,type:"개념",en:"least privilege",ko:"최소 권한",note:"필요한 권한만 준다. 읽기만 필요하면 쓰기 권한을 빼는 것이 정답."},
{id:"c50",a:7,type:"개념",en:"data boundary control",ko:"데이터 경계 통제",note:"민감 데이터가 모델·로그·외부로 나가지 않게 막는다. 마스킹·필터링."},
{id:"c51",a:7,type:"개념",en:"AI threat modeling",ko:"AI 위협 모델링",note:"주입·데이터 유출·과도한 권한·공급망을 체계적으로 식별한다."},
{id:"c52",a:7,type:"개념",en:"guardrails",ko:"가드레일",note:"입력·출력 양쪽에 거는 안전장치. 프롬프트 지시가 아니라 코드 계층이 확실하다."},
{id:"c53",a:7,type:"개념",en:"hook scoping",ko:"훅 적용 범위",note:"훅을 어디까지 걸지. 너무 넓으면 정상 작업을 막고, 너무 좁으면 구멍이 남는다."},
{id:"c54",a:7,type:"개념",en:"sandboxing",ko:"샌드박스 격리",note:"위험한 실행을 격리된 환경에서. 실행 도구가 있을 때 필수."},

{id:"c56",a:1,type:"개념",en:"orchestrator / supervisor",ko:"오케스트레이터 · 감독자",note:"작업을 분해·위임·집계한다. 서브에이전트끼리 직접 통신하지 않는다."},
{id:"c57",a:1,type:"개념",en:"Claude Agent SDK",ko:"에이전트 구축 키트",note:"루프·도구·하네스를 제공. 직접 구현할지 SDK를 쓸지가 판단 지점."},
{id:"c58",a:1,type:"개념",en:"agent loop / harness",ko:"에이전트 루프 · 하네스",note:"요청 → stop_reason 확인 → 도구 실행 → 결과 추가 → 반복. 종료 판단은 stop_reason으로."},
{id:"c59",a:1,type:"개념",en:"self-hosted vs Anthropic-hosted",ko:"자체 호스팅 vs 관리형",note:"통제·컴플라이언스 vs 운영 부담. 데이터 소재지 요구가 있으면 자체 호스팅 쪽."},
{id:"c60",a:1,type:"개념",en:"hooks for deterministic behavior",ko:"결정론적 동작을 위한 훅",note:"모델 재량에 맡기지 않고 코드로 가로챈다. must / never / 규제 신호."},
{id:"c61",a:1,type:"개념",en:"Strands / LangGraph / PydanticAI",ko:"에이전트 추상화 프레임워크",note:"이름과 용도만 알면 된다. 직접 구현 대비 추상화의 득실을 묻는다."},
{id:"c62",a:1,type:"개념",en:"abstraction trade-off",ko:"추상화 상충",note:"프레임워크는 빠르지만 통제를 잃는다. 요구가 단순하면 직접, 복잡하면 프레임워크."},
{id:"c63",a:6,type:"개념",en:"context drift / bloat",ko:"컨텍스트 표류 · 부풀음",note:"불필요한 내용이 쌓여 품질이 떨어진다. 도구 출력 정리(pruning)와 압축으로 막는다."},
{id:"c64",a:6,type:"개념",en:"tool output pruning",ko:"도구 출력 정리",note:"40개 필드 중 5개만 필요하면 나머지를 잘라내고 컨텍스트에 넣는다."},
{id:"c65",a:6,type:"개념",en:"context isolation",ko:"컨텍스트 격리",note:"서브에이전트나 fork로 긴 출력을 메인에서 분리한다."},
{id:"c66",a:6,type:"개념",en:"system vs user placement",ko:"시스템 vs 사용자 위치",note:"항상 적용될 규칙은 시스템에, 이번 요청 내용은 사용자에 둔다."},
{id:"c67",a:6,type:"개념",en:"output constraints",ko:"출력 제약",note:"길이·형식·금지사항을 명시. 모호하면 결과가 흔들린다."},
{id:"c68",a:6,type:"개념",en:"input sanitization",ko:"입력 정제",note:"외부 입력을 그대로 프롬프트에 넣지 않는다. 주입 방어와 연결."},
{id:"c69",a:6,type:"개념",en:"eval-driven iteration",ko:"평가 기반 반복 개선",note:"평가셋으로 측정 → 프롬프트 수정 → 재측정. 리그레션도 함께 확인한다."},
{id:"c70",a:8,type:"개념",en:"tool definition design",ko:"도구 정의 설계",note:"이름·설명·입력 스키마. 설명이 LLM이 도구를 고르는 주 메커니즘."},
{id:"c71",a:8,type:"개념",en:"tool set consolidation",ko:"도구 집합 정리",note:"도구가 너무 많으면 선택 신뢰도가 떨어진다. 역할별 4~5개로."},
{id:"c72",a:8,type:"개념",en:"pre-dispatch schema validation",ko:"호출 전 스키마 검증",note:"모델이 만든 인자를 실행 전에 검증한다. 잘못된 호출이 시스템에 닿기 전에 막는다."},
{id:"c73",a:8,type:"개념",en:"MCP transport (stdio / HTTP)",ko:"MCP 전송 방식",note:"stdio는 로컬 프로세스, HTTP는 원격 서버. 배포 형태가 선택을 결정한다."},
{id:"c74",a:8,type:"개념",en:"Skills vs MCP servers",ko:"스킬 vs MCP 서버",note:"Skill은 지시·워크플로우 확장, MCP는 외부 시스템 연결. 데이터·동작이 밖에 있으면 MCP."},

{id:"c75",a:4,type:"개념",en:"error taxonomy",ko:"오류 분류",note:"transient(일시) · validation(입력) · business(정책) · permission(권한). 재시도 가능 여부가 갈린다."},
{id:"c76",a:4,type:"개념",en:"transient error retry",ko:"일시적 오류 재시도",note:"지수 백오프로 재시도. 권한·정책 오류는 재시도해도 성공하지 않는다."},

{id:"c78",a:4,type:"개념",en:"recognized error path",ko:"예상된 오류 경로",note:"검증 실패를 종료 사유로 두지 않는다. 재시도·복구·폴백을 먼저 태운다."},
{id:"c79",a:4,type:"개념",en:"root cause isolation",ko:"근본 원인 격리",note:"통합 계층 문제인지 모델 출력 문제인지 분리. 추적 로그로 좁힌다."},
{id:"c80",a:4,type:"개념",en:"error severity routing",ko:"오류 심각도 라우팅",note:"심각도에 따라 알림·중단·기록을 다르게. 전부 같게 처리하면 신호가 묻힌다."},

 완료 표현을 찾아 판단 (parsing natural language signals) / 반복 횟수 제한을 주 종료 장치로 사용 (arbitrary iteration cap as the primary mechanism) / 텍스트 내용에서 완료 지표 탐색"}, {"id": "xr02", "a": 1, "type": "규칙", "en": "에이전트가 방금 도구로 알아낸 사실을 다음 판단에 반영하지 못한다.", "ko": "도구 결과를 대화 기록에 추가한 뒤 다음 반복으로 넘긴다.", "note": "The agent fails to use what the tool just returned.\n\n배제: 도구 결과를 별도 저장소에만 기록 / 시스템 프롬프트에 결과 요약만 넣기"}, {"id": "xr03", "a": 1, "type": "규칙", "en": "대체로 지키는데 일부가 어긋난다. 12% / 가끔 / 0이 아닌 실패율.", "ko": "훅 또는 전제조건 게이트로 코드 수준에서 차단한다. 결정론적 보장.", "note": "...but in 12% of cases the agent skips the step. (nonzero failure rate)\n\n배제: 시스템 프롬프트를 개선/보강 (strengthen the system prompt) / few-shot 예시 추가 (add few-shot examples) / 상위 모델로 교체 (upgrade to a more capable model) / 반복 횟수 늘리기"}, {"id": "xr04", "a": 1, "type": "규칙", "en": "확인 단계를 우회하는 경로를 완전히 없애야 한다. (가장 신뢰할 수 있는 방법)", "ko": "도구를 두 개로 분리하고 토큰 바인딩. 우회 경로가 아키텍처상 존재하지 않게 만든다.", "note": "Which approach most reliably prevents bypassing the preview step?\n\n배제: 도구 설명에 상세 지시와 예시 추가 (elaborate tool descriptions) / 시간 간격 휴리스틱 (a 60-second window heuristic) / 오케스트레이션 계층의 승인 절차만 신뢰"}, {"id": "xr05", "a": 1, "type": "규칙", "en": "서브에이전트가 \"제공된 자료가 없다\"고 한다. 상위 단계는 정상 반환했다.", "ko": "앞 단계 결과를 그 서브에이전트의 프롬프트에 명시적으로 포함한다.", "note": "The subagent reports it has no material to work with.\n\n배제: 대화 이력을 자동 상속한다고 가정 (subagents inherit context) / allowedTools에 Task 추가 / 벡터DB 연결 / session_id 매개변수"}, {"id": "xr06", "a": 1, "type": "규칙", "en": "전체 지연이 각 실행시간의 합이다. 앞이 끝난 뒤 다음이 시작된다.", "ko": "코디네이터가 한 응답 안에서 Task 호출을 여러 개 발송한다.", "note": "Total latency is roughly the sum of the individual runtimes.\n\n배제: max_tokens 조정 / 서브에이전트를 하나로 통합 / 캐싱 계층 추가"}, {"id": "xr07", "a": 1, "type": "규칙", "en": "서브에이전트 전부 성공했는데 최종 결과가 주제의 일부만 다룬다.", "ko": "코디네이터의 작업 분해가 너무 좁았다. 분해 범위를 넓힌다.", "note": "Every subagent succeeded, yet the synthesis covers only part of the topic.\n\n배제: 종합 에이전트의 지시 부족 / 관련성 필터가 과도 / 검색 쿼리가 부실"}, {"id": "xr08", "a": 6, "type": "규칙", "en": "일시적 타임아웃과 복구 불가한 오류가 섞여 있다. 코디네이터가 잡일에 과부하다.", "ko": "일시적 실패는 서브에이전트에서 로컬 복구. 복구 불가만 구조화해 전달 — 오류 유형·시도한 것·부분 결과·대안.", "note": "Transient timeouts and unrecoverable errors are mixed together.\n\n배제: 전담 오류 처리 에이전트 신설 / 모든 응답을 성공으로 반환하고 오류는 메타데이터에 (silently) / 코디네이터가 사전 전량 검증 / 단일 실패로 전체 중단"}, {"id": "xr09", "a": 6, "type": "규칙", "en": "신뢰할 만한 두 출처가 정면으로 다른 숫자를 준다.", "ko": "둘 다 보존하고 출처를 표기하며 충돌을 명시적으로 주석 처리 → 코디네이터가 조정하게 넘긴다.", "note": "Two credible sources report conflicting figures.\n\n배제: 휴리스틱으로 그럴듯한 값 하나 선택 / 작업을 중단하고 즉시 에스컬레이션 / 충돌 표시 없이 둘 다 넘김"}, {"id": "xr10", "a": 1, "type": "규칙", "en": "사람 상담원에게 넘긴다. 그 상담원은 대화 기록을 볼 수 없다.", "ko": "구조화된 인계 — 고객 ID · 근본 원인 분석 · 금액 · 권장 조치.", "note": "Hand off to a human agent who cannot see the conversation history.\n\n배제: \"고객이 불만족\" 같은 뭉갠 요약 / 상담원이 이력을 조회할 거라 가정"}, {"id": "xr11", "a": 1, "type": "규칙", "en": "MCP 도구마다 형식이 다르다 — 유닉스 타임스탬프 / ISO 8601 / 숫자 상태 코드.", "ko": "PostToolUse 훅에서 모델이 처리하기 전에 통일 형식으로 정규화한다.", "note": "Tools return Unix timestamps, ISO 8601 strings, and numeric status codes.\n\n배제: 시스템 프롬프트에 각 형식 설명을 넣어 모델이 해석하게 / 도구별로 별도 에이전트 배치"}, {"id": "xr12", "a": 0, "type": "규칙", "en": "문제에 NOT · LEAST · EXCEPT · inappropriate가 있다.", "ko": "안티패턴을 골라야 한다. 평소 배제하던 선택지가 이번엔 정답.", "note": "Which of the following is LEAST effective / is NOT appropriate?\n\n배제: 습관적으로 최선의 설계를 고르기 — 이 문항에서는 그게 오답"}, {"id": "xr13", "a": 0, "type": "규칙", "en": "무엇을 먼저 할지 묻는다. (가장 효과적인 첫 단계)", "ko": "근본 원인을 직접 건드리는 가장 작은 변경.", "note": "What is the most effective first step?\n\n배제: 분류 모델 추가 / 라우팅 계층 신설 / 상위 모델 교체 / 전면 재설계 (over-engineering)"}, {"id": "xr14", "a": 1, "type": "규칙", "en": "다중 에이전트 시스템의 통신 구조를 묻는다.", "ko": "허브 앤 스포크 — 모든 통신이 코디네이터를 경유한다.", "note": "How should subagents communicate in a multi-agent system?\n\n배제: 서브에이전트끼리 직접 결과 전달 / 코디네이터 우회 (bypass the coordinator) / 공유 큐로 서로 조정"}, {"id": "xr15", "a": 1, "type": "규칙", "en": "파일 14개를 한 번에 분석하게 했더니 발견이 얕고 파일마다 일관성이 없다.", "ko": "파일별 로컬 분석 단계와 별도의 파일 간 통합 분석 단계로 나눈다. (주의력 분산 방지)", "note": "Findings are shallow and inconsistent across files.\n\n배제: max_tokens를 늘려 전체를 한 번에 담기 (컨텍스트 크기 문제가 아니다) / 큰 파일 3개만 우선 처리 (커버리지 포기) / 파일별 서브에이전트가 서로 직접 결과를 교환 (directly with each other — 허브 앤 스포크 위반)"}, {"id": "xr16", "a": 1, "type": "규칙", "en": "처리할 항목이 미리 정해져 있나? 이 한 줄로 분해 방식이 갈린다.", "ko": "정해져 있으면 프롬프트 체이닝(고정 순차). 개방형 조사면 동적 적응형 분해.", "note": "Is the set of items known in advance?\n\n배제: 개방형 과제에 고정 파이프라인 적용 (알파벳순 분할 등) / 모든 파일을 한 번에 읽고 전체 계획을 처음에 완성"}, {"id": "xr17", "a": 1, "type": "규칙", "en": "코드베이스를 분석한 뒤 그 파일들을 대폭 수정했다. 작업을 이어가려 한다.", "ko": "구조화된 요약을 주입해 새 세션을 시작한다. 재개하려면 어떤 파일이 바뀌었는지 반드시 알린다.", "note": "The analyzed files were substantially refactored after the session.\n\n배제: --resume로 이어서 전처럼 질문 계속 (and continue as before — 오래된 도구 결과를 사실로 믿는다)"}, {"id": "xr18", "a": 1, "type": "규칙", "en": "같은 코드베이스 분석 결과 위에서 두 가지 리팩토링 전략을 비교하고 싶다.", "ko": "fork_session으로 공유 기준선에서 독립 분기를 만든다.", "note": "Compare two approaches from a shared analysis baseline.\n\n배제: 세션을 새로 두 개 만들어 분석을 두 번 반복 / 한 세션 안에서 두 전략을 번갈아 진행"}, {"id": "xr19", "a": 6, "type": "규칙", "en": "장시간 조사 중 크래시가 났다. 어디까지 됐는지 모른다.", "ko": "각 에이전트가 상태를 정해진 위치에 내보내고, 코디네이터가 재개 시 매니페스트를 불러 프롬프트에 주입한다.", "note": "The investigation crashed mid-way.\n\n배제: 처음부터 전부 재실행 / 대화 기록에 남아 있으리라 가정"}, {"id": "xr20", "a": 0, "type": "규칙", "en": "선택지 앞부분이 그럴듯하다. 여기서 멈추면 틀린다.", "ko": "선택지를 끝까지 읽는다. 결정적 결함은 마지막 절에 숨어 있다.", "note": "...one subagent per file and have them exchange findings directly with each other.\n\n배제: 앞 절만 보고 판단 (8/14 실제 오답 원인) / 함정 표시어를 놓침: directly / each other / as before / without / regardless / all"}, {"id": "xr21", "a": 0, "type": "규칙", "en": "LEAST / NOT / EXCEPT 문항을 만났다. 무엇이 나쁜지 생각하려니 머리가 안 돌아간다.", "ko": "좋은 선택지 3개를 먼저 지운다. 남은 하나가 정답이다. 판단을 뒤집지 말고 절차를 뒤집는다.", "note": "Which of the following is LEAST appropriate?\n\n배제: 가장 좋은 설계를 고르기 (8/13·8/14 두 번 반복된 오류)"}, {"id": "xr22", "a": 2, "type": "규칙", "en": "기존 개발자 3명은 규칙이 적용되는데, 새로 온 4명째만 적용되지 않는다. 넷 다 같은 저장소를 쓴다.", "ko": "지시가 기존 개발자들의 개인 홈(~/.claude/CLAUDE.md)에만 있다. 프로젝트 수준 .claude/CLAUDE.md로 옮긴다.", "note": "A newly hired fourth developer reports Claude does not follow the convention.\n\n배제: Claude Code가 CLAUDE.md를 캐시한다 (존재하지 않는 동작) / Claude가 사용자별 선호를 학습한다 (존재하지 않는 동작) / 신입의 개인 설정에 충돌 지시가 있다 (없는 것이 원인이지 충돌이 아니다)"}, {"id": "xr23", "a": 2, "type": "규칙", "en": "테스트 파일이 코드베이스 전체에 흩어져 있다. 위치와 무관하게 같은 규칙이 자동 적용되어야 한다.", "ko": ".claude/rules/ 파일에 YAML 프론트매터 glob 패턴(paths)을 넣는다. 일치하는 파일을 편집할 때만 로드된다.", "note": "Test files are scattered throughout; conventions must apply regardless of location.\n\n배제: Skill을 만든다 (수동 호출이라 '자동'이 아니다 — 8/15 실제 오답) / 루트 CLAUDE.md에 영역별 제목으로 모아둔다 (Claude가 추론하길 기대) / 디렉터리마다 CLAUDE.md를 둔다 (흩어진 파일에는 수십 개가 필요)"}, {"id": "xr24", "a": 2, "type": "규칙", "en": "이 컨텍스트는 특정 작업(새 엔드포인트 생성) 때만 유용하고, 디버깅·리뷰 때는 방해된다.", "ko": "Skill로 만들어 필요할 때만 호출한다. (on-demand)", "note": "This context helps only when creating new endpoints, not when debugging.\n\n배제: CLAUDE.md에 넣는다 (항상 로드되어 무관한 작업에서도 컨텍스트를 먹는다) / 매번 프롬프트에 수동으로 복사"}, {"id": "xr26", "a": 2, "type": "규칙", "en": "저장소를 클론하는 모든 개발자가 /review 명령을 쓸 수 있어야 한다.", "ko": "프로젝트 저장소의 .claude/commands/ (또는 .claude/skills/). VCS로 공유된다.", "note": "Every developer who clones the repo should have the command.\n\n배제: 각 개발자 홈의 ~/.claude/commands/ (공유되지 않는다) / .claude/config.json의 commands 배열 (존재하지 않는 방식) / 루트 CLAUDE.md"}, {"id": "xr27", "a": 2, "type": "규칙", "en": "팀의 /commit Skill을 개인적으로 다르게 쓰고 싶다.", "ko": "~/.claude/skills/ 아래 다른 이름(/my-commit)으로 만든다.", "note": "A developer wants a personal variant of the team's /commit Skill.\n\n배제: 같은 이름으로 개인 버전 생성 (팀 Skill을 조용히 가리고 팀의 개선을 못 받는다) / override: true 설정 (존재하지 않는 옵션) / 프로젝트 Skill에 사용자별 조건 분기 추가"}, {"id": "xr29", "a": 2, "type": "규칙", "en": "CLAUDE.md가 500줄을 넘어 TypeScript 규칙·테스트·API·배포가 뒤섞였다.", "ko": ".claude/rules/에 주제별 파일로 분할한다(testing.md, api-conventions.md, deployment.md). @path로 가져올 수도 있다.", "note": "The CLAUDE.md exceeds 500 lines and mixes unrelated topics.\n\n배제: 하위 디렉터리 README.md로 나누기 (지시사항으로 로드되지 않는다) / .claude/config.yaml 매핑 (존재하지 않는 방식) / 여러 수준에 CLAUDE.md를 두고 override 시키기"}, {"id": "xr31", "a": 6, "type": "규칙", "en": "오탐이 많아 개발자들이 도구를 신뢰하지 않는다.", "ko": "무엇을 보고하고 무엇을 건너뛸지 범주로 정의한다. (버그·보안은 보고, 사소한 스타일은 건너뛰기)", "note": "The agent flags many issues developers consider non-issues.\n\n배제: 더 보수적으로 하라고 지시 (be more conservative) / 신뢰도 높은 결과만 보고하라고 지시 (report only high-confidence findings) / 신뢰도 임계값을 올려 필터링 (raise the confidence threshold) / 더 좋은 모델로 교체"}, {"id": "xr32", "a": 6, "type": "규칙", "en": "한 범주의 오탐이 정확한 다른 범주의 신뢰까지 무너뜨렸다.", "ko": "오탐률 높은 범주만 일시적으로 비활성화하고 그 범주의 프롬프트를 개선한다.", "note": "High false positives in one category undermine trust in accurate ones.\n\n배제: 도구 전체를 끈다 / 모든 범주의 임계값을 올린다"}, {"id": "xr33", "a": 6, "type": "규칙", "en": "지침을 아주 상세히 썼는데도 출력 형식이 들쭉날쭉하다.", "ko": "few-shot 예시 2~4개로 원하는 형식을 시연한다. (위치·문제·심각도·권장 수정)", "note": "Detailed instructions still produce inconsistent output.\n\n배제: 지침을 더 길고 자세하게 쓴다 / 출력 형식을 산문으로 설명한다 / few-shot이 예시에만 갇히게 만든다는 주장 (사실은 새 패턴으로 일반화한다)"}, {"id": "xr34", "a": 6, "type": "규칙", "en": "JSON 출력에 구문 오류가 나고 형식이 스키마를 안 지킨다.", "ko": "JSON 스키마를 붙인 tool_use를 쓴다. 스키마 준수를 보장하고 구문 오류를 제거한다.", "note": "The model returns malformed JSON that violates the schema.\n\n배제: 프롬프트에 형식을 더 자세히 설명 / XML 태그로 형식을 부탁 (프롬프트 계층) / 출력을 후처리로 고친다"}, {"id": "xr35", "a": 6, "type": "규칙", "en": "tool_use로 구문 오류는 사라졌는데 항목 합계가 총계와 안 맞는다.", "ko": "스키마는 구문만 잡는다. calculated_total + stated_total + conflict_detected를 함께 추출하고 검증 루프를 돈다.", "note": "Syntax errors are gone but line items do not sum to the stated total.\n\n배제: 스키마 타입 제약을 더 엄격하게 / tool_choice를 any로 설정 / 모든 필드를 필수로 만든다"}, {"id": "xr36", "a": 6, "type": "규칙", "en": "원본에 없는 정보를 모델이 지어내서 필수 필드를 채운다.", "ko": "해당 필드를 선택(nullable)으로 설계해 null을 반환하게 한다. 모호하면 enum에 unclear, 확장은 other + 상세 필드.", "note": "The model invents values to satisfy required fields.\n\n배제: 모든 필드를 필수로 두어 누락을 막는다 (지어내기를 유발한다) / 지어내지 말라고 프롬프트에 쓴다"}, {"id": "xr37", "a": 6, "type": "규칙", "en": "추출이 실패했다. 재시도가 통할지 판단해야 한다.", "ko": "형식 불일치·구조적 출력 오류는 재시도로 해결된다. 재시도 요청에 원본 + 실패한 추출 + 구체적 검증 오류를 함께 담는다.", "note": "Extraction failed — will a retry help?\n\n배제: 원본 문서에 정보가 아예 없는데 반복 재시도 (does not exist → 재시도 무의미) / 외부 문서에만 있는 정보를 재시도로 얻으려 함"}, {"id": "xr38", "a": 6, "type": "규칙", "en": "비용을 줄이려 한다. Message Batches API가 맞는 작업인가?", "ko": "비차단형이고 지연을 허용하는 작업. 야간 보고서, 주간 감사, 야간 테스트 생성. 50% 절감 · 최대 24시간 · SLA 없음 · custom_id로 짝짓기.", "note": "Is this workload appropriate for the Message Batches API?\n\n배제: 병합 전 검사 (blocking — 사람이 기다린다) / 대화형 에이전트 루프 (단일 요청 내 다단계 도구 호출 불가) / 지연에 민감한 IDE 인라인 제안"}, {"id": "xr39", "a": 8, "type": "규칙", "en": "analyze_content와 analyze_document의 설명이 거의 같아 엉뚱한 도구가 선택된다.", "ko": "도구 이름을 바꾸고 설명을 전용화한다. (analyze_content → extract_web_results + 웹 전용 설명)", "note": "Two tools have nearly identical descriptions and get misrouted.\n\n배제: 도구를 하나로 합친다 / tool_choice를 any로 설정 / 모델을 교체"}, {"id": "xr40", "a": 8, "type": "규칙", "en": "도구 설명을 다시 썼는데도 잘못된 도구 선택이 계속된다.", "ko": "시스템 프롬프트에 키워드 민감한 문구가 있는지 점검한다. 잘 쓴 도구 설명을 무효화할 수 있다.", "note": "The team rewrites both descriptions, but misrouting continues.\n\n배제: 도구가 너무 많다고 단정 (지문에 근거 없음) / isError 구현을 의심 / tool_choice 변경"}, {"id": "xr41", "a": 8, "type": "규칙", "en": "analyze_document 하나가 추출·요약·검증을 다 한다.", "ko": "목적별로 분할한다: extract_data_points / summarize_content / verify_claim_against_source.", "note": "A single generic tool does too many different things.\n\n배제: 설명만 길게 늘린다 / 파라미터로 모드를 구분한다"}, {"id": "xr42", "a": 8, "type": "규칙", "en": "도구가 {\"isError\": true, \"content\": \"Operation failed\"}만 반환한다.", "ko": "errorCategory(transient/validation/business/permission) + isRetryable + 사람이 읽을 메시지 + 시도한 쿼리 + 부분 결과를 반환한다.", "note": "The tool returns only \"Operation failed\".\n\n배제: 에이전트가 재시도·수정·에스컬레이션 중 무엇을 할지 판단할 수 없게 둔다 / 조용히 성공으로 처리 (silently) / 단일 실패로 전체 워크플로 중단"}, {"id": "xr43", "a": 8, "type": "규칙", "en": "검색 결과가 비어서 돌아왔다. 권한 문제인가, 진짜 결과가 없는 건가?", "ko": "접근 실패(재시도 판단 필요)와 유효한 빈 결과(일치 없음)를 반드시 구분해 보고한다.", "note": "Distinguish an access failure from a valid empty result.\n\n배제: 둘 다 '결과 없음'으로 뭉뚱그린다 (권한 문제를 영영 못 찾는다)"}, {"id": "xr44", "a": 8, "type": "규칙", "en": "한 에이전트에게 도구 18개를 줬더니 도구 선택이 불안정하다.", "ko": "역할 관련 도구 4~5개와 제한된 교차 유틸리티만 남긴다. 범용 도구는 제약된 대안으로 교체(fetch_url → load_document).", "note": "An agent with access to 18 tools selects unreliably.\n\n배제: 설명을 더 자세히 써서 해결 / 상위 모델로 교체 / tool_choice를 any로"}, {"id": "xr45", "a": 8, "type": "규칙", "en": "팀 전체가 쓸 GitHub MCP 서버가 필요한데 토큰은 커밋하면 안 된다.", "ko": ".mcp.json(프로젝트 루트, VCS 관리) + 환경 변수 확장 ${GITHUB_TOKEN}.", "note": "A shared MCP server whose token must stay out of version control.\n\n배제: ~/.claude.json (개인용이라 공유 안 됨) / 토큰 값을 인라인으로 기입"}, {"id": "xr46", "a": 8, "type": "규칙", "en": "tool · resource · prompt 중 무엇을 써야 하나?", "ko": "동작 실행=tool(손). 읽는 데이터=resource(지도). 템플릿=prompt. 리소스는 콘텐츠 카탈로그로 탐색적 도구 호출을 줄인다.", "note": "Which MCP primitive fits?\n\n배제: 환불 실행 같은 동작을 리소스로 노출 / 표준 통합(Jira·GitHub)에 자체 서버를 새로 구축"}, {"id": "xr47", "a": 6, "type": "규칙", "en": "긴 입력에서 시작과 끝은 잘 처리되는데 중간 내용이 빠진다.", "ko": "핵심 결과 요약을 맨 앞에 배치하고, 상세는 명확한 섹션 헤더로 구조화한다.", "note": "Information in the middle of long input gets dropped.\n\n배제: max_tokens를 늘린다 / 입력 순서를 신경 쓰지 않는다"}, {"id": "xr48", "a": 6, "type": "규칙", "en": "긴 세션에서 앞서 논의한 정확한 금액·날짜·주문번호를 잊는다.", "ko": "거래 사실을 추출해 요약 바깥의 영구 '사례 사실' 블록으로 만들고 매 프롬프트에 포함한다.", "note": "The agent can no longer recall the exact amount discussed earlier.\n\n배제: 고객에게 다시 말해달라고 요청 (사람에게 떠넘김) / /compact를 더 자주 실행 (요약이 숫자·날짜를 뭉갠다) / max_tokens를 늘린다"}, {"id": "xr49", "a": 6, "type": "규칙", "en": "주문 조회가 40개 필드를 반환하는데 반품에 필요한 건 5개뿐이다.", "ko": "컨텍스트에 쌓이기 전에 관련 필드만 남기고 정리한다.", "note": "Tool results accumulate 40+ fields when only 5 are relevant.\n\n배제: 전부 넣고 모델이 알아서 고르게 한다"}, {"id": "xr50", "a": 6, "type": "규칙", "en": "긴 조사 세션에서 모델이 구체적 클래스 대신 '일반적인 패턴'을 언급하기 시작한다.", "ko": "컨텍스트 저하 신호. 스크래치패드 파일에 핵심 발견을 적고, 상세 탐색은 서브에이전트에 위임한다.", "note": "The model starts referring to \"typical patterns\" instead of specific classes.\n\n배제: 같은 세션에서 질문을 더 자세히 한다 / 모델을 교체한다"}, {"id": "xr51", "a": 6, "type": "규칙", "en": "언제 사람에게 넘기나?", "ko": "① 고객의 명시적 요청 → 조사 없이 즉시 ② 정책 공백·예외 ③ 진전 불가. 시스템 프롬프트에 few-shot으로 기준을 명시한다.", "note": "When should the agent escalate?\n\n배제: 감정 분석으로 판단 (신뢰할 수 없는 지표) / 모델의 자체 보고 신뢰도로 판단 (신뢰할 수 없는 지표) / 복잡한 케이스라는 이유만으로 넘김 / 명시적 요청인데 먼저 조사부터 시도"}, {"id": "xr52", "a": 6, "type": "규칙", "en": "도구 검색 결과에 같은 이름의 고객이 여러 명 나왔다.", "ko": "휴리스틱으로 고르지 말고 추가 식별자를 요청한다.", "note": "The tool returns multiple matching customers.\n\n배제: 가장 최근 주문이 있는 고객을 선택 / 임의로 첫 번째를 선택"}, {"id": "xr53", "a": 6, "type": "규칙", "en": "추출 시스템이 전체 정확도 97%다. 수동 검토를 줄여도 되나?", "ko": "문서 유형별·필드별로 정확도를 쪼개 검증하고, 계층적 무작위 표본 추출로 오류율을 계속 측정하며, 라벨 검증 세트로 필드 수준 신뢰도를 보정한다.", "note": "The system reports 97% overall accuracy.\n\n배제: 모델의 자체 보고 신뢰도 임계값 위를 전부 자동화 (보정되지 않은 점수) / 전체 지표만 보고 자동화 (특정 세그먼트의 저조를 가린다)"}, {"id": "xr54", "a": 6, "type": "규칙", "en": "신뢰할 만한 두 출처가 같은 지표에 다른 숫자를 준다.", "ko": "둘 다 보존하고 출처와 발행일을 표기하며 충돌을 주석 처리한다. 발행일은 시간차를 모순으로 오독하지 않게 해준다.", "note": "Two credible sources report different figures.\n\n배제: 더 권위 있는 출처를 선택 / 두 값을 평균 / 해당 지표를 통째로 생략"}, {"id": "xs01", "a": 0, "type": "신호어", "en": "most directly addresses", "ko": "가장 직접적으로 해결하는", "note": "근본 원인을 건드리는 선택지. 증상 완화·우회는 오답."}, {"id": "xs02", "a": 0, "type": "신호어", "en": "most likely root cause", "ko": "가장 가능성 높은 근본 원인", "note": "로그·증상 설명을 다시 읽어라. 답이 문제 안에 적혀 있다."}, {"id": "xs03", "a": 1, "type": "신호어", "en": "nonzero failure rate", "ko": "0이 아닌 실패율", "note": "프롬프트로는 못 막는다는 신호. 훅·전제조건으로 강제하라."}, {"id": "xs04", "a": 1, "type": "신호어", "en": "in 12% of cases", "ko": "12%의 경우에", "note": "확률적 실패 = 프롬프트 의존의 증거. 코드 수준 강제가 정답."}, {"id": "xs05", "a": 1, "type": "신호어", "en": "sometimes / occasionally", "ko": "때때로", "note": "위와 같은 신호. 결정론적 장치를 찾아라."}, {"id": "xs06", "a": 1, "type": "신호어", "en": "reliably / deterministic", "ko": "신뢰할 수 있게 / 결정론적으로", "note": "훅 또는 아키텍처 재설계. 프롬프트 개선은 오답."}, {"id": "xs07", "a": 1, "type": "신호어", "en": "the sum of", "ko": "~의 합", "note": "지연이 합이면 순차 실행 중. 병렬화가 정답."}, {"id": "xs08", "a": 1, "type": "신호어", "en": "sequentially / one after another", "ko": "순차적으로", "note": "한 응답 안에서 동시 발송으로 바꾸는 선택지를 찾아라."}, {"id": "xs09", "a": 0, "type": "신호어", "en": "most effective first step", "ko": "가장 효과적인 첫 단계", "note": "최소 개입을 고른다. 전면 재설계는 과잉."}, {"id": "xs10", "a": 0, "type": "신호어", "en": "while preserving", "ko": "~을 유지하면서", "note": "기능을 깎는 선택지는 자동 탈락."}, {"id": "xs11", "a": 0, "type": "신호어", "en": "without requiring", "ko": "~을 요구하지 않고", "note": "사람에게 부담을 넘기는 선택지를 배제하라는 신호."}, {"id": "xs12", "a": 6, "type": "신호어", "en": "silently", "ko": "조용히 (알림 없이)", "note": "거의 항상 안티패턴 표시어."}, {"id": "xs13", "a": 1, "type": "신호어", "en": "arbitrary", "ko": "임의의", "note": "임의의 반복 횟수 제한 등. 안티패턴 표시어."}, {"id": "xs14", "a": 6, "type": "신호어", "en": "partial results", "ko": "부분 결과", "note": "버리지 말고 보존해 전달. 전체 중단은 안티패턴."}, {"id": "xs15", "a": 6, "type": "신호어", "en": "blocking", "ko": "차단형 (사람이 기다리는)", "note": "배치 처리 불가. 실시간 호출 유지."}, {"id": "xs16", "a": 6, "type": "신호어", "en": "non-blocking / overnight", "ko": "비차단형 / 밤새", "note": "배치 처리 적합. 50% 절감."}, {"id": "xs17", "a": 1, "type": "신호어", "en": "inherit", "ko": "상속하다", "note": "서브에이전트는 상속하지 않는다."}, {"id": "xs18", "a": 0, "type": "신호어", "en": "regardless of", "ko": "~와 관계없이", "note": "품질을 무시한 선택지에 자주 붙는다. 오답 표시어."}, {"id": "xs19", "a": 0, "type": "신호어", "en": "trade-off", "ko": "상충 관계", "note": "한쪽만 좋은 선택지는 함정."}, {"id": "xs20", "a": 6, "type": "신호어", "en": "graceful", "ko": "무리 없이 / 우아하게", "note": "실패해도 전체가 죽지 않는 설계."}, {"id": "xs21", "a": 0, "type": "신호어", "en": "which is NOT", "ko": "다음 중 아닌 것은", "note": "역방향. 안티패턴이 정답이 된다."}, {"id": "xs22", "a": 0, "type": "신호어", "en": "LEAST effective", "ko": "가장 효과가 없는", "note": "역방향. 최선의 설계를 고르면 틀린다."}, {"id": "xs23", "a": 0, "type": "신호어", "en": "all of the following EXCEPT", "ko": "다음을 모두 제외하고", "note": "역방향. 성질이 다른 하나를 찾아라."}, {"id": "xs24", "a": 0, "type": "신호어", "en": "would be inappropriate", "ko": "부적절한 것은", "note": "역방향. 안티패턴을 지목."}, {"id": "xs25", "a": 1, "type": "신호어", "en": "primary mechanism", "ko": "주된 수단", "note": "보조 수단은 오답. 반복 제한은 안전망이지 종료 수단이 아니다."}, {"id": "xs26", "a": 1, "type": "신호어", "en": "bypass", "ko": "우회하다", "note": "우회 경로를 아키텍처에서 삭제하는 선택지를 찾아라."}, {"id": "xs27", "a": 1, "type": "신호어", "en": "findings are shallow / inconsistent", "ko": "발견이 얕고 일관성이 없다", "note": "주의력 분산 신호. 단계를 분리하라(파일별 + 통합 패스)."}, {"id": "xs28", "a": 1, "type": "신호어", "en": "open-ended", "ko": "개방형의", "note": "동적 적응형 분해. 고정 파이프라인은 오답."}, {"id": "xs29", "a": 1, "type": "신호어", "en": "predictable / known set", "ko": "예측 가능한 / 정해진 집합", "note": "프롬프트 체이닝이 적합."}, {"id": "xs30", "a": 1, "type": "신호어", "en": "stale", "ko": "오래된 (낡은)", "note": "재개하지 말고 구조화된 요약으로 새 세션."}, {"id": "xs31", "a": 1, "type": "신호어", "en": "directly with each other", "ko": "서로 직접", "note": "마지막 절 함정. 허브 앤 스포크 위반 = 오답."}, {"id": "xs32", "a": 1, "type": "신호어", "en": "and continue as before", "ko": "그리고 전처럼 계속", "note": "마지막 절 함정. 변경 사항을 무시한다는 뜻."}, {"id": "xs35", "a": 0, "type": "신호어", "en": "all of / every", "ko": "모든", "note": "전량 처리·전량 검증을 요구하는 선택지는 대부분 과잉."}, {"id": "xs36", "a": 2, "type": "신호어", "en": "regardless of location", "ko": "위치와 관계없이", "note": "글롭 패턴(.claude/rules/ + paths). 디렉터리별 CLAUDE.md는 오답."}, {"id": "xs38", "a": 2, "type": "신호어", "en": "automatically apply", "ko": "자동으로 적용되는", "note": "Skill은 수동 호출이라 오답. 자동 = CLAUDE.md 또는 paths 규칙."}, {"id": "xs39", "a": 2, "type": "신호어", "en": "on demand", "ko": "필요할 때만", "note": "Skill. 항상 로드되는 CLAUDE.md는 오답."}, {"id": "xs40", "a": 2, "type": "신호어", "en": "always loaded", "ko": "항상 로드되는", "note": "CLAUDE.md의 성질. 무거운 컨텍스트를 여기 넣으면 낭비."}, {"id": "xs41", "a": 2, "type": "신호어", "en": "shared via version control", "ko": "버전 관리로 공유되는", "note": "프로젝트 경로(.claude/). ~/.claude/ 는 공유되지 않는다."}, {"id": "xs42", "a": 2, "type": "신호어", "en": "without affecting teammates", "ko": "팀원에게 영향을 주지 않고", "note": "~/.claude/ 개인 경로 + 다른 이름."}, {"id": "xs50", "a": 0, "type": "신호어", "en": "best supported approach", "ko": "가장 잘 지원되는 방식", "note": "실제로 존재하는 기능을 고른다. 그럴듯한 가짜 기능이 오답으로 섞인다."}, {"id": "xs51", "a": 0, "type": "신호어", "en": "is NOT a valid reason", "ko": "타당한 이유가 아닌 것은", "note": "역방향. 맞는 이유 3개를 먼저 세고 남은 하나."}, {"id": "xs52", "a": 0, "type": "신호어", "en": "would be LEAST helpful", "ko": "가장 도움이 되지 않는 것은", "note": "역방향. 도움 되는 3개를 지운다."}, {"id": "xs53", "a": 0, "type": "신호어", "en": "LEAST plausible", "ko": "가장 개연성이 낮은", "note": "역방향. 존재하지 않는 동작을 주장하는 선택지를 찾아라."}, {"id": "xs54", "a": 0, "type": "신호어", "en": "which explanation", "ko": "어떤 설명이", "note": "원인 진단 문항. 증상을 다시 읽어라."}, {"id": "xs56", "a": 8, "type": "신호어", "en": "nearly identical descriptions", "ko": "거의 동일한 설명", "note": "도구 라우팅 실패 원인. 이름 변경 + 경계 명시가 정답."}, {"id": "xs57", "a": 8, "type": "신호어", "en": "unreliable tool selection", "ko": "불안정한 도구 선택", "note": "도구 설명 품질 문제. 설명은 LLM이 도구를 고르는 주 메커니즘."}, {"id": "xs58", "a": 8, "type": "신호어", "en": "generic \"Operation failed\"", "ko": "뭉뚱그린 실패 메시지", "note": "구조화된 오류(errorCategory·isRetryable)로 바꾼다."}, {"id": "xs59", "a": 8, "type": "신호어", "en": "retryable", "ko": "재시도 가능한", "note": "일시적=재시도, 비즈니스 규칙 위반=retryable:false."}, {"id": "xs60", "a": 8, "type": "신호어", "en": "access to 18 tools", "ko": "18개 도구 접근", "note": "도구 과다 = 선택 신뢰도 저하. 역할별로 4~5개로 좁힌다."}, {"id": "xs61", "a": 8, "type": "신호어", "en": "returns text instead of calling a tool", "ko": "도구를 안 부르고 말로 답한다", "note": "tool_choice: \"any\""}, {"id": "xs62", "a": 8, "type": "신호어", "en": "must be called first", "ko": "먼저 호출되어야 한다", "note": "강제 도구 선택 {\"type\":\"tool\",\"name\":\"...\"}"}, {"id": "xs63", "a": 8, "type": "신호어", "en": "without committing secrets", "ko": "비밀값을 커밋하지 않고", "note": ".mcp.json의 환경 변수 확장 ${GITHUB_TOKEN}"}, {"id": "xs64", "a": 8, "type": "신호어", "en": "reduce exploratory tool calls", "ko": "탐색적 도구 호출을 줄인다", "note": "MCP 리소스로 콘텐츠 카탈로그를 노출한다."}, {"id": "xs65", "a": 8, "type": "신호어", "en": "prefers the built-in tool", "ko": "내장 도구를 우선 고른다", "note": "MCP 도구 설명을 보강해 기능·출력을 상세히 쓴다."}, {"id": "xs66", "a": 6, "type": "신호어", "en": "invents values / fabricates", "ko": "값을 지어낸다", "note": "nullable 필드를 두고 없으면 null을 반환하게 한다."}, {"id": "xs67", "a": 6, "type": "신호어", "en": "false positives", "ko": "오탐", "note": "명확한 검토 기준(explicit criteria)을 정의한다. 신뢰도 임계값이 아니다."}, {"id": "xs68", "a": 6, "type": "신호어", "en": "latency tolerant / overnight", "ko": "지연을 허용하는", "note": "Message Batches API. 50% 절감, 최대 24시간."}, {"id": "xs69", "a": 6, "type": "신호어", "en": "format inconsistency", "ko": "형식이 들쭉날쭉하다", "note": "few-shot 예시로 형식을 시연한다."}, {"id": "xs70", "a": 6, "type": "신호어", "en": "ambiguous request", "ko": "모호한 요청", "note": "합리적 가정을 세우고 명시한 뒤 진행. 되묻기 남발은 이탈을 부른다."}, {"id": "xs71", "a": 6, "type": "신호어", "en": "lost in the middle", "ko": "중간 내용이 누락되는 현상", "note": "중요한 내용은 앞이나 뒤에 배치한다."}, {"id": "xs72", "a": 6, "type": "신호어", "en": "verbose tool output", "ko": "장황한 도구 출력", "note": "구조화된 사실만 추출해 컨텍스트에 넣는다."}, {"id": "xs73", "a": 6, "type": "신호어", "en": "low confidence", "ko": "낮은 신뢰도", "note": "인간 검토로 라우팅. 필드 수준 신뢰도 점수."}, {"id": "xs74", "a": 6, "type": "신호어", "en": "policy gap", "ko": "정책 공백", "note": "자율 해결 불가 → 에스컬레이션 기준."}, {"id": "xs75", "a": 6, "type": "신호어", "en": "across the context boundary", "ko": "컨텍스트 경계를 넘어", "note": "스크래치패드 파일로 핵심 발견을 보존한다."}, {"id": "xs91", "a": 6, "type": "신호어", "en": "self-reported confidence", "ko": "모델이 스스로 매긴 신뢰도", "note": "에스컬레이션 판단 지표로는 신뢰할 수 없다. 보정된 필드 수준 점수만 유효."}, {"id": "xs92", "a": 6, "type": "신호어", "en": "overall accuracy", "ko": "전체 정확도", "note": "특정 문서 유형·필드의 저조를 가린다. 세그먼트별로 쪼개라."}, {"id": "xs93", "a": 6, "type": "신호어", "en": "vague / typical patterns", "ko": "두루뭉술한 / 일반적인 패턴", "note": "컨텍스트 저하 신호. 스크래치패드·서브에이전트."}, {"id": "xs94", "a": 6, "type": "신호어", "en": "explicitly asks for a human", "ko": "사람을 명시적으로 요청", "note": "조사 시도 없이 즉시 에스컬레이션."}, {"id": "xs95", "a": 6, "type": "신호어", "en": "multiple matching", "ko": "여러 건이 일치", "note": "추가 식별자 요청. 휴리스틱 추측은 오답."}, {"id": "xt01", "a": 1, "type": "용어", "en": "agentic loop", "ko": "에이전트 루프", "note": "요청 → stop_reason 확인 → 도구 실행 → 결과를 대화 기록에 추가 → 반복."}, {"id": "xt02", "a": 1, "type": "용어", "en": "stop_reason", "ko": "종료 이유 (응답의 꼬리표)", "note": "루프를 계속할지 멈출지 판단하는 유일한 기준."}, {"id": "xt03", "a": 1, "type": "용어", "en": "\"tool_use\"", "ko": "도구를 써야 한다는 신호", "note": "도구 실행 후 결과를 돌려주고 루프 계속."}, {"id": "xt04", "a": 1, "type": "용어", "en": "\"end_turn\"", "ko": "할 말을 마쳤다는 신호", "note": "루프를 종료한다."}, {"id": "xt05", "a": 1, "type": "용어", "en": "conversation history", "ko": "대화 기록", "note": "도구 결과를 여기에 추가해야 다음 판단에 반영된다."}, {"id": "xt06", "a": 6, "type": "용어", "en": "messages array", "ko": "메시지 배열", "note": "API는 stateless. 전체 이력을 매 요청에 실어야 한다."}, {"id": "xt07", "a": 1, "type": "용어", "en": "coordinator", "ko": "코디네이터 (팀장 역할)", "note": "분해 → 위임 → 집계 → 누구를 부를지 동적 결정."}, {"id": "xt08", "a": 1, "type": "용어", "en": "subagent", "ko": "서브에이전트", "note": "격리된 컨텍스트. 서로 직접 대화하지 않는다."}, {"id": "xt09", "a": 1, "type": "용어", "en": "hub-and-spoke", "ko": "허브 앤 스포크", "note": "모든 통신이 코디네이터를 경유."}, {"id": "xt10", "a": 1, "type": "용어", "en": "isolated context", "ko": "격리된 컨텍스트", "note": "코디네이터의 이력을 자동 상속하지 않는다."}, {"id": "xt11", "a": 1, "type": "용어", "en": "does not inherit", "ko": "상속받지 않는다", "note": "시험 함정 1위."}, {"id": "xt12", "a": 1, "type": "용어", "en": "Task tool", "ko": "서브에이전트를 생성하는 도구", "note": "만드는 도구다. 받는 도구가 아니다."}, {"id": "xt13", "a": 1, "type": "용어", "en": "allowedTools", "ko": "허용 도구 목록", "note": "\"Task\"가 없으면 서브에이전트를 못 만든다."}, {"id": "xt14", "a": 1, "type": "용어", "en": "AgentDefinition", "ko": "에이전트 정의", "note": "설명 · 시스템 프롬프트 · 도구 제한."}, {"id": "xt15", "a": 1, "type": "용어", "en": "task decomposition", "ko": "작업 분해", "note": "너무 좁게 쪼개면 커버리지가 빠진다."}, {"id": "xt16", "a": 1, "type": "용어", "en": "parallel dispatch", "ko": "병렬 발송", "note": "한 응답 안에서 Task 여러 개."}, {"id": "xt17", "a": 1, "type": "용어", "en": "precondition gate", "ko": "전제조건 게이트", "note": "선행 단계 전 후속 호출을 코드로 차단."}, {"id": "xt18", "a": 1, "type": "용어", "en": "PostToolUse", "ko": "도구 사용 후 개입하는 훅", "note": "모델이 처리하기 전에 형식을 정규화."}, {"id": "xt19", "a": 1, "type": "용어", "en": "structured handoff", "ko": "구조화된 인계", "note": "고객 ID · 근본 원인 · 금액 · 권장 조치."}, {"id": "xt20", "a": 1, "type": "용어", "en": "deterministic guarantee", "ko": "결정론적 보장", "note": "훅·코드가 준다. 프롬프트는 확률적."}, {"id": "xt21", "a": 6, "type": "용어", "en": "structured error context", "ko": "구조화된 오류 컨텍스트", "note": "오류 유형 · 시도 · 부분 결과 · 대안."}, {"id": "xt22", "a": 6, "type": "용어", "en": "coverage annotation", "ko": "커버리지 주석", "note": "근거가 충분한 부분과 공백을 표시."}, {"id": "xt23", "a": 0, "type": "용어", "en": "root cause", "ko": "근본 원인", "note": "잘 작동하는 부품을 탓하면 오답."}, {"id": "xt24", "a": 0, "type": "용어", "en": "over-engineering", "ko": "과잉 설계", "note": "분류 모델·라우팅 계층·상위 모델은 대부분 오답."}, {"id": "xt26", "a": 6, "type": "용어", "en": "Message Batches API", "ko": "일괄 처리 API", "note": "50% 절감, 최대 24시간, SLA 없음."}, {"id": "xt27", "a": 1, "type": "용어", "en": "prompt chaining", "ko": "프롬프트 체이닝 (고정 순차 분해)", "note": "항목이 미리 정해진 다면 리뷰에 적합. 각 파일 분석 → 통합 패스."}, {"id": "xt28", "a": 1, "type": "용어", "en": "dynamic decomposition", "ko": "동적 적응형 분해", "note": "중간 발견을 기반으로 하위 작업을 그때 생성. 개방형 조사에 적합."}, {"id": "xt29", "a": 1, "type": "용어", "en": "attention dilution", "ko": "주의력 분산", "note": "한 번에 너무 많이 넣으면 각각이 얕아진다. 단계 분리로 해결."}, {"id": "xt32", "a": 6, "type": "용어", "en": "manifest", "ko": "매니페스트 (진행 상태 목록)", "note": "코디네이터가 재개 시 불러와 프롬프트에 주입. 크래시 복구."}, {"id": "xt33", "a": 6, "type": "용어", "en": "scratchpad file", "ko": "스크래치패드 파일", "note": "컨텍스트 경계를 넘어 핵심 발견을 보존."}, {"id": "xt45", "a": 2, "type": "용어", "en": ".claude/rules/", "ko": "주제별 규칙 디렉터리", "note": "paths 프론트매터로 조건부 로딩."}, {"id": "xt46", "a": 2, "type": "용어", "en": ".claude/commands/", "ko": "프로젝트 슬래시 명령", "note": "VCS 공유. 개인용은 ~/.claude/commands/."}, {"id": "xt47", "a": 2, "type": "용어", "en": "version control (VCS)", "ko": "버전 관리", "note": "프로젝트 경로만 공유된다. 홈 경로는 안 된다."}, {"id": "xt48", "a": 2, "type": "용어", "en": "override", "ko": "덮어쓰다, 우선하다", "note": "개인 Skill이 같은 이름의 팀 Skill을 조용히 가린다."}, {"id": "xt49", "a": 8, "type": "용어", "en": "tool description", "ko": "도구 설명", "note": "LLM이 도구를 고르는 주 메커니즘. 입력 형식·예시·경계를 담는다."}, {"id": "xt50", "a": 8, "type": "용어", "en": "tool routing", "ko": "도구 연결(라우팅)", "note": "설명이 겹치면 잘못된 도구가 선택된다."}, {"id": "xt51", "a": 8, "type": "용어", "en": "splitting a generic tool", "ko": "범용 도구 분할", "note": "analyze_document → extract_data_points / summarize_content / verify_claim."}, {"id": "xt52", "a": 8, "type": "용어", "en": "isError", "ko": "MCP 오류 플래그", "note": "도구 오류를 에이전트에 알리는 플래그."}, {"id": "xt53", "a": 8, "type": "용어", "en": "errorCategory", "ko": "오류 범주", "note": "transient / validation / business / permission."}, {"id": "xt54", "a": 8, "type": "용어", "en": "isRetryable", "ko": "재시도 가능 여부", "note": "불필요한 재시도를 막는 구조화 메타데이터."}, {"id": "xt55", "a": 8, "type": "용어", "en": "transient error", "ko": "일시적 오류", "note": "타임아웃·서비스 불가. 서브에이전트에서 로컬 복구."}, {"id": "xt56", "a": 8, "type": "용어", "en": "permission error", "ko": "권한 오류", "note": "접근 실패. 결과가 없는 것(빈 결과)과 구분해야 한다."}, {"id": "xt57", "a": 8, "type": "용어", "en": "tool_choice: \"auto\"", "ko": "모델이 알아서 결정", "note": "기본값."}, {"id": "xt58", "a": 8, "type": "용어", "en": "tool_choice: \"any\"", "ko": "반드시 도구를 부르게 함", "note": "대화 텍스트 대신 도구 호출을 보장."}, {"id": "xt59", "a": 8, "type": "용어", "en": "forced tool selection", "ko": "특정 도구 강제", "note": "{\"type\":\"tool\",\"name\":\"extract_metadata\"} — 실행 순서 보장."}, {"id": "xt60", "a": 8, "type": "용어", "en": ".mcp.json", "ko": "프로젝트 MCP 설정", "note": "팀 공유. 환경 변수 확장으로 자격 증명 관리."}, {"id": "xt61", "a": 8, "type": "용어", "en": "~/.claude.json", "ko": "사용자 MCP 설정", "note": "개인·실험용 서버."}, {"id": "xt62", "a": 8, "type": "용어", "en": "MCP resource", "ko": "MCP 리소스", "note": "콘텐츠 카탈로그. 탐색적 도구 호출을 줄인다. 도구는 '작업', 리소스는 '목록'."}, {"id": "xt63", "a": 8, "type": "용어", "en": "Grep / Glob", "ko": "내용 검색 / 파일 이름 패턴", "note": "Grep=파일 안 내용, Glob=경로·확장자 패턴."}, {"id": "xt64", "a": 8, "type": "용어", "en": "Edit", "ko": "고유 텍스트 일치 부분 수정", "note": "일치가 고유하지 않아 실패하면 Read + Write로 대체."}, {"id": "xt65", "a": 6, "type": "용어", "en": "tool_use (structured output)", "ko": "구조화된 출력 수단", "note": "JSON 스키마를 붙여 형식을 강제. XML보다 확실하다."}, {"id": "xt66", "a": 6, "type": "용어", "en": "nullable field", "ko": "null 허용 필드", "note": "없는 정보를 지어내지 않고 null을 반환하게 한다."}, {"id": "xt67", "a": 6, "type": "용어", "en": "enum", "ko": "열거형", "note": "\"other\" + 상세 문자열 패턴을 함께 둔다."}, {"id": "xt68", "a": 6, "type": "용어", "en": "strict mode", "ko": "엄격 모드", "note": "구문 오류를 제거한다."}, {"id": "xt69", "a": 6, "type": "용어", "en": "Pydantic", "ko": "스키마 검증 라이브러리", "note": "의미론적 검증 오류를 잡는다."}, {"id": "xt70", "a": 6, "type": "용어", "en": "validation-retry loop", "ko": "검증-재시도 루프", "note": "실패 시 문서 + 실패한 추출 + 구체적 오류를 담아 재요청."}, {"id": "xt71", "a": 6, "type": "용어", "en": "few-shot prompting", "ko": "소수 예시 제시", "note": "모호한 시나리오·형식 일관성·오탐 감소에 쓴다."}, {"id": "xt72", "a": 6, "type": "용어", "en": "custom_id", "ko": "배치 요청 식별자", "note": "요청·응답을 짝짓고 실패 건을 재제출한다."}, {"id": "xt73", "a": 6, "type": "용어", "en": "explicit criteria", "ko": "명확한 기준", "note": "오탐을 줄이는 정답. 신뢰도 임계값 필터링은 오답."}, {"id": "xt74", "a": 6, "type": "용어", "en": "context window", "ko": "컨텍스트 창", "note": "토큰 할당량을 배분해 관리한다."}, {"id": "xt75", "a": 6, "type": "용어", "en": "progressive summarization", "ko": "점진적 요약", "note": "긴 세션에서 컨텍스트를 확보한다."}, {"id": "xt76", "a": 6, "type": "용어", "en": "context extraction", "ko": "컨텍스트 추출", "note": "장황한 출력에서 구조화된 사실만 뽑아 넣는다."}, {"id": "xt77", "a": 6, "type": "용어", "en": "field-level confidence", "ko": "필드 수준 신뢰도", "note": "낮은 필드만 인간 검토로 라우팅."}, {"id": "xt78", "a": 6, "type": "용어", "en": "calibration", "ko": "보정", "note": "라벨링된 검증 세트로 신뢰도 점수를 맞춘다."}, {"id": "xt79", "a": 6, "type": "용어", "en": "stratified sampling", "ko": "계층적 표본 추출", "note": "문서 유형·필드별 오류율 측정."}, {"id": "xt80", "a": 6, "type": "용어", "en": "provenance", "ko": "출처 추적", "note": "주장-출처 매핑, 발행일, 충돌 주석, 커버리지 공백."}, {"id": "xt81", "a": 6, "type": "용어", "en": "human-in-the-loop", "ko": "인간 개입", "note": "정책 공백·고객 요청·진행 불가일 때 에스컬레이션."}];
const CARDS = NEWCARDS.concat(PORTED);

</script>
<script>
const KEY="ccdvf.v1";
let canPersist=true,lastSave=null;
function blank(){return{q:{},c:{},days:{},sec:[],elim:{},flags:{}};}
function load(){try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):blank();}catch(e){canPersist=false;return blank();}}
function save(s){try{localStorage.setItem(KEY,JSON.stringify(s));lastSave=new Date();}catch(e){canPersist=false;}
 const el=document.getElementById("hint");
 if(el)el.textContent=canPersist?("저장 "+(lastSave?String(lastSave.getHours()).padStart(2,"0")+":"+String(lastSave.getMinutes()).padStart(2,"0"):"")):"⚠ 저장 불가";}
let S=load();
["q","c","days","elim","flags"].forEach(k=>{if(!S[k])S[k]={}});if(!S.sec)S.sec=[];

const AREA={0:["공통 (방향어·오답유형)",0],1:["에이전트·워크플로우",14.7],2:["애플리케이션·통합",33.1],3:["Claude Code",3.1],
 4:["평가·테스트·디버깅",2.6],5:["모델 선택·최적화",16.8],6:["프롬프트·컨텍스트",11.0],
 7:["보안·안전",8.1],8:["도구·MCP",10.6]};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* 표시 순서 적용: ol[i] = opts[i]가 놓일 자리의 글자. 정답은 opts[0] */
function rnd(s){s=(s*1103515245+12345)&0x7fffffff;return[s,s/0x7fffffff];}
function laid(q){
  // 원본 배치
  const base=[null,null,null,null];
  q.ol.forEach((L,i)=>{ base["ABCD".indexOf(L)]=q.opts[i]; });
  const baseAns="ABCD".indexOf(q.ol[0]);
  if(!shuf) return {opts:base, ans:baseAns, map:[0,1,2,3]};
  // 문항 uid + 세션 시드로 결정론적 셔플
  let s=seed; for(const ch of q.uid) s=(s*31+ch.charCodeAt(0))&0x7fffffff;
  const idx=[0,1,2,3];
  for(let i=3;i>0;i--){ let r; [s,r]=rnd(s); const j=Math.floor(r*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  // idx[newPos] = oldPos
  const opts=idx.map(o=>base[o]);
  const map=[0,0,0,0]; idx.forEach((o,n)=>map[o]=n);   // map[oldPos]=newPos
  return {opts, ans:map[baseAns], map};
}
/* 함정 해설의 A/B/C/D 표기를 새 위치에 맞게 바꾼다 */
function remapTrap(t,map){
  if(!t) return t;
  return t.replace(/(^|[\s])([A-D])(\s*\()/g,(m,p,L,q2)=>p+"ABCD"[map["ABCD".indexOf(L)]]+q2);
}

let mode="quiz", area=0, qi=0, picked=null, crossed={}, xMode=false;
let koOn=false, shuf=true, seed=Date.now()%100000;
let learn=true, onlyWrong=false, ci=0, flipped=false, deck='전체', sess=0, t0=Date.now(), timer=null;

function qPool(){let l=QUESTIONS.slice();
 if(area)l=l.filter(x=>x.a===area);
 if(onlyWrong)l=l.filter(x=>S.q[x.uid]&&S.q[x.uid].miss>0);
 return l.length?l:QUESTIONS.slice();}
const DECKS=["전체","개념","방향어","규칙","신호어","용어"];
function cPool(){let l=CARDS.slice();
 if(deck!=="전체")l=l.filter(x=>x.type===deck);
 if(area)l=l.filter(x=>x.a===area||x.a===0);
 if(!l.length)l=CARDS.filter(x=>deck==="전체"||x.type===deck);
 return l.length?l:CARDS.slice();}

function attachOpt(b,onPick,onCross){
 let t=null,lf=false,mv=false;
 const cl=()=>{if(t){clearTimeout(t);t=null;}};
 b.addEventListener("touchstart",()=>{mv=false;lf=false;t=setTimeout(()=>{lf=true;onCross();},420);},{passive:true});
 b.addEventListener("touchmove",()=>{mv=true;cl();},{passive:true});
 b.addEventListener("touchend",e=>{cl();if(lf)e.preventDefault();},{passive:false});
 b.onclick=()=>{if(lf){lf=false;return;}if(mv)return;if(xMode){onCross();return;}onPick();};
 b.oncontextmenu=e=>{e.preventDefault();onCross();};
}
function tick(){const el=document.getElementById("clock");if(!el)return;
 const t=Math.floor((Date.now()-t0)/1000);el.textContent=t+"s";el.style.color=t>136?"var(--red)":"var(--muted)";}
function resetClock(){t0=Date.now();clearInterval(timer);timer=setInterval(tick,1000);}

function bumpDay(hit){const k=today(),d=S.days[k]||{n:0,hit:0};S.days[k]={n:d.n+1,hit:d.hit+(hit?1:0)};sess++;}

function renderBars(){
 const mb=document.getElementById("modebar");
 mb.innerHTML=[["quiz","문제"],["card","카드"],["ref","요약"],["stat","기록"]]
  .map(([k,l])=>`<button class="mode${mode===k?" on":""}" data-m="${k}">${l}</button>`).join("");
 mb.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;qi=0;ci=0;picked=null;flipped=false;crossed={};render();});
 const sb=document.getElementById("subbar");
 if(mode==="quiz"||mode==="card"){
  sb.style.display="flex";
  const items=[[0,"전체"]].concat([1,2,3,4,5,6,7,8].map(a=>[a,"영역"+a+" "+AREA[a][1]+"%"]));
  sb.innerHTML=items.map(([a,l])=>`<button class="sub${area===a?" on":""}" data-a="${a}"
    style="font-family:var(--mono);${area===a?"background:var(--ink);border-color:var(--ink);color:#fff":""}">${l}</button>`).join("");
  sb.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{area=parseInt(b.dataset.a);qi=0;ci=0;picked=null;flipped=false;crossed={};render();});
 }else{sb.style.display="none";sb.innerHTML="";}
}

function render(){
 renderBars();
 const v=document.getElementById("view");
 const el=document.getElementById("hint");
 if(el)el.textContent=canPersist?(lastSave?"저장 "+String(lastSave.getHours()).padStart(2,"0")+":"+String(lastSave.getMinutes()).padStart(2,"0"):"자동 저장"):"⚠ 저장 불가";
 if(mode==="ref"){v.innerHTML=refHTML();return;}
 if(mode==="stat"){v.innerHTML=statHTML();bindStat();return;}
 if(mode==="card"){v.innerHTML=cardHTML();bindCard(v);return;}
 v.innerHTML=quizHTML();bindQuiz(v);
}

function quizHTML(){
 const list=qPool(); if(qi>=list.length)qi=0;
 const q=list[qi], L=laid(q), st=S.q[q.uid];
 return `<div class="row" style="margin:0 0 10px">
   <button id="lrn" class="xtoggle${learn?" on":""}" style="${learn?"background:var(--teal);border-color:var(--teal);color:#fff":""}">${learn?"학습 모드 — 답하면 바로 해설":"시험 모드 — 해설 안 봄"}</button>
   <button id="ow" class="xtoggle${onlyWrong?" on":""}">틀린 것만</button></div>
  <div class="panel">
   <div class="meta"><span>${qi+1}/${list.length} · ${q.uid} · ${esc(q.tag)}</span>
     <span>영역${q.a} ${AREA[q.a][1]}%
       <button id="fl" style="background:none;border:none;cursor:pointer;color:${S.flags[q.uid]?"var(--amber)":"var(--line)"}">⚑</button>
       <span id="clock" class="pill">0s</span></span></div>
   <div class="stem">${esc(q.stem)}</div>
   ${koOn&&q.ko?`<div class="note" style="background:var(--paper);border-radius:6px;padding:10px 12px;margin:-6px 0 14px;font-size:13px;color:#23303C;line-height:1.65">
     <b style="font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted)">한글 지문</b><br>${esc(q.ko)}</div>`:""}
   <div style="margin:-4px 0 12px"><button id="kob" class="xtoggle${koOn?" on":""}" style="${koOn?"background:var(--teal);border-color:var(--teal);color:#fff":""}">${koOn?"한글 지문 숨기기":"한글 지문 보기"}</button>
     <button id="shb" class="xtoggle${shuf?" on":""}" style="margin-left:6px;${shuf?"background:var(--plum);border-color:var(--plum);color:#fff":""}">${shuf?"🔀 위치 섞기 켜짐":"🔀 위치 섞기"}</button>
     <span class="note" style="margin-left:8px">선택지는 영어 그대로</span></div>
   <div id="opts">${L.opts.map((o,i)=>`<button class="opt${crossed[i]?" xed":""}${picked!==null?(i===L.ans?" ok":(i===picked?" no":"")):""}" data-i="${i}"><span class="k">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>
   <div style="margin:8px 0 10px"><button id="xt" class="xtoggle${xMode?" on":""}">✎ 소거 모드${xMode?" 켜짐":""}</button>
     <span class="note" style="margin-left:8px">길게 누르기·우클릭으로도 지워집니다</span></div>
   <input type="text" id="elim" placeholder="소거 메모 — 예: A-사람에게떠넘김 / C-과잉 / D-없는기능 → B" value="${esc(S.elim[q.uid]||"")}">
   ${picked!==null?`<div class="exp">
     <div class="lbl" style="color:${picked===L.ans?"var(--green)":"var(--red)"}">${picked===L.ans?"정답":"오답"} · 정답은 ${"ABCD"[L.ans]}</div>
     <div style="font-weight:600;font-size:13.5px;line-height:1.65;margin-bottom:10px">${esc(q.why)}</div>

const TUTOR_DATA = Object.fromEntries(QUESTIONS.map(q => {
 const [title,signals,concept,exampleA,exampleB,question,answer,check,correction,takeaway]=TUTOR_TOPICS[q.n-1];
 return [q.uid,{title,signals,concept,example:q.uid.startsWith('A')?exampleA:exampleB,question,answer,check,correction,takeaway}];
}));

// Supplemental explanations never appear in exams or while an answer is hidden.
const TUTOR_PREF_KEY='ccdvf.tutor.preferences.v1';
let tutorPrefs={theme:'light',autoOpen:false};
try{const p=JSON.parse(localStorage.getItem(TUTOR_PREF_KEY)||'{}');tutorPrefs={theme:p.theme==='dark'?'dark':'light',autoOpen:p.autoOpen===true};}catch(e){}
function saveTutorPrefs(){try{localStorage.setItem(TUTOR_PREF_KEY,JSON.stringify(tutorPrefs));}catch(e){}}
function applyTutorTheme(){
 document.documentElement.dataset.theme=tutorPrefs.theme;
 const b=document.getElementById('theme-toggle');
 b.textContent=tutorPrefs.theme==='dark'?'☀ 라이트로':'☾ 다크로';
 b.setAttribute('aria-pressed',String(tutorPrefs.theme==='dark'));
 b.setAttribute('aria-label',tutorPrefs.theme==='dark'?'라이트 모드로 전환':'다크 모드로 전환');
}
document.getElementById('theme-toggle').onclick=()=>{tutorPrefs.theme=tutorPrefs.theme==='dark'?'light':'dark';saveTutorPrefs();applyTutorTheme();};
applyTutorTheme();
function tutorHTML(q){
 const d=TUTOR_DATA[q.uid];if(!d)return '';
 return `<section class="tutor" aria-label="${esc(q.uid)} 쉬운 개념과 예시">
 <div class="tutor-tools"><span class="tutor-label">TUTOR · ${esc(q.uid)} · 이해 보조</span><label><input id="tutor-auto" type="checkbox" ${tutorPrefs.autoOpen?'checked':''}> 예시 자동 펼침</label></div>
 <details id="tutor-detail" ${tutorPrefs.autoOpen?'open':''}><summary>쉬운 개념 · 예시 · 문답 — ${esc(d.title)}</summary>
 <p class="tutor-signals"><b>영어 신호</b><br>${esc(d.signals)}</p>
 <p><b>개념을 쉽게</b><br>${esc(d.concept)}</p>
 <div class="tutor-example"><b>For e.g. · 이런 상황이야</b><p>${esc(d.example)}</p></div>
 <p><b>Q. ${esc(d.question)}</b><br>A. ${esc(d.answer)}</p>
 <p><b>Q. ${esc(d.check)}</b><br>A. ${esc(d.correction)}</p>
 <p class="tutor-takeaway"><b>기억할 연결</b><br>${esc(d.takeaway)}</p>
 <p><b>이제 영어 정답과 연결</b><br><span lang="en">${esc(q.opts[0])}</span></p>
 <p class="note">상황 이해용으로 만든 예시이며 실제 사례·공식 시험 해설이 아니에요. 이 설명까지 따로 외우지 않아도 돼요. 익숙해지면 접고 정답 행동만 떠올려 보세요.</p>
 </details></section>`;
}
const quizBeforeTutor=quizHTML,bindBeforeTutor=bindQuiz;
quizHTML=function(){
 const html=quizBeforeTutor();
 if(study==='exam'||(study==='memory'&&!answerVisible)||(study==='practice'&&picked===null))return html;
 const q=qPool()[qi];if(!q)return html;
 return html.replace('<label class="note" for="memoedit">',tutorHTML(q)+'<label class="note" for="memoedit">');
};
bindQuiz=function(v){
 bindBeforeTutor(v);
 const toggle=v.querySelector('#tutor-auto');
 if(toggle)toggle.onchange=()=>{tutorPrefs.autoOpen=toggle.checked;saveTutorPrefs();const d=v.querySelector('#tutor-detail');if(d)d.open=toggle.checked;};
};
render();
