케이션이 직접 스키마 검증을 수행하는가.", "memo": "정해진 형식의 출력이 필요할 때는 규격을 명시해 요청하고 전달 전에 직접 검증한다.", "uid": "A42", "ko": "하류 배송 추적 파이프라인을 위해 구조화된 JSON 출력이 필요한 Claude 애플리케이션을 설계하고 있다. 출력 스키마는 잘 정의되어 있고, 파이프라인은 형식이 잘못된 JSON을 거부한다. 애플리케이션 설계는 어떻게 해야 하는가?"}, {"n": 43, "src": "응용문제1", "a": 3, "tag": "Claude Code / Headless CI Automation", "stem": "You are running Claude Code as part of an automated nightly release pipeline. The pipeline needs Claude Code to execute a set of well-defined tasks without prompting for confirmation, and the output needs to be captured for downstream processing. How would you configure the pipeline?", "opts": ["Run Claude Code in headless mode with the required permissions configured in settings.json and capture its output for downstream processing.", "Turn off every confirmation prompt for Claude Code in all environments, including developer laptops, so the nightly pipeline is never held up by a question.", "Keep Claude Code in interactive mode and assign an on-call engineer to approve each confirmation prompt while the nightly pipeline runs its tasks.", "Move the pipeline to another tool that never asks for confirmation, so no permission setup is needed for the nightly release at all."], "ol": ["D", "A", "B", "C"], "why": "자동화 파이프라인에서는 대화형 프롬프트를 우회하기 위해 Claude Code를 헤드리스 모드로 실행합니다. 승인 요청으로 실행이 멈추지 않도록 필요한 권한만 settings.json에 미리 한정해 정의해 두어야 합니다. 이렇게 하면 출력도 그대로 캡처해 후속 단계로 넘길 수 있습니다.", "trap": "A (Global permission bypass): 모든 환경에서 승인을 끄면 개발자 로컬까지 위험에 노출됩니다. B (Manual approval in CI): 사람이 매번 승인하는 방식은 자동화 파이프라인의 목적 자체를 무력화합니다. C (Unnecessary tool replacement): 권한 설정만 하면 되는 상황에서 도구를 교체하는 것은 불필요한 해결책입니다. → 판단 기준: 비대화형 모드로 실행하면서 필요한 권한만 설정 파일에 미리 한정했는가.", "memo": "사람 개입 없이 자동 실행해야 할 때는 비대화형 모드로 돌리고 권한은 설정 파일에 미리 한정해 둔다.", "uid": "A43", "ko": "자동 야간 릴리스 파이프라인의 일부로 Claude Code를 실행하고 있다. 파이프라인은 Claude Code가 확인 절차 없이 정해진 작업들을 수행하게 해야 하고, 출력은 하류 처리를 위해 캡처되어야 한다. 파이프라인을 어떻게 구성하겠는가?"}, {"n": 44, "src": "응용문제1", "a": 8, "tag": "Extensibility / Skills vs MCP Servers", "stem": "A new engineer on your platform team has asked you to explain when a Skill would be the right choice over an MCP server. The engineer is unsure how the two differ in practice when both can be shared across projects. How would you explain the distinction?", "opts": ["A Skill bundles prompts, scripts, and data into a package the model loads as a unit, while an MCP server exposes resources, tools, and prompts through a standard client interface.", "Choose a Skill whenever a capability is shared across projects, since a Skill starts faster and uses fewer resources than an MCP server in day-to-day runs.", "Treat the two as the same kind of extension, so the engineer may pick either one for any capability that several projects need to share.", "Present the Skill as an older format that an MCP server has replaced, and advise the engineer to build every new shared capability as an MCP server."], "ol": ["B", "A", "C", "D"], "why": "두 확장 방식의 차이는 성능이나 출시 시점이 아니라 구조적 정의에 있습니다. Skill은 프롬프트·스크립트·데이터를 하나의 패키지로 묶어 모델이 단일 단위로 로드하는 방식이고, MCP 서버는 표준 클라이언트 인터페이스를 통해 리소스·툴·프롬프트를 동적으로 노출하는 클라이언트-서버 구조입니다. 따라서 설명은 이 아키텍처적 구분을 기준으로 해야 합니다.", "trap": "A (Performance-based framing): 로드 효율이나 속도 차이는 두 메커니즘을 구분하는 기준이 아닙니다. C (Interchangeable equivalence): 둘은 상호 교체 가능한 동의어가 아니며 구조와 용도가 명확히 구분됩니다. D (Legacy versus successor): 신구 기술의 대체 관계가 아니라 목적에 따라 함께 쓰는 서로 다른 도구입니다. → 판단 기준: 성능이나 출시 순서가 아니라 각각의 구조적 정의와 동작 방식으로 구분했는가.", "memo": "두 확장 방식 중 무엇을 고를지 판단해야 할 때는 성능이나 신구 여부가 아니라 각각의 구조적 정의와 동작 방식의 차이를 기준으로 삼는다.", "uid": "A44", "ko": "플랫폼 팀의 신입 엔지니어가 MCP 서버 대신 Skill이 맞는 선택인 경우가 언제인지 설명해 달라고 했다. 둘 다 프로젝트 간 공유가 가능한데 실제로 어떻게 다른지 헷갈려 한다. 차이를 어떻게 설명하겠는가?"}, {"n": 45, "src": "응용문제1", "a": 5, "tag": "LLM Fundamentals / Non-determinism", "stem": "You are explaining to a client manager why running the same Claude summarization prompt twice can produce slightly different results. The client manager is concerned this means the service is broken. How would you address the client manager's concern?", "opts": ["Explain that LLMs are non-deterministic by default due to sampling, and describe how the service handles this through validation, retries, or temperature adjustment.", "Say the differences come from slow server response times, and that moving the service onto a faster connection will make each run return the same wording.", "Say the differences are a defect in the code, open a ticket for the next release, and promise that the output will be identical once the ticket is closed.", "Say the differences happen because Anthropic keeps changing the model, and that pinning one fixed model snapshot will remove the variation completely."], "ol": ["B", "A", "C", "D"], "why": "동일 프롬프트의 출력 변동은 고장이 아니라 토큰 샘플링에서 비롯된 LLM의 기본 특성입니다. 따라서 이를 없애려 하기보다 비결정성을 있는 그대로 설명하고, 출력 검증·조건부 재시도·temperature 조정 같은 애플리케이션 계층의 통제 수단으로 일관성을 관리한다고 안내해야 합니다.", "trap": "A (Infrastructure misattribution): 응답 변동은 네트워크 속도나 서버 응답 시간과 아무런 관련이 없습니다. C (Bug misclassification): 확률적 생성 특성은 코드에서 고쳐 없앨 수 있는 소프트웨어 결함이 아닙니다. D (Version pinning fix): 모델 스냅샷을 고정해도 샘플링에서 오는 변동은 완전히 사라지지 않습니다. → 판단 기준: 모델의 본질적 특성으로 설명하고 애플리케이션 계층의 통제 수단으로 관리했는가.", "memo": "모델의 본질적 특성으로 인한 현상을 다뤄야 할 때는 그것을 제거하려 하지 말고 애플리케이션 계층의 통제 장치로 관리한다.", "uid": "A45", "ko": "같은 Claude 요약 프롬프트를 두 번 돌리면 결과가 조금씩 다를 수 있는 이유를 고객사 담당자에게 설명하고 있다. 담당자는 이것이 서비스 고장을 뜻한다고 우려한다. 어떻게 대응하겠는가?"}, {"n": 46, "src": "응용문제1", "a": 1, "tag": "Agent Architecture / Workflow Patterns", "stem": "You are designing an agent that handles a complex loan-review workflow. Each application moves through document extraction, risk scoring, and an approval step. The three subtasks have distinct success criteria, and some applications require iteration between document extraction and risk scoring before an approval decision can be reached. Which agent pattern would you apply?", "opts": ["A graph-based pattern that lets the agent move between subtasks based on the state of each application, with each subtask evaluated against its own criteria.", "One tool-use loop where a single agent is given every tool needed for document extraction, risk scoring, and approval, without separating the three steps.", "A straight sequence that sends every application through document extraction, then risk scoring, then approval, with no path back to an earlier step.", "A streaming pattern that returns partial approval text while the agent works, and keeps refining that text until a final decision appears at the end."], "ol": ["C", "A", "B", "D"], "why": "단계 간 되돌아가는 반복과 조건부 분기가 필요하고 서브태스크마다 성공 기준이 다르면 그래프 기반 패턴이 적합합니다. 그래프 구조에서는 각 신청 건의 상태에 따라 노드 사이를 자유롭게 이동할 수 있고, 노드별로 독립적인 검증 기준을 적용하면서 전체 제어 흐름을 유지할 수 있습니다.", "trap": "A (Single undifferentiated loop): 한 에이전트에 모든 툴을 몰아넣으면 단계별 책임 분리와 정교한 상태 제어가 어렵습니다. B (Fixed linear sequence): 선형 순서 구조는 이전 단계로 되돌아가는 복귀 경로를 지원하지 못합니다. D (Output delivery mechanism): 스트리밍은 출력 전달 방식일 뿐 복잡한 반복 오케스트레이션 패턴이 아닙니다. → 판단 기준: 상태 기반 이동·복귀 경로·노드별 개별 검증이 가능한 구조를 골랐는가.", "memo": "단계 간 되돌아가는 반복과 조건부 분기가 필요할 때는 고정된 순서가 아니라 상태에 따라 이동하는 그래프 구조를 사용한다.", "uid": "A46", "ko": "복잡한 대출 심사 워크플로우를 다루는 에이전트를 설계하고 있다. 각 신청서는 문서 추출 → 위험 점수 산정 → 승인 단계를 거친다. 세 하위 작업은 성공 기준이 각각 다르고, 일부 신청서는 승인 결정에 이르기 전에 문서 추출과 위험 점수 산정 사이를 오가는 반복이 필요하다. 어떤 에이전트 패턴을 적용하겠는가?"}, {"n": 47, "src": "응용문제1", "a": 6, "tag": "Context Engineering / Context Isolation", "stem": "You are designing a multi-step Claude workflow for contract review where some steps must reason without seeing the full prior conversation history. The team wants to keep specific context isolated to specific steps. The context engineering technique you would use is...", "opts": ["context isolation through subagents or multi-step agentic workflows that scope each step's context to only what the step needs.", "one shared prompt reused for every step of the review, with the same wording applied no matter which part of the contract a step is reasoning about.", "inserting the complete conversation history into every step, even for steps that do not need any earlier message to finish their own reasoning.", "adding as much stored content as possible at each step, so that every step in the review can read the entire record of the workflow while it reasons."], "ol": ["D", "A", "B", "C"], "why": "특정 단계가 이전 대화 전체를 보지 않아야 한다면 서브에이전트나 다단계 에이전틱 워크플로우로 컨텍스트를 분리해야 합니다. 각 단계에 그 단계가 필요로 하는 최소한의 정보만 스코프로 제한해 전달하면 불필요한 이력에서 오는 노이즈와 편향을 막고 토큰 비용과 추론 정확도까지 함께 개선할 수 있습니다.", "trap": "A (Single global prompt): 모든 단계에 같은 전역 프롬프트를 쓰면 단계별로 최적화된 컨텍스트 통제가 불가능합니다. B (Full history injection): 필요 여부와 무관하게 전체 이력을 매 단계에 넣는 것은 격리의 목적과 정반대입니다. C (Maximal context augmentation): 가능한 모든 내용을 매 단계에 더하면 노이즈와 토큰 비용만 늘어납니다. → 판단 기준: 각 단계의 컨텍스트를 그 단계에 필요한 범위로만 제한했는가.", "memo": "각 단계가 서로 다른 정보만 봐야 할 때는 모든 맥락을 공유하지 말고 단계별로 필요한 범위만 격리해서 전달한다.", "uid": "A47", "ko": "일부 단계가 이전 대화 기록 전체를 보지 않은 채로 추론해야 하는 다단계 계약 검토 Claude 워크플로우를 설계하고 있다. 팀은 특정 컨텍스트를 특정 단계에만 격리해 두고 싶어 한다. 어떤 컨텍스트 엔지니어링 기법을 쓰겠는가?"}, {"n": 48, "src": "응용문제1", "a": 2, "tag": "Change Management / Downstream Impact Assessment", "stem": "Your team is preparing to roll out a configuration change that updates several output schema versions across a Claude application used by multiple partner services. The change has already been tested in staging, but the team has not assessed how the schema change will affect each partner service that depends on the application's output. What would you do before rolling out the change?", "opts": ["Assess the configuration impact on each partner service before rolling out, and coordinate with partner service owners as needed.", "Record the schema version updates in the release notes and release the change, since passing the staging test already shows what every partner service will receive.", "Send the partner service owners a message that a change is coming, set the release date for next week, and run no formal impact review before that date.", "Release only to the partner services that staging covered, and hold back every remaining service until some later release cycle."], "ol": ["A", "B", "C", "D"], "why": "여러 하위 서비스가 의존하는 변경은 스테이징 통과만으로 안전이 보장되지 않습니다. 배포 전에 각 파트너 서비스가 받을 영향을 구체적으로 평가하고, 필요한 경우 각 서비스 소유자와 사전에 조율해야 합니다. 일정 통보나 부분 배포는 영향도 평가를 대체할 수 없습니다.", "trap": "B (Staging as sufficient evidence): 스테이징 결과만으로 모든 하위 서비스의 영향도가 검증되었다고 볼 수 없습니다. C (Notification without assessment): 일정만 통보하고 평가 없이 배포하면 하위 시스템 장애 위험을 그대로 두는 것입니다. D (Partial scope deferral): 일부에만 배포하고 나머지를 미루는 것은 근본적인 호환성 분석을 대체하지 못합니다. → 판단 기준: 배포 전에 각 하위 시스템의 영향도를 평가하고 소유자와 조율했는가.", "memo": "여러 곳이 의존하는 변경을 적용해야 할 때는 통보나 부분 배포로 대체하지 말고 사전 영향도 평가와 이해관계자 조율을 먼저 수행한다.", "uid": "A48", "ko": "여러 파트너 서비스가 사용하는 Claude 애플리케이션에서 출력 스키마 버전 몇 개를 갱신하는 구성 변경을 배포하려 한다. 스테이징에서 테스트는 마쳤지만, 이 스키마 변경이 애플리케이션 출력에 의존하는 각 파트너 서비스에 어떤 영향을 주는지는 평가하지 않았다. 배포 전에 무엇을 하겠는가?"}, {"n": 49, "src": "응용문제1", "a": 5, "tag": "Model Selection / Cost-Latency Tradeoff", "stem": "You are choosing a Claude model for a high-volume ticket-tagging task. Each tagging call is straightforward, latency requirements are tight, and per-request cost matters at scale. Which model would you choose?", "opts": ["A smaller, faster Claude model, because the task is straightforward and the workload prioritizes latency and per-request cost at scale.", "A mid-tier Claude model as the standard pick, since a middle option gives reasonable quality at a reasonable price for nearly every request the team sends.", "The largest and most capable Claude model, so that every tag is as accurate as possible, and accept the slower replies that come with it.", "Two or more Claude models arranged one after another, with each ticket passing through all of them before the application settles on a final tag."], "ol": ["B", "A", "C", "D"], "why": "작업이 단순하고 지연 시간과 대규모 트래픽에서의 건당 비용이 중요하면 더 작고 빠른 모델이 적합합니다. 단순 분류·태깅 작업은 경량 모델로도 충분한 정확도를 유지하면서 응답 속도와 비용에서 큰 이점을 얻습니다. 요구 수준에 맞춰 모델 등급을 고르는 것이 핵심입니다.", "trap": "A (Default mid-tier choice): 매우 단순한 작업에 중간급 모델을 기본값으로 쓰면 대량 처리 시 오버스펙입니다. C (Maximum capacity overkill): 최상위 모델은 지연이 길고 비용이 비싸 대량의 단순 작업에는 부적절합니다. D (Serial model chaining): 여러 모델을 직렬로 거치면 지연과 비용이 배로 늘어 타이트한 조건에 맞지 않습니다. → 판단 기준: 작업 난이도와 지연·비용 제약에 맞는 가장 가벼운 등급의 모델을 골랐는가.", "memo": "작업이 단순하고 속도와 비용이 중요할 때는 성능이 가장 높은 선택지가 아니라 요구 수준에 맞는 가장 가벼운 선택지를 사용한다.", "uid": "A49", "ko": "대량 티켓 태깅 작업에 쓸 Claude 모델을 고르고 있다. 각 태깅 호출은 단순하고, 지연 시간 요구가 빡빡하며, 규모가 커서 요청당 비용이 중요하다. 어떤 모델을 고르겠는가?"}, {"n": 50, "src": "응용문제1", "a": 4, "tag": "Observability / Root Cause Diagnosis", "stem": "A Claude application that worked well in testing is now occasionally returning product descriptions that mention features not present in the input. The development team initially assumed the model was hallucinating so they asked you to troubleshoot. What would you do first?", "opts": ["Examine production traces to identify whether the issue is hallucination by the model, context loss, prompt injection, or another failure mode before recommending a fix.", "Build a retrieval-augmented generation layer right away so answers are grounded in source documents, and review the production traces only if that layer fails.", "Put a line in the system prompt telling the model to never add facts of its own, since a prompt edit is the quickest available response to made-up content.", "Move the application onto a larger model, since larger models are generally described as inventing fewer details in this kind of task."], "ol": ["D", "A", "B", "C"], "why": "증상만 보고 원인을 단정한 상태에서 수정부터 적용하면 안 됩니다. 프로덕션 트레이스를 정밀하게 분석해 실제 원인이 모델의 환각인지, 컨텍스트 손실인지, 프롬프트 주입인지, 또 다른 실패 유형인지 식별한 뒤에 대응책을 제안해야 합니다.", "trap": "A (Premature architectural fix): 원인 파악 없이 RAG 계층부터 도입하면 불필요한 아키텍처 공수가 발생합니다. B (Prompt-only instruction): 원인이 컨텍스트 손실이나 프롬프트 주입이면 문구 추가만으로는 해결되지 않습니다. C (Model swap guess): 더 큰 모델로 교체하는 것은 원인 없는 임시방편이며 비용과 지연만 늘립니다. → 판단 기준: 수정 조치보다 실제 실행 기록 분석을 통한 근본 원인 식별을 먼저 했는가.", "memo": "원인이 확정되지 않은 문제를 다뤄야 할 때는 곧바로 수정하지 말고 실제 실행 기록을 분석해 근본 원인을 먼저 식별한다.", "uid": "A50", "ko": "테스트에서는 잘 작동하던 Claude 애플리케이션이 이제 입력에 없는 기능을 언급하는 제품 설명을 가끔 내놓는다. 개발팀은 처음에 모델이 환각을 일으킨다고 가정하고 당신에게 조사를 요청했다. 가장 먼저 무엇을 하겠는가?"}, {"n": 51, "src": "응용문제1", "a": 8, "tag": "Tool Use / Pre-dispatch Schema Validation", "stem": "Your Claude application uses tool calling to fetch shipment records and generate delivery reports. The flow occasionally fails because the model returns a tool_use block that references arguments not present in the schema, and your application code does not handle this case gracefully. How would you address this?", "opts": ["Validate the tool_use block's arguments against the tool schema before dispatching the tool and handle invalid arguments as a recognized error path.", "Write invalid tool_use blocks to the log but still call the tool, and depend on whatever error the tool itself returns to reveal the problem to the application.", "Send the identical request again and again until a tool_use block finally arrives with arguments that fit the schema.", "Remove tool calling from the flow and instead ask the model to write out in plain text which shipment lookup it would perform."], "ol": ["D", "A", "B", "C"], "why": "모델이 만든 tool_use 인자는 툴을 실제로 실행하기 전에 스키마와 대조해 검증해야 합니다. 인자가 규격에 맞지 않으면 애플리케이션이 죽거나 부작용을 남기지 않도록 정식 오류 경로로 처리하고, 잘못된 인자라는 사실을 tool_result로 모델에 돌려주어 스스로 교정하게 만드는 것이 모범 사례입니다.", "trap": "A (Post-dispatch error handling): 잘못된 인자를 그대로 넘겨 실행하면 실행 오류나 부작용이 발생합니다. B (Blind retry loop): 동일 요청을 무작정 반복하는 것은 무한 루프와 토큰 낭비로 이어집니다. C (Capability abandonment): 툴 호출 자체를 포기하는 것은 문제 해결이 아니라 회피입니다. → 판단 기준: 툴 실행 전에 스키마로 인자를 검증하고 위반 시 정식 오류 경로로 처리했는가.", "memo": "모델이 만든 입력으로 실제 동작을 실행해야 할 때는 실행 전에 규격과 대조해 검증하고 위반 시 정해진 오류 경로로 처리한다.", "uid": "A51", "ko": "당신의 Claude 애플리케이션은 도구 호출로 배송 기록을 가져와 배달 보고서를 만든다. 모델이 스키마에 없는 인자를 참조하는 tool_use 블록을 반환하는 경우가 가끔 있고, 애플리케이션 코드가 이 경우를 제대로 처리하지 못해 흐름이 실패한다. 어떻게 해결하겠는가?"}, {"n": 52, "src": "응용문제1", "a": 8, "tag": "MCP / Transport Selection", "stem": "You are choosing between using STDIO-based communication and HTTP-based communication for an MCP server. The server will be started by a desktop Claude client running on the same machine. Which communication pattern would you use?", "opts": ["STDIO because STDIO is well-suited to local process communication and avoids unnecessary network setup.", "Repeated HTTP polling of the MCP server, used in place of the transports that the MCP specification actually defines.", "Both STDIO and HTTP kept running at once for backup, so the desktop client has a second transport available if the first one stops.", "HTTP, because HTTP should always be picked ahead of STDIO no matter where the server runs or which client starts it."], "ol": ["B", "A", "C", "D"], "why": "클라이언트와 서버가 같은 머신에서 로컬 프로세스로 동작하면 MCP 규격은 표준 입출력(STDIO) 전송을 권장합니다. STDIO는 포트 바인딩, HTTP 오버헤드, 네트워크 보안 설정 없이 자식 프로세스로 단순하고 빠르게 통신할 수 있습니다. 원격 환경일 때만 HTTP 계열 전송을 사용합니다.", "trap": "A (Non-standard transport): HTTP 폴링은 MCP가 규정한 표준 전송 패턴이 아닙니다. C (Redundant dual transport): 같은 로컬 세션에서 두 전송을 동시에 돌리는 것은 불필요한 구조적 복잡성만 만듭니다. D (Context-blind preference): 배치 환경을 무시하고 항상 HTTP가 낫다고 보는 것은 잘못된 주장입니다. → 판단 기준: 실행 주체가 로컬인지 원격인지에 맞는 표준 전송 방식을 골랐는가.", "memo": "통신 방식을 골라야 할 때는 무조건 하나를 선호하지 말고 실행 주체가 로컬인지 원격인지에 맞는 표준 전송 방식을 사용한다.", "uid": "A52", "ko": "MCP 서버에 STDIO 기반 통신과 HTTP 기반 통신 중 무엇을 쓸지 고르고 있다. 이 서버는 같은 기기에서 실행되는 데스크톱 Claude 클라이언트가 기동한다. 어떤 통신 방식을 쓰겠는가?"}, {"n": 53, "src": "응용문제1", "a": 6, "tag": "Prompt Engineering / Few-Shot Examples", "stem": "Your Claude application produces good responses for typical support tickets but struggles with unusual ones. You have several labeled examples of unusual ticket inputs and the desired response for each. You want to use these examples to improve the model's handling of unusual tickets. What is the best way to use these examples?", "opts": ["Add the labeled unusual-ticket examples to the prompt as few-shot examples so the model can learn the pattern.", "Place a notice on the support form asking people not to send unusual tickets to the application at all.", "Store the examples as vectors in a search index and let the model look them up while it answers.", "Build and fine-tune a separate model of your own from the collected examples, then serve that model instead of the current Claude integration."], "ol": ["A", "B", "C", "D"], "why": "원하는 입력-출력 쌍을 이미 확보했다면 이를 프롬프트에 퓨샷 예제로 직접 넣는 것이 가장 빠르고 효과적입니다. 모델은 컨텍스트 안의 예제로 in-context learning을 수행해 해당 패턴을 파악하고 비슷한 예외 상황을 정확하게 처리하게 됩니다.", "trap": "B (Input avoidance workaround): 사용자가 해당 입력을 넣지 못하게 막는 것은 근본적인 해결책이 아닙니다. C (Retrieval indirection): 검색 계층을 거치는 방식은 프롬프트에 직접 제시하는 것보다 패턴 학습 효과가 떨어집니다. D (Custom model training): 소수의 예제를 위해 별도 모델을 학습시키는 것은 비용과 시간이 드는 오버엔지니어링입니다. → 판단 기준: 확보한 예제를 프롬프트 내 퓨샷 예제로 직접 제시했는가.", "memo": "원하는 입출력 예제를 이미 확보했을 때는 별도 학습이나 검색 계층을 두지 말고 프롬프트에 예제로 직접 제시한다.", "uid": "A53", "ko": "당신의 Claude 애플리케이션은 일반적인 지원 티켓에는 좋은 응답을 내지만 특이한 티켓에는 약하다. 특이한 티켓 입력과 각각에 대한 바람직한 응답이 라벨링된 예시가 여럿 있다. 이 예시들로 특이 티켓 처리를 개선하고 싶다. 예시를 쓰는 가장 좋은 방법은 무엇인가?"}, {"n": 1, "src": "응용문제2", "a": 4, "tag": "Error Handling / Output Validation", "stem": "A health insurance company uses Claude to turn scanned claim forms into structured JSON records, and a schema check runs on every record before it is stored. Right now any record that does not pass the schema check is treated as a fatal error, so the whole claim submission is rejected. The team wants a more graceful way to deal with these failures. How would you handle the validation failures?", "opts": ["Treat validation failures as a recognized error path that triggers retry, repair, or fallback logic before failing the claim submission.", "Inform the claims staff that broken output is a normal limit of the model, and ask each reviewer to check every extracted field by hand before approving a claim.", "Forward the malformed record to the billing and audit services without any change, so each of those services can decide on its own what to do with it.", "Turn the schema check off for the intake pipeline until engineers find the root cause and ship a fix in a later release."], "ol": ["C", "A", "B", "D"], "why": "검증 실패를 예외적인 종료 사유가 아니라 이미 예상된 에러 경로로 다루고, 요청을 실패시키기 전에 재시도·자동 수정·대체값 같은 복구 로직을 먼저 태우는 것이 핵심입니다. 보험 청구 파이프라인이라는 상황만 달라졌을 뿐, 검증 실패를 시스템 내부에서 복구 가능한 상태로 설계했는지를 묻는 기준은 원본과 같습니다.", "trap": "A (Manual verification): 사람이 손으로 검수하게 넘기는 것은 개발적 해결책이 아니며, 시스템은 여전히 복구 능력이 없습니다. B (Downstream deferral): 깨진 레코드를 하위 시스템으로 그대로 흘려보내면 오류가 청구·감사 전반으로 확산됩니다. D (Disable validation): 검증 자체를 끄는 것은 문제를 감추는 것일 뿐 시스템의 안정성과 신뢰성을 포기하는 선택입니다. → 판단 기준: 검증 실패를 '예상된 에러 경로'로 보고 실패 처리 전에 재시도·수정·대체 로직을 먼저 실행하는가.", "memo": "검증에 실패했을 때는 곧바로 실패시키지 말고 재시도·수정·대체 경로로 복구한다.", "uid": "B1", "ko": "건강보험사가 Claude로 스캔된 청구 양식을 구조화된 JSON 기록으로 바꾸고, 저장 전에 모든 기록에 스키마 검사를 돌린다. 현재는 스키마 검사를 통과하지 못한 기록을 치명적 오류로 처리해 청구 제출 전체가 거부된다. 팀은 이 실패를 더 유연하게 다루고 싶어 한다. 검증 실패를 어떻게 처리하겠는가?"}, {"n": 2, "src": "응용문제2", "a": 4, "tag": "Observability / Error Severity Routing", "stem": "A freight tracking platform calls many carrier APIs through its Claude service, and every failure it receives is written to the log at one single severity level. The operations team now wants to separate failures that must page the on-call engineer right away from failures that only need to be recorded and read during the next review. How would you structure the error handling?", "opts": ["Categorize errors by severity based on impact and recoverability, then route each category to the appropriate channel for paging or logging.", "Store only the failures that trigger an alert, and write nothing at all for the remaining failures, because no engineer is called out for them anyway.", "Give all carrier failures one shared severity level, because sorting them into grades makes the platform harder to maintain and rarely returns enough value.", "Send an alert to the duty engineer for every failure, because alerting on all of them makes sure the team never overlooks a single problem in production."], "ol": ["A", "B", "C", "D"], "why": "영향도(Impact)와 복구 가능성(Recoverability)이라는 두 축으로 에러 등급을 먼저 나누고, 등급별로 즉시 호출(page) 채널과 기록(log) 채널로 다르게 보내는 것이 정답 기준입니다. 물류 배송 추적이라는 상황만 바뀌었을 뿐, '분류 후 차등 대응' 구조를 세웠는지를 묻는 논리는 원본과 동일합니다.", "trap": "B (Selective log suppression): 알림 대상이 아니라고 기록조차 남기지 않으면 추후 이슈 추적과 모니터링이 불가능해집니다. C (Uniform severity): 모든 에러를 같은 등급으로 두는 것은 지금 겪고 있는 문제 상황을 그대로 남겨 두는 선택입니다. D (Universal paging): 모든 에러를 당직자에게 알리면 경보 피로(Alert Fatigue)가 생겨 정작 중요한 장애 알림을 놓칩니다. → 판단 기준: 영향도와 복구 가능성으로 심각도를 분류한 뒤 등급별로 서로 다른 채널에 라우팅하는가.", "memo": "대응 수준을 나눠야 할 때는 영향도와 복구 가능성으로 등급을 분류해 알맞은 채널로 보낸다.", "uid": "B2", "ko": "화물 추적 플랫폼이 Claude 서비스를 통해 여러 운송사 API를 호출하는데, 받은 모든 실패를 단일 심각도로 로그에 기록한다. 운영팀은 당직 엔지니어를 즉시 호출해야 하는 실패와, 기록만 해두고 다음 검토 때 읽으면 되는 실패를 분리하려 한다. 오류 처리를 어떻게 구조화하겠는가?"}, {"n": 3, "src": "응용문제2", "a": 1, "tag": "Agent Architecture / Context Management", "stem": "A factory quality team runs a Claude agent that inspects each production batch. During one inspection the agent makes many tool calls to read sensor values, defect photos, and machine logs, so the conversation history grows quickly. After about 20 tool calls the agent's answers become less focused and it sometimes ignores the pass and fail limits it was given at the start of the batch. How would you address this?", "opts": ["Apply context engineering techniques such as tool output pruning or compaction to keep the active task state visible while reducing the volume of older content.", "Clear the session and start the agent again after each group of five tool calls, accepting that all task state gathered up to that point is deleted every time.", "Move to a model with a much larger context window, so every sensor report and machine log can stay in the conversation at full detail for the whole inspection.", "Take all tools away from the agent and let it write one plain text report instead, so no tool results are ever added to the conversation."], "ol": ["D", "A", "B", "C"], "why": "오래된 툴 출력은 가지치기(pruning)와 압축(compaction)으로 양을 줄이되, 현재 진행 중인 검사 상태와 처음에 받은 합격·불합격 기준은 그대로 보이게 유지하는 것이 정답 기준입니다. 제조 품질 검사라는 상황만 낯설 뿐, '상태 보존'과 '컨텍스트 축소'를 동시에 만족하는 선택지를 고르는 논리는 원본과 같습니다.", "trap": "A (Periodic state reset): 주기적으로 리셋하면 작업 상태(Task State)까지 함께 사라져 여러 단계로 이어지는 검사를 끝낼 수 없습니다. B (Capacity scaling only): 컨텍스트 창만 키우면 불필요한 정보(Noise)가 계속 쌓여 집중도 저하가 근본적으로 해결되지 않고 비용과 지연 시간만 늘어납니다. C (Capability removal): 툴 호출 자체를 없애면 에이전트가 수행해야 할 복합 작업 자체가 불가능해집니다. → 판단 기준: 핵심 작업 상태와 초기 제약은 남기면서 오래된 내용만 정리·압축하는가.", "memo": "쌓인 내용이 성능을 떨어뜨릴 때는 핵심 상태는 남기고 오래된 부분만 정리·압축한다.", "uid": "B3", "ko": "공장 품질팀이 생산 배치를 검사하는 Claude 에이전트를 운영한다. 검사 한 번에 센서 값·불량 사진·장비 로그를 읽는 도구 호출이 많아 대화 기록이 빠르게 늘어난다. 도구 호출 20회쯤부터 에이전트의 답변이 초점을 잃고, 배치 시작 때 준 합격·불합격 기준을 무시하기도 한다. 어떻게 해결하겠는가?"}, {"n": 4, "src": "응용문제2", "a": 2, "tag": "Lifecycle / Post-Deployment Operations", "stem": "A city government has just launched a Claude-powered permit review assistant to production. The build work is finished, and clerks across several departments now use the assistant for their daily caseload. The next phase of work for this system is...", "opts": ["operating and maintaining the system, including monitoring, responding to issues, and planning evolution.", "holding a formal meeting to grade how the build phase went, and doing no further work on the assistant until that review is complete.", "shutting the assistant down, because reaching production is the last stage in the life of any software product.", "transferring full ownership to a separate operations group that will run the assistant on its own, with no further involvement from the team that built it."], "ol": ["B", "A", "C", "D"], "why": "프로덕션 배포는 개발의 끝이 아니라 운영·유지보수 단계의 시작입니다. 응답 품질과 지연 시간, 오류율을 계속 모니터링하고, 문제가 생기면 대응하며, 사용자 피드백을 반영해 진화 계획을 세워야 합니다. 지자체 인허가 시스템으로 상황만 바뀌었을 뿐, 배포 이후 지속적 운영 책임이 이어지는지를 묻는 기준은 원본과 같습니다.", "trap": "A (Review-only step): 사후 검토만 하고 다음 작업을 멈추면 지속적인 운영 단계가 통째로 빠집니다. C (Immediate retirement): 배포 직후 시스템을 폐기한다는 설명은 라이프사이클을 잘못 이해한 것입니다. D (Complete team handoff): 개발팀과 완전히 분리해 넘기는 방식은 지속적 협업과 통합 관리를 지향하는 운영 문화와 맞지 않습니다. → 판단 기준: 배포 이후 모니터링·이슈 대응·진화 계획을 포함한 운영 책임이 계속 이어지는가.", "memo": "배포가 완료됐을 때는 지속적인 운영·유지보수 단계로 이어간다.", "uid": "B4", "ko": "한 시청이 Claude 기반 인허가 검토 어시스턴트를 프로덕션에 막 출시했다. 구축 작업은 끝났고 여러 부서 담당자들이 매일 업무에 쓰고 있다. 이 시스템의 다음 단계 작업은 무엇인가?"}, {"n": 5, "src": "응용문제2", "a": 1, "tag": "Agent Safety / Hook Scoping", "stem": "A logistics company runs a Claude agent that manages warehouse inventory records. Safety hooks currently run before every single action the agent takes, including simple stock lookups that change nothing, and the extra checks have made the agent much slower. The team wants to scope hooks more carefully. How would you scope the hooks?", "opts": ["Scope hooks to only the high-risk actions, such as destructive operations or sensitive data access, and remove hooks from low-risk actions to balance safety with performance.", "Switch every hook off while the team works out a new scope, and accept that no checks run at all during that period.", "Delete the hooks and write the same rules into the system prompt instead, since written instructions give the agent the same level of enforcement.", "Shut the agent down during the busiest shipping hours, so the cost of running hooks never slows the warehouse system when demand is at its peak."], "ol": ["D", "A", "B", "C"], "why": "안전 검증은 전부 켜거나 전부 끄는 문제가 아니라 범위를 조정하는 문제입니다. 재고 삭제나 민감 데이터 접근처럼 되돌리기 어려운 고위험 작업에만 훅을 적용하고, 단순 조회 같은 저위험 작업에서는 훅을 제거해 속도를 회복해야 합니다. 물류 창고라는 상황만 다를 뿐 안전성과 성능의 균형을 어떻게 잡는지 묻는 기준은 원본과 같습니다.", "trap": "A (Blanket disabling): 훅을 전부 끄면 재조정 기간 내내 심각한 안전·보안 위험에 그대로 노출됩니다. B (Prompt-only enforcement): 프롬프트 지시는 강제력이 없어 훅을 대체할 수 없고 우회나 환각에 취약합니다. C (Availability sacrifice): 바쁜 시간대에 에이전트를 중단하는 것은 성능 문제를 가용성 포기로 바꾸는 것일 뿐입니다. → 판단 기준: 안전성을 유지한 채 고위험 작업으로만 검증 범위를 좁혔는가.", "memo": "안전장치가 성능을 해칠 때는 고위험 작업에만 범위를 좁혀 적용한다.", "uid": "B5", "ko": "물류 회사가 창고 재고 기록을 관리하는 Claude 에이전트를 운영한다. 안전 훅이 현재 에이전트의 모든 동작 전에 실행되는데, 아무것도 바꾸지 않는 단순 재고 조회까지 포함되어 추가 검사 때문에 에이전트가 훨씬 느려졌다. 팀은 훅 범위를 더 신중히 정하려 한다. 어떻게 정하겠는가?"}, {"n": 6, "src": "응용문제2", "a": 2, "tag": "Code Review / API Integration Standards", "stem": "A teammate opens a pull request that adds a Claude-powered paper screening feature to your academic literature platform. The feature works on sample papers, but the prompt text and the model name are written directly into the function, nothing handles a failed API call, and no tests cover the integration. What would you request during code review?", "opts": ["Request changes that move prompt and model configuration to a configurable location, add error handling for Claude API failures, and add tests for the integration.", "Approve the pull request now and write the missing configuration, error handling, and tests yourself in a later commit, so your teammate can start the next task.", "Approve the pull request without changes, since the feature already works when nothing goes wrong, and note the missing parts as later cleanup.", "Request changes for the configuration and the tests, but let the missing handling of API failures wait for a later release."], "ol": ["C", "A", "B", "D"], "why": "프롬프트와 모델 설정은 코드에서 분리해 구성 파일이나 환경 변수로 관리해야 하고, 레이트 리밋·타임아웃·5xx 같은 API 장애에 대한 에러 처리와 연동 테스트가 함께 있어야 합니다. 문헌 검토 플랫폼으로 상황만 바뀌었을 뿐, 세 가지를 모두 머지 전 조건으로 요구해야 한다는 기준은 원본과 같습니다.", "trap": "A (Reviewer self-patching): 리뷰어가 대신 메우면 작성자가 기준을 배우지 못하고 품질 책임도 흐려집니다. B (Approve as-is): 정상 경로에서만 동작한다는 이유로 승인하면 설정 분리·에러 처리·테스트가 모두 빠진 코드가 그대로 들어갑니다. D (Partial deferral): API 에러 처리를 미루면 장애 발생 시 서비스 전체가 멈추는 결과로 직결됩니다. → 판단 기준: 설정 외부화·API 장애 에러 처리·통합 테스트 세 가지를 머지 전에 모두 요구했는가.", "memo": "외부 API 연동을 리뷰할 때는 설정 분리·에러 처리·테스트를 함께 요구한다.", "uid": "B6", "ko": "동료가 학술 문헌 플랫폼에 Claude 기반 논문 선별 기능을 추가하는 풀 리퀘스트를 열었다. 샘플 논문에서는 작동하지만, 프롬프트 텍스트와 모델 이름이 함수 안에 직접 쓰여 있고, API 호출 실패를 처리하는 부분이 없으며, 통합 테스트도 없다. 코드 리뷰에서 무엇을 요청하겠는가?"}, {"n": 7, "src": "응용문제2", "a": 6, "tag": "Prompt Engineering / Eval-Driven Iteration", "stem": "A bank screens loan applications with a Claude prompt that was written last year and has not been touched since. Recent evals show that quality drops sharply on applications from self-employed borrowers, a group whose share of incoming volume has grown a lot. How would you respond?", "opts": ["Iterate on the prompt to address the underperforming category, validate the change with evals, and continue refining as needed.", "Discard the current prompt and write a brand new one built only for self-employed applications, treating any drop on the common cases as an accepted cost.", "Leave the prompt unchanged and show a notice in the review screen warning staff that some application types are handled less well.", "Route self-employed applications to a second, separate Claude application with its own prompt, so the original prompt never has to change."], "ol": ["C", "A", "B", "D"], "why": "성능이 떨어진 범주를 겨냥해 프롬프트를 조금씩 고치고, 수정할 때마다 평가 세트를 돌려 해당 범주가 개선됐는지와 기존 케이스에 리그레션이 없는지를 확인하며 반복해야 합니다. 대출 심사라는 상황만 낯설 뿐, 평가 기반 반복 개선을 거쳤는지 묻는 기준은 원본과 같습니다.", "trap": "A (Wholesale replacement): 문제 범주만 보고 전면 교체하면 잘 되던 일반 케이스의 성능이 크게 떨어질 수 있습니다. B (Surface-level workaround): 화면 경고문으로 우회하는 것은 원인을 그대로 둔 임시방편입니다. D (System duplication): 한 범주의 품질 저하 때문에 애플리케이션을 쪼개면 불필요한 복잡도만 늘어납니다. → 판단 기준: 프롬프트를 개선한 뒤 평가로 개선과 리그레션을 검증하며 반복하는가.", "memo": "일부 입력에서 품질이 떨어질 때는 개선 후 평가로 검증하며 반복한다.", "uid": "B7", "ko": "한 은행이 작년에 작성된 뒤 손대지 않은 Claude 프롬프트로 대출 신청을 심사한다. 최근 평가에서 자영업자 신청서에 대한 품질이 크게 떨어지는 것이 확인됐는데, 이 집단의 유입 비중은 크게 늘었다. 어떻게 대응하겠는가?"}, {"n": 8, "src": "응용문제2", "a": 4, "tag": "Error Handling / Output Format Drift", "stem": "A clinic uses a Claude assistant that collects patient intake details through a multi-turn chat and returns each answer as a JSON record. The first few turns return well-formed records, but as the chat continues the records slowly lose their expected structure. How would you address the drift?", "opts": ["Identify the failure mode as format drift, examine how the conversation context evolves over turns, and address the drift through context management or output validation.", "Start a fresh session after each patient answer and watch whether the JSON stays correct across the turns that follow.", "Keep only the opening characters of each reply, check that this short piece matches the expected JSON shape, and record every mismatch in a log for review.", "Move the assistant to a smaller Claude model and run the intake chat again to see whether the drift still appears in later turns."], "ol": ["A", "B", "C", "D"], "why": "먼저 이 현상을 형식 드리프트라는 실패 모드로 규정하고, 턴이 쌓이면서 대화 컨텍스트가 어떻게 변하고 스키마 지시가 어떻게 희석되는지 확인해야 합니다. 그다음 핵심 지시를 매 턴 재강조하거나 이력을 정리하는 컨텍스트 관리, 또는 출력 검증과 재요청·복구 로직으로 대응합니다. 의료 인테이크로 상황만 바뀌었을 뿐 판단 기준은 원본과 같습니다.", "trap": "B (Context discarding): 매 턴 세션을 새로 시작하면 앞선 문진 내용이 모두 사라져 멀티턴 인테이크 자체가 불가능해집니다. C (Partial output validation): 앞부분 몇 글자만 잘라 확인하는 방식으로는 전체 JSON 스키마의 유효성을 판단할 수 없습니다. D (Model swap): 더 작은 모델로 바꿔도 턴 누적에 따른 컨텍스트 이탈은 해결되지 않고 지시 수행력만 떨어질 수 있습니다. → 판단 기준: 원인을 진단한 뒤 컨텍스트 관리 또는 출력 검증으로 대응하는가.", "memo": "출력 형식이 점차 무너질 때는 원인을 진단해 컨텍스트 관리와 출력 검증으로 대응한다.", "uid": "B8", "ko": "한 병원이 다중 턴 채팅으로 환자 접수 정보를 수집해 각 답변을 JSON 기록으로 반환하는 Claude 어시스턴트를 쓴다. 처음 몇 턴은 형식이 온전한 기록을 반환하지만, 대화가 이어질수록 기대 구조가 서서히 무너진다. 이 형식 이탈을 어떻게 해결하겠는가?"}, {"n": 9, "src": "응용문제2", "a": 1, "tag": "Architecture / Abstraction Trade-offs", "stem": "An airline's engineering team is deciding whether to call the Claude API directly or to work through a third-party layer that can talk to several LLM vendors. Every current and planned use case for its maintenance log assistant runs on Claude, no internal group has asked for vendor portability, and the two-year roadmap says nothing about supporting other providers. The shared layer would add roughly 15 percent more code complexity and one more dependency. Which integration approach would you recommend?", "opts": ["Direct integration with Claude through its SDK, because no multi-provider need exists and abstraction would add complexity that does not pay off.", "A multi-vendor wrapper written by the team itself, so the airline owns every part of the layer that sits between its code and the model API.", "The third-party layer, since the ability to change vendors later is worth having in any system as general protection for the future.", "Keep both paths live at the same time and send some runs through each one, so the team can compare how they behave in production over months."], "ol": ["B", "A", "C", "D"], "why": "확인된 멀티 벤더 요구도 없고 로드맵에도 계획이 없는 상황에서 추상화 계층은 비용만 남기는 과잉 설계입니다. 공식 SDK로 직접 연동해야 복잡도와 의존성을 줄이고 API의 최신 기능도 온전히 쓸 수 있습니다. 항공사 정비 기록이라는 상황만 다를 뿐, 입증되지 않은 유연성에 값을 치르지 않는다는 기준은 원본과 같습니다.", "trap": "A (In-house abstraction): 자체 추상화를 만드는 것은 필요 없는 개발 자원과 장기 유지보수 비용을 새로 만드는 일입니다. C (Speculative flexibility): 막연한 미래 유연성을 이유로 지금 필요 없는 라이브러리를 넣으면 오버헤드만 남습니다. D (Parallel maintenance): 두 경로를 함께 유지하면 개발과 테스트 복잡도가 두 배가 됩니다. → 판단 기준: 입증된 요구가 없는 이식성에 복잡도 비용을 치르지 않고 직접 연동하는가.", "memo": "입증된 요구가 없을 때는 추상화를 더하지 않고 직접 연동한다.", "uid": "B9", "ko": "한 항공사 엔지니어링 팀이 Claude API를 직접 호출할지, 여러 LLM 벤더와 통신할 수 있는 서드파티 계층을 거칠지 결정 중이다. 정비 로그 어시스턴트의 현재와 계획된 사용 사례가 모두 Claude에서 동작하고, 벤더 이식성을 요구한 내부 조직이 없으며, 2년 로드맵에 타 공급자 지원 언급이 없다. 공유 계층을 쓰면 코드 복잡도가 약 15% 늘고 의존성이 하나 추가된다. 어떤 연동 방식을 권하겠는가?"}, {"n": 10, "src": "응용문제2", "a": 1, "tag": "Architecture / Task Decomposition", "stem": "A real estate brokerage is designing a Claude application that handles buyer inquiries in two stages: a routing stage that labels each inquiry by property type and urgency, and a drafting stage that writes the agent's reply. The team is debating whether to use a single Claude call that handles both stages or separate Claude calls for each stage. How would you structure the application?", "opts": ["Use separate Claude calls for routing and drafting, because each stage has distinct inputs, outputs, and success criteria that benefit from focused prompts.", "Send the same inquiry to several Claude calls at once so each writes a full reply, then add one more call whose only job is to pick the best reply to send.", "Handle both stages inside one Claude call, on the grounds that one call always costs less than two calls in any production system.", "Use a Claude call for routing only, and generate every reply from a fixed rule engine, on the grounds that rule engines write more dependable replies."], "ol": ["B", "A", "C", "D"], "why": "분류 단계와 작성 단계는 입력과 출력 형식, 성공 기준이 서로 다르므로 호출을 나누고 각각 목적에 집중된 프롬프트를 써야 정확도가 올라갑니다. 오류가 났을 때 어느 단계 문제인지 추적하기도 쉬워집니다. 부동산 문의라는 상황만 바뀌었을 뿐 단계 분리 여부를 판단하는 기준은 원본과 같습니다.", "trap": "A (Parallel sampling): 여러 개를 동시에 생성한 뒤 하나를 고르는 방식은 비용과 지연 시간만 늘립니다. C (Cost-only consolidation): 비용만 근거로 두 작업을 한 호출에 묶으면 지시 이탈과 환각이 늘어 품질이 떨어집니다. D (Rule-based substitution): 상황에 맞춘 답변 초안 작성은 룰 엔진보다 LLM이 훨씬 잘하는 영역입니다. → 판단 기준: 단계별 입력·출력·성공 기준이 다를 때 호출을 분리해 각각 특화했는가.", "memo": "단계마다 입출력과 성공 기준이 다를 때는 호출을 분리해 각각 특화한다.", "uid": "B10", "ko": "한 부동산 중개사가 매수 문의를 두 단계로 처리하는 Claude 애플리케이션을 설계 중이다. 문의를 매물 유형과 긴급도로 분류하는 라우팅 단계와, 중개인의 답변을 작성하는 초안 단계다. 팀은 두 단계를 한 번의 Claude 호출로 할지 나눌지 논의 중이다. 어떻게 구성하겠는가?"}, {"n": 11, "src": "응용문제2", "a": 3, "tag": "Claude Code / Skill Definition Location", "stem": "A telecom network engineering team wants to extend Claude Code with a custom Skill that anyone on the team can invoke during a session. The Skill is a set of written instructions plus a helper script that Claude should be able to run once the Skill is loaded. Where is the right place to define the Skill?", "opts": ["Define the Skill in a Skills directory recognized by Claude Code, where Claude can discover and load it during sessions for the team's repositories.", "Define the Skill as an ordinary module inside the product's own source tree and call it from application code rather than from a Claude Code session.", "Place the entire Skill, helper script included, as one long block of text at the top of every CLAUDE.md in the team's repositories so it is always present.", "Keep the Skill in a private working folder on each engineer's laptop and load it by hand before any session that needs it."], "ol": ["D", "A", "B", "C"], "why": "Claude Code는 규약된 스킬 디렉터리에 있는 스킬을 세션 중 자동으로 탐색하고 로드합니다. 저장소 안의 그 위치에 두어야 팀 전체가 같은 스킬을 별도 조작 없이 공유해 쓸 수 있습니다. 통신사 엔지니어링 팀이라는 상황만 다를 뿐, 자동 탐색과 팀 표준화를 동시에 만족하는 위치를 고르는 기준은 원본과 같습니다.", "trap": "A (Application library module): 일반 라이브러리 모듈로 만들면 대화형 세션에서 스킬로 호출한다는 목적과 맞지 않습니다. B (Inline context file): CLAUDE.md는 프로젝트 컨텍스트와 지시사항용이며, 실행 스크립트까지 인라인으로 넣는 표준 방식이 아닙니다. C (Manual local loading): 개인 폴더에 두고 매번 수동으로 불러오면 팀 차원의 표준화와 공유가 되지 않습니다. → 판단 기준: 규약된 스킬 디렉터리에 두어 세션 중 자동 탐색되고 팀이 공유할 수 있는가.", "memo": "확장 기능을 팀이 함께 써야 할 때는 규약된 위치에 두어 자동 탐색되게 한다.", "uid": "B11", "ko": "통신사 네트워크 엔지니어링 팀이, 팀원 누구나 세션 중에 호출할 수 있는 커스텀 Skill로 Claude Code를 확장하려 한다. 이 Skill은 작성된 지시사항과, Skill이 로드되면 Claude가 실행할 수 있어야 하는 보조 스크립트로 구성된다. Skill을 정의할 올바른 위치는 어디인가?"}, {"n": 12, "src": "응용문제2", "a": 1, "tag": "Agent Architecture / Workflow vs Agent", "stem": "A payroll team is designing an agent that processes weekly timesheets. Most submissions follow a small set of well-understood steps, but now and then a timesheet arrives in an unexpected layout and the system must choose between rerouting it, asking the submitter for clarification, or flagging it for a human reviewer. The most appropriate architecture for this system is...", "opts": ["a workflow for the standard path with an agent invoked at the decision point for unexpected layouts.", "one very large prompt that takes every timesheet, normal or unusual, and completes all of the work inside a single model call.", "an agent with complete freedom that carries every timesheet from start to finish, whatever layout it arrives in.", "a manager agent that hands each routine step to its own subagent, plus one more subagent created for every unusual layout that appears."], "ol": ["B", "A", "C", "D"], "why": "예측 가능한 정형 처리는 코드 기반 워크플로우로 고정해 신뢰성과 비용·지연 시간을 확보하고, 비정형 예외가 나오는 분기점에서만 동적으로 판단하는 에이전트를 호출하는 하이브리드가 정답입니다. 급여 타임시트라는 상황만 바뀌었을 뿐, 워크플로우와 에이전트를 어디에 배치할지 판단하는 기준은 원본과 같습니다.", "trap": "A (Monolithic single prompt): 한 번의 호출에 판단과 처리를 모두 밀어 넣으면 예외 상황에서 환각과 지시 누락이 늘어납니다. C (Full autonomy): 정형 작업까지 완전 자율 에이전트에 맡기면 비용·속도·예측 가능성이 모두 나빠집니다. D (Subagent over-engineering): 단계마다 매니저와 서브에이전트를 두는 구조는 복잡도와 지연 시간만 늘리는 과잉 설계입니다. → 판단 기준: 정형 경로는 워크플로우로 고정하고 예외 분기점에서만 에이전트를 호출하는가.", "memo": "대부분 정형이고 일부만 예외일 때는 워크플로우에 필요한 지점만 에이전트를 붙인다.", "uid": "B12", "ko": "급여팀이 주간 근무표를 처리하는 에이전트를 설계 중이다. 대부분의 제출물은 잘 알려진 소수의 단계를 따르지만, 가끔 예상치 못한 형식의 근무표가 들어와 시스템이 재라우팅·제출자에게 해명 요청·사람 검토 플래그 중 하나를 골라야 한다. 가장 적합한 아키텍처는 무엇인가?"}, {"n": 13, "src": "응용문제2", "a": 2, "tag": "Design Trade-offs / Requirement Prioritization", "stem": "A pharmaceutical company uses Claude to summarize 200-page clinical study reports and to attach citations pointing back to the source sections. The team is debating whether to send each report whole or split into smaller pieces. The reports fit within Claude's context window. Early testing shows that whole-document processing produces summaries with stronger cross-section reasoning but sometimes drifts on citation accuracy in later sections, while chunked processing produces stronger citation accuracy per chunk and loses cross-section reasoning. The team has not decided which property matters more. How would you guide the team's decision?", "opts": ["Identify which property matters more for the application's actual use case and let that decision drive the chunking approach, then validate the choice against representative reports.", "Look closely at the cases where cross-section reasoning breaks down, and judge whether sending each report whole already reaches the accuracy the application needs on a sample of reports.", "Measure the cost and the response time of each approach against the application's performance targets, and recommend a processing strategy from those numbers.", "Study the citation scores that chunked processing produces and decide whether summaries without cross-section reasoning still clear the application's quality bar."], "ol": ["D", "A", "B", "C"], "why": "두 전략의 장점이 서로 다르고 팀이 우선순위를 정하지 못한 상황이므로, 실제 유스케이스에서 섹션 간 종합 추론과 인용 정확도 중 무엇이 더 중요한지를 먼저 확정해야 합니다. 그 기준으로 청킹 여부를 정하고 대표 보고서 데이터셋으로 검증하는 순서가 핵심입니다. 임상시험 보고서로 상황만 바뀌었을 뿐 판단 기준은 원본과 같습니다.", "trap": "A (Whole-path-only assessment): 전체 문서 방식 한쪽만 평가하면 어떤 속성이 더 중요한지 정하는 단계를 건너뛰게 됩니다. B (Criteria substitution): 비용과 지연 시간도 고려 요소지만, 이 문제의 갈등 축은 종합 추론과 인용 정확도라는 품질 속성의 우선순위입니다. C (Chunked-path-only assessment): 청킹 방식 한쪽만 검토하는 것도 마찬가지로 우선순위 결정 없이 결론을 내리는 것입니다. → 판단 기준: 유스케이스 기준 우선순위를 먼저 정하고, 그에 따라 전략을 고른 뒤 대표 데이터로 검증하는가.", "memo": "장단점이 상충할 때는 유스케이스 우선순위를 먼저 정하고 대표 데이터로 검증한다.", "uid": "B13", "ko": "한 제약사가 Claude로 200쪽짜리 임상 연구 보고서를 요약하고 원문 섹션을 가리키는 인용을 붙인다. 팀은 보고서를 통째로 보낼지 나눠 보낼지 논의 중이다. 보고서는 컨텍스트 윈도우 안에 들어간다. 초기 테스트 결과 통째 처리는 섹션 간 추론이 강하지만 뒷부분 인용 정확도가 흔들리고, 분할 처리는 청크별 인용 정확도가 높지만 섹션 간 추론을 잃는다. 팀은 어느 쪽이 더 중요한지 정하지 못했다. 결정을 어떻게 이끌겠는가?"}, {"n": 14, "src": "응용문제2", "a": 6, "tag": "Context Management / Tool Output Pruning", "stem": "A freight company runs a Claude agent that traces a shipment through several steps: it calls a carrier scan API, then a customs status service, then a warehouse dock system. Each raw response is used once at that step and is never read again later in the run, yet all of them keep piling up in the context window. How would you handle the accumulating tool output?", "opts": ["Apply tool output pruning to remove tool outputs that are no longer needed by later steps in the shipment workflow.", "Turn on prompt caching for the stored tool responses so the team does not pay again for that older text at each later step of the shipment run.", "Move the workflow to a smaller Claude model that reads long context more cheaply, and accept weaker tracing answers as the price of the savings.", "Retain every raw response in context for the entire run, giving the agent a complete record of each lookup it has already made."], "ol": ["B", "A", "C", "D"], "why": "이후 단계에서 다시 참조되지 않는 중간 툴 응답은 보관하거나 비용만 낮추는 것이 아니라, 그 내용 자체를 컨텍스트에서 걷어내는 것이 핵심입니다. 노이즈의 원인을 제거해야 모델의 지시 이탈과 품질 저하를 막을 수 있습니다. 화물 추적이라는 상황만 달라졌을 뿐 판단 기준은 원본과 같습니다.", "trap": "A (Cost-only caching): 캐싱은 반복 비용만 낮출 뿐, 불필요한 내용이 컨텍스트를 채워 생기는 품질 저하는 해결하지 못합니다. C (Model downgrade): 더 작은 모델로 바꾸는 것은 누적 자체를 없애지 못하고 품질만 떨어뜨립니다. D (Unbounded retention): 모든 툴 출력을 계속 보존하면 노이즈가 늘어 모델의 집중도와 지시 수행 능력이 나빠집니다. → 판단 기준: 이후 단계에서 쓰이지 않는 출력을 컨텍스트에서 실제로 덜어냈는가.", "memo": "더 이상 쓰이지 않는 중간 결과가 쌓일 때는 그 내용을 컨텍스트에서 덜어낸다.", "uid": "B14", "ko": "한 화물 회사가 Claude 에이전트로 배송을 여러 단계에 걸쳐 추적한다. 운송사 스캔 API, 통관 상태 서비스, 창고 도크 시스템을 차례로 호출한다. 각 원시 응답은 해당 단계에서 한 번 쓰이고 이후로는 다시 읽히지 않는데도 전부 컨텍스트 윈도우에 계속 쌓인다. 쌓이는 도구 출력을 어떻게 처리하겠는가?"}, {"n": 15, "src": "응용문제2", "a": 5, "tag": "Model Migration / Prompt Adaptation", "stem": "A bank's credit risk team uses Claude to review loan applications. A newer model version scores 9 percent better on the team's own reasoning cases, but it has changed how it responds to system prompts that are split into many labeled sections, and the team's prompts are built exactly that way. Measured on the team's real application traffic, the new version returns malformed output on about 4 percent of applications. The team is debating whether to upgrade. How would you decide?", "opts": ["Adapt the application's system prompt to the new model's format expectations and re-evaluate, then upgrade only if the adapted prompt eliminates the malformed output while preserving the reasoning improvements.", "Switch over at once, because a 9 percent gain on risk reasoning is worth more than malformed output on 4 percent of the loan applications the bank reviews.", "Deploy the new version and place a check after generation that catches the 4 percent of malformed credit records before analysts read them, and count that check as the fix.", "Keep the bank on the current version permanently, so the team never meets this malformed output rate or any format change that later releases may bring."], "ol": ["D", "A", "B", "C"], "why": "새 버전의 기대 형식이 달라져 출력이 깨질 때는, 그 차이에 맞게 시스템 프롬프트를 먼저 고치고 실제 워크로드로 다시 평가해 성능 이득은 남고 결함은 사라졌음을 확인한 뒤에 전환해야 합니다. 즉 근본 원인을 수정하고 재검증한 다음 전환하는 순서가 정답 기준입니다.", "trap": "A (Accept known defects): 알려진 결함을 안고 즉시 전환하는 것은 프로덕션 안정성과 사용자 경험을 크게 해칩니다. B (Downstream-only mitigation): 프롬프트를 고치지 않고 사후 검증으로만 막는 것은 근본 원인을 그대로 두는 대증 요법입니다. C (Permanent version freeze): 구버전에 영구히 머무르면 성능 향상의 이득을 전혀 얻지 못합니다. → 판단 기준: 달라진 형식 요구에 맞춰 프롬프트를 고치고 재평가한 뒤에 전환했는가.", "memo": "새 버전으로 옮길 때는 달라진 요구에 맞춰 프롬프트를 고친 뒤 다시 평가하고 전환한다.", "uid": "B15", "ko": "한 은행 신용 리스크 팀이 Claude로 대출 신청을 검토한다. 새 모델 버전이 팀 자체 추론 케이스에서 9% 더 높은 점수를 내지만, 여러 라벨 섹션으로 나뉜 시스템 프롬프트에 대한 응답 방식이 바뀌었고 팀의 프롬프트가 정확히 그런 구조다. 실제 신청 트래픽으로 측정하니 약 4%의 신청에서 형식이 잘못된 출력을 낸다. 팀은 업그레이드를 논의 중이다. 어떻게 결정하겠는가?"}, {"n": 16, "src": "응용문제2", "a": 5, "tag": "Model Selection / Quality-Latency-Cost Tradeoff", "stem": "A factory is choosing a Claude model to inspect photographs of parts coming off an assembly line. The team lists three requirements that pull against one another: inspection accuracy, response time on the line, and cost per inspected part. The right model is the one that...", "opts": ["fits the inspection task's quality, latency, and cost requirements together, recognizing that improving one dimension typically affects the others.", "reaches the accuracy the inspection needs at a response time the line accepts, with cost examined on its own after that accuracy and timing bar is fixed.", "hits the plant's cost target inside a set response-time budget, with accuracy confirmed on a sample of real parts after the model has been chosen.", "clears the line's response-time limit first, and is then measured against accuracy and cost limits to confirm the pick holds up on all three."], "ol": ["B", "A", "C", "D"], "why": "품질·레이턴시·비용처럼 서로 맞물린 기준은 하나를 먼저 통과시키고 나머지를 나중에 확인하는 단계적 필터링으로 다룰 수 없습니다. 한 축을 올리면 다른 축이 나빠진다는 점을 인정하고 세 기준을 동시에 만족하는 균형점을 고르는 것이 정답 기준입니다.", "trap": "A (Deferred cost review): 비용을 나중에 따로 검토하면 이미 정한 품질·속도 조합 때문에 비용을 조정할 여지가 사라집니다. C (Post-selection quality check): 선택을 끝낸 뒤에 품질을 확인하는 것은 절충이 아니라 사후 통보에 가깝습니다. D (Latency-first sequencing): 한 축을 먼저 통과시키는 순차 필터링은 축들이 서로 영향을 준다는 사실을 무시합니다. → 판단 기준: 세 기준을 순서대로 걸렀는가, 아니면 상호 영향을 인정하고 동시에 충족시켰는가.", "memo": "서로 맞물린 기준으로 골라야 할 때는 순서대로 거르지 말고 함께 충족하는 균형점을 찾는다.", "uid": "B16", "ko": "한 공장이 조립 라인에서 나오는 부품 사진을 검사할 Claude 모델을 고르고 있다. 팀은 서로 상충하는 세 요구를 정리했다 — 검사 정확도, 라인에서의 응답 시간, 부품당 검사 비용. 올바른 모델은 어떤 모델인가?"}, {"n": 17, "src": "응용문제2", "a": 8, "tag": "Tool Design / Tool Set Consolidation", "stem": "A city government runs a Claude agent for citizen service requests. Over several years each department registered its own tools, and many of them do nearly the same job: three separate tools look up a building permit, and two more file a noise complaint. The agent often calls an unsuitable tool when several of them could plausibly serve the same request. How would you address the tool selection problem?", "opts": ["Restructure the tool set by consolidating overlapping tools, removing unused tools, and clarifying tool descriptions so each tool has a distinct purpose.", "Delete every tool and let the agent answer from its own general knowledge, even though the city then loses the permit lookups and filings those tools performed.", "Register even more tools so that each variation of a citizen request gets its own dedicated tool, on the view that a longer list gives the agent a closer match.", "Write several sample requests into each tool description, and let those samples serve as the way the agent picks a tool for incoming work."], "ol": ["D", "A", "B", "C"], "why": "선택지가 서로 겹쳐 잘못 고르는 문제는 설명을 덧붙이거나 개수를 늘려서는 해결되지 않습니다. 중복 기능을 하나로 합치고 안 쓰는 것을 제거해 각 툴이 뚜렷이 구분되는 단일 목적을 갖도록 구조 자체를 정리하는 것이 정답 기준입니다.", "trap": "A (Total capability removal): 툴을 전부 제거하면 외부 시스템 연동 업무 자체가 불가능해집니다. B (Option proliferation): 툴을 더 늘리면 후보가 많아져 선택 혼동이 오히려 심해집니다. C (Description-only patch): 설명에 예시만 덧붙이는 것은 중복된 툴 구조라는 모호함의 원인을 그대로 남겨 둡니다. → 판단 기준: 중복을 통합하고 불필요한 것을 제거해 각 툴이 단일하고 구분되는 목적을 갖게 했는가.", "memo": "선택지가 겹쳐 혼동이 생길 때는 중복을 합치고 각각의 역할을 뚜렷하게 구분한다.", "uid": "B17", "ko": "한 시청이 민원 요청 처리를 위해 Claude 에이전트를 운영한다. 수년간 각 부서가 자체 도구를 등록해 왔고 상당수가 거의 같은 일을 한다 — 건축 허가를 조회하는 도구가 셋, 소음 민원을 접수하는 도구가 둘이다. 여러 도구가 같은 요청을 처리할 수 있는 상황에서 에이전트가 부적절한 도구를 자주 호출한다. 도구 선택 문제를 어떻게 해결하겠는가?"}, {"n": 18, "src": "응용문제2", "a": 1, "tag": "Agent Architecture / Multi-Agent Patterns", "stem": "You are reviewing an architecture diagram for a Claude-powered systematic literature review platform. One lead component reads the researcher's question, and three helper components handle paper search, citation analysis, and statistics extraction. The lead component decides which helpers to call, sets the order in which they run, and merges what they return into a single review summary. The diagram also marks that each helper keeps its own tool list and its own short message history that the other helpers cannot see. Which architectural pattern does the diagram most closely describe?", "opts": ["A manager and supervisor pattern with isolated context per subagent, where the top-level agent coordinates specialized subagents that each maintain their own conversation history and tool list.", "A manager and supervisor pattern built on one shared context, in which the lead component and all three helpers write into a single history that grows as the review proceeds.", "A pipeline pattern, in which the components run one after another and each hands the whole accumulated history forward to the component that follows it.", "A retrieval-augmented pattern, in which the lead component pulls matching passages from the indexed stores held by the helper components before writing any answer."], "ol": ["C", "A", "B", "D"], "why": "상위 구성요소가 호출 대상과 순서를 정하고 결과를 종합하며, 하위 전문 구성요소들이 각자 고유한 툴 목록과 공유되지 않는 개별 이력을 갖는 구조는 컨텍스트가 격리된 매니저·수퍼바이저 패턴입니다. 조정자의 존재와 컨텍스트 격리 여부라는 두 단서로 판정하는 기준은 원본과 동일합니다.", "trap": "A (Shared context variant): 단일 이력을 함께 쓰는 변형이며, 각 하위 단위가 이력을 따로 갖는다는 다이어그램 설명과 어긋납니다. B (Sequential pipeline): 순차 파이프라인에는 호출 순서를 정하고 결과를 종합하는 조정자가 없고 이력도 그대로 전달됩니다. D (Retrieval-based pattern): 인덱스에서 문서를 검색해 붙이는 구조로, 조정자가 전문 하위 단위를 지휘하는 구조와 다릅니다. → 판단 기준: 조정자가 존재하고 하위 단위가 각자 도구와 이력을 격리해 갖는가.", "memo": "조정자가 있고 하위 단위가 각자 도구와 이력을 따로 가질 때는 컨텍스트가 격리된 관리자 구조로 판단한다.", "uid": "B18", "ko": "Claude 기반 체계적 문헌 검토 플랫폼의 아키텍처 다이어그램을 검토 중이다. 리드 구성요소 하나가 연구자의 질문을 읽고, 보조 구성요소 셋이 논문 검색·인용 분석·통계 추출을 담당한다. 리드 구성요소는 어떤 보조를 부를지 정하고, 실행 순서를 지정하며, 반환값을 하나의 검토 요약으로 병합한다. 또한 각 보조는 자체 도구 목록과, 다른 보조가 볼 수 없는 자체 짧은 메시지 기록을 갖는다. 이 다이어그램이 가장 가깝게 묘사하는 아키텍처 패턴은 무엇인가?"}, {"n": 19, "src": "응용문제2", "a": 2, "tag": "Deployment / Provider Routing Constraints", "stem": "A hospital network has signed a cloud agreement stating that all Claude traffic must be sent through Google Cloud's Vertex AI rather than the direct Anthropic API. A team is starting a new Claude application for clinical documentation and has not worked under this constraint before. How would you build the application?", "opts": ["Configure the application to invoke Claude through the Vertex-compatible API path while keeping the application's logic provider-agnostic.", "Build the first version against the direct Anthropic API, and move it onto Vertex AI in a later release once the developers understand that platform better.", "Develop against the direct Anthropic API and proceed without following the signed agreement that all Claude traffic must reach Vertex AI.", "Code every call twice, once for the direct Anthropic API and once for Vertex AI, then let the system pick whichever path answers faster while running."], "ol": ["C", "A", "B", "D"], "why": "계약이나 거버넌스가 호출 경로를 강제할 때는 처음부터 그 규정된 경로로 호출하도록 구성해야 하며, 동시에 핵심 로직은 특정 제공자에 묶이지 않게 분리해 두어야 합니다. 요구사항을 처음부터 준수하면서 이식성도 잃지 않았는지가 정답 기준입니다.", "trap": "A (Deferred migration): 나중에 옮기겠다는 계획은 그 사이 기간 동안 계약을 위반하고 재작업 비용도 발생시킵니다. B (Requirement violation): 명시된 계약 요건을 지키지 않는 선택은 어떤 기술적 이유로도 정당화되지 않습니다. D (Parallel dual implementation): 모든 호출을 이중으로 구현해 런타임에 고르는 방식은 불필요한 복잡도와 관리 부담만 키웁니다. → 판단 기준: 처음부터 규정된 경로로 구성하면서 핵심 로직은 제공자에 종속되지 않게 분리했는가.", "memo": "호출 경로가 규정으로 정해져 있을 때는 처음부터 그 경로로 구성하고 로직은 종속되지 않게 분리한다.", "uid": "B19", "ko": "한 병원 네트워크가 모든 Claude 트래픽을 Anthropic 직접 API가 아니라 Google Cloud의 Vertex AI로 보내야 한다는 클라우드 계약을 체결했다. 한 팀이 임상 문서화를 위한 새 Claude 애플리케이션을 시작하는데 이 제약 아래서 일해 본 적이 없다. 애플리케이션을 어떻게 만들겠는가?"}, {"n": 20, "src": "응용문제2", "a": 2, "tag": "Structured Output / Schema Constraints", "stem": "A customs broker uses Claude to turn shipping paperwork into an electronic export declaration. The national border system accepts exactly one JSON shape and rejects anything that does not match it. You are writing the system prompt for this application. Your prompt would need to...", "opts": ["include explicit constraints describing the required JSON schema and an instruction to produce only output matching that schema.", "say nothing about the shape of the answer and leave a later code step to rebuild the declaration into the fields the border system will take.", "let Claude settle on whatever answer shape it judges best for each shipment the broker files with the border system.", "ask Claude for JSON on some declarations and plain sentences on others, so that both kinds of answer are collected."], "ol": ["B", "A", "C", "D"], "why": "하위 시스템이 정해진 형식만 받아들일 때는 요구되는 구조를 프롬프트 안에 명시적 제약으로 기술하고, 그 형식에 맞는 출력만 내도록 지시해 서문이나 자유 텍스트가 섞이지 않게 해야 합니다. 형식 요구를 프롬프트 단계에서 명시하고 단일 형식으로 강제했는지가 정답 기준입니다.", "trap": "A (Post-processing reliance): 프롬프트에서 형식을 언급하지 않고 후처리에만 의존하면 정보 손실과 환각 위험이 큽니다. C (Model-chosen format): 모델 재량에 형식을 맡기면 하위 시스템의 엄격한 스키마 요구를 충족할 수 없습니다. D (Mixed output formats): 자유 텍스트를 섞어 출력하면 하위 시스템에서 곧바로 거부 오류가 납니다. → 판단 기준: 요구 구조를 프롬프트에 명시하고 그 형식만 내도록 강제했는가.", "memo": "출력 형식이 엄격히 정해져 있을 때는 그 구조를 프롬프트에 명시하고 해당 형식만 내도록 강제한다.", "uid": "B20", "ko": "한 관세사가 Claude로 선적 서류를 전자 수출 신고서로 변환한다. 국가 세관 시스템은 정확히 하나의 JSON 형태만 받아들이고 맞지 않으면 전부 거부한다. 이 애플리케이션의 시스템 프롬프트를 작성 중이다. 프롬프트는 무엇을 해야 하는가?"}, {"n": 21, "src": "응용문제2", "a": 6, "tag": "Prompt Engineering / Few-Shot Examples", "stem": "A law firm wants Claude to summarize commercial contracts into a fixed clause-by-clause layout. A senior associate has already written twelve carefully labeled sample summaries that show exactly the layout the firm expects. You want to use these examples to guide Claude's behavior. How would you guide the application's behavior?", "opts": ["Use multi-shot prompting by including the labeled examples in the prompt so Claude can match the desired output format on each request.", "Send each contract with no examples at all, and rely on the model's general ability to produce the same summary layout on every matter the firm handles.", "Fine-tune a private model on the twelve samples before launch, so the running application never has to carry those samples inside a prompt.", "Place the samples in a shared document library where lawyers can open them for reference, and let the model work without seeing them."], "ol": ["C", "A", "B", "D"], "why": "원하는 출력 형태를 보여주는 잘 정리된 예시가 있다면, 그 예시를 실제 생성 시점의 프롬프트에 포함시켜 형식을 그대로 따라 하게 만드는 것이 가장 효과적입니다. 예시를 생성 순간의 프롬프트에 넣어 행동을 유도했는지가 정답 기준입니다.", "trap": "A (Zero-shot reliance): 예시 없이 제로샷으로 처리하면 지정된 복잡한 레이아웃을 일관되게 맞추기 어렵습니다. B (Custom model training): 예시 몇 개로 별도 모델을 학습시키는 것은 과도한 엔지니어링이며 퓨샷 프롬프팅이 훨씬 효율적입니다. D (Offline reference storage): 사람이 참고만 하는 보관은 모델의 생성 행동을 전혀 유도하지 못합니다. → 판단 기준: 예시를 생성 시점의 프롬프트에 실제로 포함해 형식을 따라 하게 했는가.", "memo": "원하는 형태의 예시가 있을 때는 그 예시를 프롬프트에 직접 포함해 따라 하게 한다.", "uid": "B21", "ko": "한 법무법인이 Claude로 상사 계약서를 조항별 고정 레이아웃 요약으로 만들려 한다. 선임 변호사가 회사가 기대하는 레이아웃을 정확히 보여주는 라벨링된 샘플 요약 12건을 이미 작성해 두었다. 이 예시들로 Claude의 동작을 유도하고 싶다. 어떻게 유도하겠는가?"}, {"n": 22, "src": "응용문제2", "a": 5, "tag": "Cost Optimization / Prompt Caching", "stem": "An online tutoring platform runs Claude for both long multi-turn lessons and single one-off homework questions. Every call carries the same lengthy grading rubric and subject guide. You want to use caching techniques to reduce your costs where they apply. A colleague suggests caching the model's answers as well, so the platform can skip a Claude call when a similar question arrives. You would apply prompt caching to...", "opts": ["the static portions of prompts that are repeated across requests, such as system prompts, instructions, or shared context.", "nothing, because caching saves no money once a single deployment carries both long lessons and one-off questions side by side.", "the answers the model writes, keeping each reply on hand so the platform can return it again when a close question arrives later.", "only the student's typed question in each call, since that part changes more than anything else the platform sends to the model."], "ol": ["B", "A", "C", "D"], "why": "프롬프트 캐싱은 요청마다 동일하게 되풀이되는 입력의 정적 구간, 즉 시스템 프롬프트나 공통 지시문, 공유 문서 같은 부분에 적용됩니다. 무엇이 캐싱 대상이고 무엇이 아닌지를 구분하는 기준은 원본과 같으며, 매번 달라지는 부분이나 생성 결과물은 대상이 아닙니다.", "trap": "A (Blanket inapplicability): 멀티턴과 단발성 요청이 섞여 있어도 반복되는 정적 구간에 캐싱하면 절감 효과가 큽니다. C (Output caching): 모델이 생성한 출력은 프롬프트 캐싱의 대상이 아닙니다. D (Dynamic input caching): 매번 바뀌는 사용자 입력은 캐시 이득이 없고 캐시 미스를 유발합니다. → 판단 기준: 요청마다 똑같이 반복되는 입력의 정적 구간을 대상으로 삼았는가.", "memo": "반복 비용을 줄여야 할 때는 요청마다 똑같이 되풀이되는 정적 입력 구간을 캐싱한다.", "uid": "B22", "ko": "한 온라인 튜터링 플랫폼이 긴 다중 턴 수업과 단발 숙제 질문 모두에 Claude를 쓴다. 모든 호출에 동일한 긴 채점 루브릭과 과목 가이드가 실린다. 해당되는 곳에 캐싱으로 비용을 줄이려 한다. 동료는 비슷한 질문이 올 때 호출을 건너뛸 수 있도록 모델의 답변도 캐시하자고 제안한다. 프롬프트 캐싱은 어디에 적용해야 하는가?"}, {"n": 23, "src": "응용문제2", "a": 2, "tag": "CI/CD / Automated Quality Gates", "stem": "An energy utility is adding a Claude outage-report assistant to its internal software platform. The platform team wants every pull request to pass automated checks before it can be merged, in line with how its other services are governed. The CI/CD checks would include...", "opts": ["automated tests of the Claude integration, linting, and any other standard quality gates the team applies to its other services.", "automated linting and security scanning, while one assigned engineer checks the Claude integration by hand during release sign-off.", "a complete rollout to the live outage platform on every pull request, so that every possible defect appears before the branch is merged.", "automated tests of the Claude integration alone, leaving linting to run on each developer's own laptop during local work."], "ol": ["D", "A", "B", "C"], "why": "병합 전 자동 검사 범위에는 새로 붙인 Claude 연동의 자동 테스트뿐 아니라, 팀이 다른 서비스에 이미 적용 중인 린팅과 보안 스캔 같은 표준 품질 게이트가 모두 들어가야 합니다. 자동화 범위를 축소하거나 일부를 수동·로컬로 미루지 않았는지가 정답 기준입니다.", "trap": "A (Manual verification step): 연동 테스트를 사람이 수동으로 도는 것은 CI/CD 자동화 원칙에 어긋납니다. B (Full deployment per change): PR마다 실제 운영 환경에 전체 배포하는 것은 위험하고 비효율적입니다. C (Local-only linting): 린팅을 개발자 로컬에만 맡기면 스타일 파편화와 검증 누락이 생깁니다. → 판단 기준: 새 연동 테스트와 기존 표준 품질 게이트를 모두 자동 검사에 포함했는가.", "memo": "병합 전 검증을 자동화할 때는 새 연동 테스트와 기존 표준 품질 검사를 모두 포함한다.", "uid": "B23", "ko": "한 전력 회사가 사내 소프트웨어 플랫폼에 Claude 정전 보고 어시스턴트를 추가한다. 플랫폼 팀은 다른 서비스와 마찬가지로 모든 풀 리퀘스트가 병합 전에 자동 검사를 통과하도록 하려 한다. CI/CD 검사에 무엇을 포함하겠는가?"}, {"n": 24, "src": "응용문제2", "a": 2, "tag": "Claude API / Batch Processing", "stem": "A university library runs a nightly job that uses Claude to pull structured metadata out of 12,000 scanned journal abstracts. No person waits in front of the screen for the result, the job starts once a day after closing time, and it may take several hours to finish. Which Claude API would you use?", "opts": ["The batch API, which is designed for non-interactive workloads with flexible completion windows.", "The realtime Messages API, sending many parallel requests so that every abstract is finished in the shortest possible time each night.", "The streaming responses API, writing each partial piece of an extracted record into the library index while the model is still producing it.", "The realtime Messages API, sending one abstract per request in a fixed order so the stored records keep a predictable sequence."], "ol": ["B", "A", "C", "D"], "why": "사람이 즉시 응답을 기다리지 않고 완료까지 몇 시간의 여유가 있는 대량 비대화형 작업이라는 워크로드 특성 자체가 배치 처리 방식과 정확히 들어맞습니다. 학술 문헌 메타데이터 추출이라는 상황만 달라졌을 뿐, '속도를 어떻게 높일까'가 아니라 '이 워크로드에 맞는 API 형태가 무엇인가'를 묻는 판단 기준은 원본과 같습니다.", "trap": "A (Realtime concurrency): 실시간 API를 병렬로 몰아치는 방식은 레이트 리밋과 동시성 제한을 그대로 떠안으며, 시간 여유가 있는 작업에 굳이 실시간 비용을 지불하게 됩니다. C (Streaming delivery): 스트리밍은 생성 중인 응답을 사용자에게 즉시 보여줄 때 쓰는 방식이라 야간 일괄 추출 작업에는 불필요합니다. D (Sequential realtime): 순차 실시간 호출은 순서만 보장할 뿐 1만 건 규모 작업의 처리량과 비용 문제를 전혀 해결하지 못합니다. → 판단 기준: 즉시 응답이 필요 없고 완료 기한에 여유가 있는 대량 비대화형 워크로드인가를 보고 그에 맞게 설계된 API를 고르는가.", "memo": "즉시 응답이 필요 없는 대량 비대화형 작업에는 배치 처리 방식을 사용한다.", "uid": "B24", "ko": "한 대학 도서관이 매일 밤 Claude로 스캔된 학술지 초록 12,000건에서 구조화된 메타데이터를 뽑는 작업을 돌린다. 결과를 화면 앞에서 기다리는 사람은 없고, 작업은 폐관 후 하루 한 번 시작되며, 완료까지 몇 시간이 걸려도 된다. 어떤 Claude API를 쓰겠는가?"}, {"n": 25, "src": "응용문제2", "a": 2, "tag": "Prompt Management / Versioning", "stem": "A factory quality team uses Claude to grade defect reports coming off its production lines. Some of the prompts sit in the code repository, some sit in a shared settings file, and some are assembled at runtime. Nothing is consistent, and last week a prompt was changed and reached the live line without any review. What steps would you take?", "opts": ["Establish a single source of truth for prompts, version-control them alongside code, and require code review for prompt changes.", "Build every prompt at runtime inside the application code, so engineers can change the wording on the spot without going through the usual review steps.", "Keep all prompt text in a shared online spreadsheet outside the repository, where any quality engineer can edit the rows whenever inspection rules change.", "Collect the prompts into one shared location, but let engineers apply urgent wording changes directly to production when review would hold up the line."], "ol": ["D", "A", "B", "C"], "why": "프롬프트를 코드와 동등한 자산으로 보고 단일 진실 공급원 확보, 코드와 함께하는 버전 관리, 변경 시 리뷰 필수화라는 세 요소를 모두 갖춰야 합니다. 제조 품질 검사라는 상황만 바뀌었을 뿐, 파편화와 무검토 배포라는 두 문제를 동시에 해결하는 선택지를 고르는 기준은 원본과 동일합니다.", "trap": "A (Inline runtime construction): 런타임 인라인 구성으로 몰아가면 파편화가 더 심해지고 검토 절차까지 우회하게 됩니다. B (Unversioned external store): 저장소 밖 스프레드시트로 빼면 이력 추적과 형상 관리가 완전히 사라집니다. C (Optional review): 단일화는 했지만 리뷰를 선택 사항으로 남기면 무검토 배포라는 원래 문제가 그대로 남습니다. → 판단 기준: 단일 진실 공급원 · 코드와 함께하는 버전 관리 · 리뷰 필수화 세 가지가 모두 들어 있는가.", "memo": "산출물이 시스템 동작을 좌우할 때는 코드와 동일한 단일화·버전 관리·필수 리뷰 절차를 사용한다.", "uid": "B25", "ko": "한 공장 품질팀이 생산 라인에서 나오는 불량 보고서를 Claude로 등급 분류한다. 프롬프트 일부는 코드 저장소에, 일부는 공유 설정 파일에, 일부는 런타임에 조립된다. 아무것도 일관되지 않고, 지난주에는 프롬프트가 변경되어 아무 검토 없이 실제 라인에 반영됐다. 어떤 조치를 취하겠는가?"}, {"n": 26, "src": "응용문제2", "a": 6, "tag": "Context Management / Parameter Semantics", "stem": "A city office uses Claude to summarize long citizen complaint case files, and requests keep failing because the input exceeds the context window. A new team member proposes raising the temperature parameter to make the failures stop. How would you respond?", "opts": ["Explain that temperature controls sampling randomness and is unrelated to context capacity, then address the context issue through summarization or chunking.", "Raise the temperature value as the new team member proposed, then watch the next several days of live case processing to see whether the limit errors stop.", "Delete the system prompt from every request, so the space it used can hold more of the citizen case file text instead.", "Tune temperature together with max_tokens, and treat that pair of settings as the office's standard way to relieve pressure from long case files."], "ol": ["A", "B", "C", "D"], "why": "temperature는 샘플링의 무작위성을 조절하는 값일 뿐 입력 길이 한계와는 아무 관련이 없으므로, 원인에 맞는 요약(Summarization)이나 청킹(Chunking)으로 입력 크기를 줄여야 합니다. 공공 민원 처리라는 상황만 달라졌을 뿐, 증상에 아무 설정값이나 손대지 않고 원인과 수단을 정확히 연결하는지를 묻는 기준은 원본과 같습니다.", "trap": "B (Irrelevant parameter tuning): 원인과 무관한 파라미터를 올려 두고 운영에서 지켜보는 것은 문제 해결이 아니라 시간 낭비입니다. C (Remove system prompt): 시스템 프롬프트를 없애면 공간은 조금 생기지만 역할 정의와 지시 수행 능력을 잃습니다. D (Combined parameter tuning): 무관한 값을 두 개 묶어도 여전히 무관하며, max_tokens는 출력 길이 한도일 뿐 입력 한계를 늘리지 않습니다. → 판단 기준: 제안된 설정값이 실제로 제어하는 대상과 문제의 실제 원인이 일치하는지를 먼저 확인하고 원인에 직접 대응하는가.", "memo": "문제를 해결해야 할 때는 원인과 무관한 설정값 조정 대신 원인에 직접 대응하는 기법을 사용한다.", "uid": "B26", "ko": "한 시청이 긴 민원 사건 파일을 Claude로 요약하는데, 입력이 컨텍스트 윈도우를 초과해 요청이 계속 실패한다. 신규 팀원이 실패를 멈추려면 temperature 값을 올리자고 제안한다. 어떻게 답하겠는가?"}, {"n": 27, "src": "응용문제2", "a": 1, "tag": "Agent SDK / Orchestration Delegation", "stem": "A bank is building a loan underwriting agent that must call several internal credit APIs and a risk database in a structured, repeatable way. The team has already decided to adopt the Claude Agent SDK instead of writing its own agent runtime. You are now defining the agent's tools and its execution loop. How would you set up the tools and execution loop?", "opts": ["Use the SDK's tool interface and let the SDK handle the loop, dispatch, and history.", "Define the tools with the SDK and run its loop, but keep every conversation turn in a separate database the team maintains.", "Define the tools with the SDK, then build the agent loop and the history layer again inside the bank's own service code.", "Skip the SDK, call the Messages API directly, and read each tool request out of plain text in the model's reply."], "ol": ["D", "A", "B", "C"], "why": "Agent SDK를 도입한 목적 자체가 실행 루프, 툴 디스패치, 대화 이력 관리를 SDK에 위임하는 것이므로, 개발자는 SDK 규격에 맞춰 툴만 정의하고 나머지 오케스트레이션은 내장 메커니즘에 맡겨야 합니다. 은행 여신 심사라는 상황만 바뀌었을 뿐, 프레임워크가 이미 추상화한 부분을 중복 구현하지 않는지를 묻는 기준은 원본과 같습니다.", "trap": "A (External history store): 이력만 외부 DB로 빼면 SDK가 관리하는 상태와 이중화되어 동기화 문제와 불필요한 복잡도가 생깁니다. B (Custom orchestration rebuild): 루프와 이력 계층을 직접 다시 만드는 것은 SDK를 채택한 이유를 스스로 없애는 중복 구현입니다. C (Plain-text tool calls): 평문으로 툴 호출을 주고받는 방식은 구조화된 Tool Use 규격을 무시해 파싱 오류와 신뢰성 문제를 낳습니다. → 판단 기준: 프레임워크가 이미 제공하는 실행 루프·디스패치·이력 관리를 직접 구현하지 않고 그대로 위임하는가.", "memo": "프레임워크를 도입했을 때는 직접 구현 대신 프레임워크가 제공하는 내장 메커니즘을 사용한다.", "uid": "B27", "ko": "한 은행이 여러 내부 신용 API와 리스크 데이터베이스를 구조적이고 반복 가능하게 호출해야 하는 대출 심사 에이전트를 만들고 있다. 팀은 자체 에이전트 런타임을 쓰지 않고 Claude Agent SDK를 채택하기로 이미 정했다. 이제 에이전트의 도구와 실행 루프를 정의하는 중이다. 어떻게 설정하겠는가?"}, {"n": 28, "src": "응용문제2", "a": 8, "tag": "Extensibility / Capability Selection", "stem": "An airline's booking platform team must add a new capability to its Claude application, and the choices on the table are a built-in tool, a custom tool, a Skill, and an MCP server. The team wants one clear rule for deciding among them. You would choose the option that...", "opts": ["matches the use case's scope, reuse needs, and integration context.", "carries the most recent release date of the four choices in front of the team.", "takes the least effort to build with the tooling and release process the team already runs.", "the engineers already know best from earlier projects that shipped similar features."], "ol": ["B", "A", "C", "D"], "why": "각 구현 수단은 서로 다른 영역을 담당하므로 작업 범위(Scope), 재사용 요구(Reuse needs), 연동 맥락(Integration context)이라는 유스케이스 요구사항이 선택의 기준이 되어야 합니다. 항공 예약 플랫폼이라는 상황만 달라졌을 뿐, 선택의 근거가 개발자 편의가 아니라 요구사항이어야 한다는 판단 기준은 원본과 동일합니다.", "trap": "A (Newest option bias): 가장 최신이라는 이유만으로 고르면 유스케이스와 맞지 않는 아키텍처 결정을 하게 됩니다. C (Ease of implementation): 구현이 쉽다는 기준은 개발 편의일 뿐 재사용 범위나 연동 요구를 반영하지 못합니다. D (Team familiarity): 팀 익숙도만 따르면 요구사항과 무관한 수단을 반복해서 선택하게 됩니다. → 판단 기준: 선택의 근거가 최신성·난이도·익숙도가 아니라 범위·재사용·연동 맥락이라는 유스케이스 요구사항인가.", "memo": "구현 방식을 선택해야 할 때는 편의나 선호가 아니라 유스케이스 요구사항을 기준으로 사용한다.", "uid": "B28", "ko": "한 항공사 예약 플랫폼 팀이 Claude 애플리케이션에 새 기능을 추가해야 하는데, 선택지는 내장 도구·커스텀 도구·Skill·MCP 서버다. 팀은 이 중에서 고를 명확한 기준 하나를 원한다. 어떤 기준으로 고르겠는가?"}, {"n": 29, "src": "응용문제2", "a": 7, "tag": "Security / Credential Isolation", "stem": "A telehealth provider keeps the API keys for its Claude application in a vault. Engineers are now arguing about whether the development, staging, and production environments should all read the same key from that vault. How would you handle the keys across environments?", "opts": ["Use distinct keys for each environment so a compromise in one environment does not affect the others during normal operation across the application's lifecycle.", "Keep one shared key in all three environments because it is simpler, and accept that a leak anywhere would reach every environment as a known cost.", "Replace the one shared key on an unpredictable schedule, on the view that frequent replacement alone keeps the three environments separated from each other.", "Deploy the development key to staging and production as well, since issuing a real production key to each environment would create too much exposure."], "ol": ["B", "A", "C", "D"], "why": "환경마다 독립된 별도 자격 증명을 사용해야 개발이나 스테이징에서 키가 유출되어도 운영 환경까지 번지지 않는 격리 구역이 만들어집니다. 원격 진료 플랫폼이라는 상황만 바뀌었을 뿐, 로테이션이나 편의성이 아니라 '분리 그 자체'가 격리를 만든다는 판단 기준은 원본과 같습니다.", "trap": "A (Shared key convenience): 편의를 위해 하나의 키를 공유하면 한 환경의 유출이 전 환경 보안 사고로 확대됩니다. C (Rotation without separation): 아무리 자주 교체해도 단일 키를 공유하는 한 환경 간 격리 효과는 전혀 생기지 않습니다. D (Dev key everywhere): 개발 키를 운영까지 밀어 넣는 것도 결국 단일 키 공유이며, 환경 간 독립성을 없애 노출 범위를 넓힙니다. → 판단 기준: 한 환경이 뚫려도 다른 환경이 영향을 받지 않도록 환경별로 서로 다른 자격 증명을 쓰는가.", "memo": "여러 환경을 운영해야 할 때는 환경마다 분리된 별도의 자격 증명을 사용한다.", "uid": "B29", "ko": "한 원격의료 사업자가 Claude 애플리케이션의 API 키를 볼트에 보관한다. 엔지니어들이 개발·스테이징·프로덕션 환경이 모두 같은 키를 볼트에서 읽어도 되는지 논쟁 중이다. 환경별로 키를 어떻게 다루겠는가?"}, {"n": 30, "src": "응용문제2", "a": 8, "tag": "Tool Use / Tool Definition Design", "stem": "A colleague on a retail returns team asks why the tools of your Claude agent carry long written descriptions when names such as start_refund already say what each tool does. The colleague proposes deleting the descriptions to keep the tool definitions short. How would you respond?", "opts": ["Explain that the model uses the tool description to decide when to call the tool, and descriptions disambiguate cases where the tool name is not enough.", "Accept the request, because a clear name such as start_refund already gives the model everything it needs on every shopper request the agent handles.", "Keep the wording but store it on the team's internal wiki page for tools, so the definitions stay short while the text remains available to engineers.", "Replace each description with two sample calls placed inside the definition, and treat those samples as enough on their own to cover the written explanation."], "ol": ["A", "B", "C", "D"], "why": "모델은 툴 정의에 담겨 실제로 전달되는 description 텍스트를 근거로 호출 시점과 인자 채우는 방법을 판단하므로, 이름만으로 해소되지 않는 모호함을 없애려면 설명이 정의 안에 남아 있어야 합니다. 소매 반품 처리라는 상황만 달라졌을 뿐, 모델의 판단 근거가 어디에 있어야 하는지를 묻는 기준은 원본과 같습니다.", "trap": "B (Name-only sufficiency): 이름만으로는 언제 호출해야 하는지와 파라미터 조건을 정확히 구분할 수 없습니다. C (External documentation): 위키로 빼면 모델에게 전달되는 JSON Schema에서 설명이 빠져 판단 근거 자체가 사라집니다. D (Examples as substitute): 호출 예시는 보조 자료로 유용할 뿐 줄글 설명을 완전히 대체하지 못합니다. → 판단 기준: 호출 시점을 판단할 근거가 모델에게 실제로 전달되는 툴 정의 안에 남아 있는가.", "memo": "모델이 스스로 판단하게 하려면 판단 근거를 모델에게 실제로 전달되는 정의 안에 담아 사용한다.", "uid": "B30", "ko": "소매 반품팀 동료가, start_refund처럼 이름만으로도 기능을 알 수 있는데 왜 Claude 에이전트의 도구에 긴 설명이 붙어 있느냐고 묻는다. 그 동료는 도구 정의를 짧게 유지하려고 설명을 지우자고 제안한다. 어떻게 답하겠는가?"}, {"n": 31, "src": "응용문제2", "a": 7, "tag": "Security / AI Threat Modeling", "stem": "A security lead at a government tax filing portal is updating the threat model now that the portal answers taxpayer questions with Claude. The lead has already written down the usual web application threats and asks which further categories a Claude application brings. Which AI-specific threat categories would you add?", "opts": ["Prompt injection, data leakage from prompts or context, jailbreak attempts, and unsafe model output that bypasses application controls.", "Compromised packages in the Claude client library, since that dependency is the single new weak point the portal gains once it starts calling a model.", "Traffic floods against the portal and break-ins at the hosting facility, since outages of that kind are the failures most often seen in live government systems.", "Script injection in the browser and unsafe database queries, since those long-standing web risks matter just as much once the portal adds a model call."], "ol": ["C", "A", "B", "D"], "why": "기존 웹·인프라 위협 목록에 추가로 올려야 할 것은 프롬프트 주입, 프롬프트나 컨텍스트를 통한 데이터 유출, 탈옥 시도, 통제를 우회하는 안전하지 않은 모델 출력처럼 모델·프롬프트 계층에서 새로 생기는 위협입니다. 공공 세무 포털이라는 상황만 바뀌었을 뿐, AI 도입으로 새로 생긴 공격 표면을 식별하는지를 묻는 기준은 원본과 같습니다.", "trap": "A (Single narrow vector): 클라이언트 라이브러리 공급망 하나로 좁히면 프롬프트·모델 계층의 다양한 위험을 전혀 담지 못합니다. B (Infrastructure-layer threats): 트래픽 폭주나 물리 침입은 일반 인프라 위협이지 AI 도입으로 새로 생긴 범주가 아닙니다. D (Traditional web threats): 스크립트 주입과 DB 질의 취약점은 보안 담당자가 이미 정리해 둔 기존 웹 위협의 재열거입니다. → 판단 기준: 기존 목록을 다시 나열하지 않고 모델·프롬프트 계층에서 새로 생기는 고유 위협 범주를 짚는가.", "memo": "위협을 정리해야 할 때는 기존 목록의 재열거가 아니라 그 기술이 새로 만들어 낸 고유 위협 범주를 사용한다.", "uid": "B31", "ko": "한 정부 세금 신고 포털의 보안 책임자가, 포털이 Claude로 납세자 질문에 답하게 되면서 위협 모델을 갱신하고 있다. 일반적인 웹 애플리케이션 위협은 이미 정리했고, Claude 애플리케이션이 추가로 가져오는 범주가 무엇인지 묻는다. 어떤 AI 고유 위협 범주를 추가하겠는가?"}, {"n": 32, "src": "응용문제2", "a": 2, "tag": "Dependency Management / Version Pinning", "stem": "A game studio runs several plugins inside the Claude tools that support its art and build pipelines. A plugin update last night broke one pipeline. Because nobody recorded which plugin versions were in use, the studio cannot tell which version was working before. How would you address this?", "opts": ["Add explicit plugin version tracking to the project's configuration so the team can identify, pin, and upgrade plugin versions deliberately.", "Leave the plugins unrecorded as outside code and wait for their authors to announce breaking changes, keeping no version list inside the studio.", "Remove every plugin and write the same features into the studio's own tools instead, so version problems can no longer appear at all.", "Move all plugins to their newest release on a fixed schedule so the gap between versions stays small, since a large gap is what makes breakage likely."], "ol": ["C", "A", "B", "D"], "why": "플러그인 버전을 프로젝트 설정 파일에 명시적으로 기록하고 안정 버전으로 고정해야 정상 동작하던 버전을 언제든 식별하고 되돌릴 수 있으며, 업그레이드도 의도적으로 진행할 수 있습니다. 게임 스튜디오 파이프라인이라는 상황만 달라졌을 뿐, '추적 불가'라는 근본 원인을 없애는 선택지를 고르는 기준은 원본과 같습니다.", "trap": "A (Untracked dependencies): 버전을 기록하지 않고 작성자 공지에만 의존하면 지금의 추적 불가 상태가 그대로 유지됩니다. B (Total avoidance): 플러그인을 전부 걷어내고 직접 만드는 것은 과도한 회피책이며 개발 리소스만 낭비합니다. D (Blind latest upgrade): 검증 없이 최신으로만 올리면 회귀 위험에 계속 노출되고 되돌릴 기준 버전도 여전히 없습니다. → 판단 기준: 버전을 설정에 명시적으로 기록·고정해 식별과 복구가 가능하고 업그레이드를 의도적으로 수행할 수 있게 하는가.", "memo": "외부 구성요소에 의존할 때는 버전을 명시적으로 기록·고정하고 의도적인 업그레이드 절차를 사용한다.", "uid": "B32", "ko": "한 게임 스튜디오가 아트·빌드 파이프라인을 지원하는 Claude 도구 안에서 여러 플러그인을 운영한다. 어젯밤 플러그인 업데이트로 파이프라인 하나가 깨졌다. 아무도 어떤 플러그인 버전을 쓰고 있었는지 기록하지 않아 이전에 정상이던 버전을 알 수 없다. 어떻게 해결하겠는가?"}, {"n": 33, "src": "응용문제2", "a": 7, "tag": "Security / Data Boundary Control", "stem": "A recruiting company is designing a Claude application that screens resumes uploaded by candidates. Those files may carry sensitive details such as national ID numbers or bank account numbers that the company must not send to Claude. How would you design the application?", "opts": ["Define the application boundary explicitly, identify what content can leave the boundary for Claude, and add filtering or redaction at the boundary.", "Mask only the sensitive patterns seen most often in resumes at first, then add more patterns later as live monitoring shows which ones were missed.", "Write a line in the system prompt that lists the personal details Claude must ignore while reading each uploaded resume.", "Record the full text of every resume before the request leaves, and have the security team read those records each month to check for exposed data."], "ol": ["B", "A", "C", "D"], "why": "민감 정보가 외부 모델로 전송되기 전에 애플리케이션 경계를 명확히 정의하고, 그 경계를 넘어갈 수 있는 콘텐츠를 식별한 뒤 경계 지점에서 필터링·비식별화로 차단해야 합니다. 채용 이력서 심사라는 상황만 바뀌었을 뿐, 사후 점검이나 모델에 대한 지시가 아니라 전송 이전 차단인지를 묻는 판단 기준은 원본과 같습니다.", "trap": "A (Partial pattern coverage): 흔한 패턴만 먼저 막고 나중에 넓히는 방식은 초기 유출을 막지 못하는 미봉책입니다. C (Prompt-only instruction): '무시하라'는 지시는 이미 데이터가 모델로 전송된 뒤의 이야기라 유출 자체를 막지 못합니다. D (Post-hoc logging review): 로그를 남기고 주기적으로 검토하는 사후 조치는 예방이 아니며, 로깅 시스템에 민감 정보를 다시 쌓는 허점을 만듭니다. → 판단 기준: 민감 정보가 외부로 나가기 전에 경계를 정의하고 그 경계에서 필터링·비식별화로 사전 차단하는가.", "memo": "민감한 데이터를 다뤄야 할 때는 외부로 나가기 전 경계 지점에서의 사전 차단을 사용한다.", "uid": "B33", "ko": "한 채용 회사가 지원자가 올린 이력서를 선별하는 Claude 애플리케이션을 설계 중이다. 그 파일에는 주민등록번호나 계좌번호처럼 Claude에 보내면 안 되는 민감 정보가 포함될 수 있다. 애플리케이션을 어떻게 설계하겠는가?"}, {"n": 34, "src": "응용문제2", "a": 4, "tag": "Error Handling / Output Parsing Robustness", "stem": "A factory quality team uses Claude to turn inspector notes into structured records, and a defect tracking service reads those records directly. Some records come back with a field the service was not built for, and the team wants such cases handled smoothly instead of taking the service down. The best choice for handling this issue would be to...", "opts": ["apply defensive parsing to handle unexpected fields, missing values, and type mismatches that the defect tracking service might otherwise crash on.", "clear every record that does not match the expected shape and keep no copy of it, so the defect tracking service is never given bad data.", "let the whole run fail each time an unusual field arrives, and have an engineer repair the affected record by hand before work continues.", "keep using whatever the model returns for now and postpone schema checks until the inspection system reaches a later release."], "ol": ["B", "A", "C", "D"], "why": "모델 응답에는 예상 밖의 필드, 빠진 값, 다른 타입이 언제든 섞여 들어올 수 있으므로 파싱 단계에서 이를 흡수하는 방어적 파싱을 구현해야 합니다. 기본값 설정과 타입 검증을 파싱 코드에 넣어 두면 응답에 이상이 있어도 결함 추적 서비스가 멈추지 않습니다. 제조 검사라는 상황만 달라졌을 뿐, '우아한 처리'를 만족하는 방식은 원본과 동일합니다.", "trap": "A (Silent drop): 기록 없이 조용히 지우면 데이터가 사라지고 원인 추적도 불가능해집니다. C (Crash and manual recovery): 이상마다 실행을 중단시키고 사람 손을 기다리는 것은 운영 안정성에 치명적입니다. D (Deferred enforcement): 스키마 검증을 나중 릴리스로 미루는 것은 결함을 프로덕션에 방치하는 선택입니다. → 판단 기준: 예상 밖 출력을 파싱 단계에서 흡수해 하위 시스템이 죽지 않게 설계했는가.", "memo": "예상 밖의 출력이 들어올 수 있을 때는 방어적 파싱으로 우아하게 처리한다.", "uid": "B34", "ko": "한 공장 품질팀이 검사원 메모를 Claude로 구조화된 기록으로 바꾸고, 불량 추적 서비스가 그 기록을 직접 읽는다. 일부 기록에 서비스가 예상하지 못한 필드가 섞여 돌아오는데, 팀은 서비스가 죽는 대신 이런 경우를 매끄럽게 처리하길 원한다. 가장 좋은 선택은 무엇인가?"}, {"n": 35, "src": "응용문제2", "a": 1, "tag": "Multi-Agent Architecture / Orchestrator Governance", "stem": "A pharmaceutical company runs a multi-agent system for clinical literature review. A primary agent breaks each research question apart and delegates subtasks to three specialized subagents: one for paper retrieval, one for evidence grading, and one for summary writing. In production, reviewers see the subagents repeating the same tool calls, running past their token limits at times, and returning summaries that disagree with one another, and the primary agent forwards all of it without any check. What is the most appropriate way to address these failures?", "opts": ["Strengthen the primary agent's management layer to enforce per-subagent tool
